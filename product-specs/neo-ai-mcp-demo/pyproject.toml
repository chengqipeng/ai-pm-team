[project]
name = "neo-ai-mcp-demo"
version = "0.1.0"
description = "MCP Service Demo — 按业务域划分多个 MCP Server，统一对外提供 MCP 接口"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Neo AI Team" }]

dependencies = [
    "neo-ai-registry-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
