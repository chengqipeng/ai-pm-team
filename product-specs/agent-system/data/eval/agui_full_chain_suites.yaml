      # ─── 2.2 中断确认链路 ───
      - id: suite_interrupt_resume
        name: "Interrupt/Resume 链路"
        description: "覆盖4种中断类型(confirm/select/multi_select/input)的完整交互"
        layer: reasoning
        stage: interrupt
        cases:
          # ═══ A. confirm 类型（确认/取消）═══
          - id: ir_confirm_delete_001
            name: "[confirm]高危删除确认-用户同意"
            input: "删除客户华为的所有数据"
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: confirm
              - type: interrupt_content_contains
                expected: ["确认", "删除", "华为"]
            resume:
              value: "确认删除"
              assertions:
                - type: tool_call_check
                  expected: modify_data
                  mode: must_call
                - type: contains_any
                  expected: ["已删除", "删除成功"]
          - id: ir_confirm_delete_002
            name: "[confirm]高危删除确认-用户拒绝"
            input: "删除所有过期的商机记录"
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: confirm
            resume:
              value: "取消"
              assertions:
                - type: tool_call_check
                  expected: modify_data
                  mode: must_not_call
                - type: contains_any
                  expected: ["已取消", "不会删除", "取消操作"]
          - id: ir_confirm_batch_001
            name: "[confirm]批量修改确认"
            input: "把所有prospecting阶段的商机负责人改成user_li"
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_content_contains
                expected: ["批量", "修改", "确认"]
            resume:
              value: "确认执行"
              assertions:
                - type: tool_call_check
                  expected: modify_data
                  mode: must_call
          - id: ir_confirm_cancel_order_001
            name: "[confirm]订单取消确认"
            input: "取消订单 ORD-001"
            mock_tools:
              query_data: {order_id: "ORD-001", status: "pending_payment", amount: 5000}
            assertions:
              - type: interrupt_triggered
                expected: true
                description: "大金额订单取消应触发确认"
              - type: interrupt_content_contains
                expected: ["取消", "ORD-001", "5000"]
            resume:
              value: "确认取消"
              assertions:
                - type: tool_call_check
                  expected: cancel_order
                  mode: must_call
          # ═══ B. select 类型（单选）═══
          - id: ir_select_customer_001
            name: "[select]模糊匹配-选择客户"
            input: "查看华为的商机"
            mock_tools:
              query_data: [{id: "acc_001", name: "华为技术有限公司"}, {id: "acc_011", name: "华为股份有限公司"}]
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: select
              - type: interrupt_options_count
                min: 2
              - type: interrupt_content_contains
                expected: ["华为技术", "华为股份"]
            resume:
              value: {id: "acc_001", label: "华为技术有限公司"}
              assertions:
                - type: tool_call_check
                  expected: query_data
                  mode: must_call
                - type: contains_any
                  expected: ["华为技术"]
          - id: ir_select_contact_001
            name: "[select]多联系人选择"
            input: "给华为的联系人发送报价单"
            mock_tools:
              query_data: [{name: "张伟", title: "IT总监"}, {name: "李娜", title: "采购经理"}, {name: "刘峰", title: "项目经理"}]
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: select
              - type: interrupt_content_contains
                expected: ["联系人", "选择"]
            resume:
              value: {id: "con_002", label: "李娜-采购经理"}
              assertions:
                - type: contains_any
                  expected: ["李娜"]
          - id: ir_select_stage_001
            name: "[select]商机阶段选择"
            input: "推进华为ERP商机到下一个阶段"
            mock_tools:
              query_data: {name: "华为ERP实施", stage: "proposal"}
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: select
              - type: interrupt_content_contains
                expected: ["阶段"]
            resume:
              value: {id: "negotiation", label: "谈判"}
              assertions:
                - type: tool_call_check
                  expected: modify_data
                  mode: must_call
          # ═══ C. multi_select 类型（多选）═══
          - id: ir_multi_select_001
            name: "[multi_select]批量选择商机"
            input: "把华为的几个商机标记为重点跟进"
            mock_tools:
              query_data: [{id: "opp_001", name: "华为ERP"}, {id: "opp_002", name: "华为CRM"}, {id: "opp_003", name: "华为BI"}]
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: multi_select
              - type: interrupt_options_count
                min: 2
            resume:
              value: [{id: "opp_001"}, {id: "opp_002"}]
              assertions:
                - type: tool_call_check
                  expected: modify_data
                  mode: must_call
          - id: ir_multi_select_fields_001
            name: "[multi_select]选择导出字段"
            input: "导出客户数据，我选择要导出的字段"
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: multi_select
              - type: interrupt_content_contains
                expected: ["字段"]
            resume:
              value: [{id: "name"}, {id: "industry"}, {id: "city"}]
              assertions:
                - type: contains_any
                  expected: ["导出", "完成"]
          # ═══ D. input 类型（文本输入）═══
          - id: ir_input_reason_001
            name: "[input]输入操作原因"
            input: "关闭商机华为BI平台"
            mock_tools:
              query_data: {id: "opp_003", name: "华为BI平台", stage: "qualification"}
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: input
              - type: interrupt_content_contains
                expected: ["原因", "关闭"]
            resume:
              value: "客户预算缩减，项目暂停"
              assertions:
                - type: tool_call_check
                  expected: modify_data
                  mode: must_call
          - id: ir_input_note_001
            name: "[input]补充备注信息"
            input: "给客户比亚迪添加一条跟进记录"
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: input
              - type: interrupt_content_contains
                expected: ["跟进", "内容"]
            resume:
              value: "电话沟通了MES项目进展，客户表示Q3有预算"
              assertions:
                - type: contains_any
                  expected: ["已添加", "跟进记录"]
          - id: ir_input_search_001
            name: "[input]搜索条件补充"
            input: "帮我找一下那个做芯片的客户"
            assertions:
              - type: interrupt_triggered
                expected: true
              - type: interrupt_type
                expected: input
              - type: interrupt_content_contains
                expected: ["关键词", "名称", "补充"]
            resume:
              value: "海思半导体"
              assertions:
                - type: tool_call_check
                  expected: query_data
                  mode: must_call
          # ═══ E. 不触发中断场景 ═══
          - id: ir_no_interrupt_001
            name: "[不中断]低风险查询"
            input: "查看客户华为的基本信息"
            mock_tools:
              query_data: {name: "华为", industry: "通信设备"}
            assertions:
              - type: interrupt_triggered
                expected: false
                description: "纯查询不应触发中断"
          - id: ir_no_interrupt_002
            name: "[不中断]明确无歧义操作"
            input: "新建客户，名称小米科技，行业消费电子，城市北京"
            mock_tools:
              modify_data: {success: true}
            assertions:
              - type: interrupt_triggered
                expected: false
                description: "信息完整无歧义时不应中断"
          - id: ir_no_interrupt_003
            name: "[不中断]分析统计"
            input: "按行业统计客户数量"
            mock_tools:
              analyze_data: {results: [{industry: "通信", count: 3}]}
            assertions:
              - type: interrupt_triggered
                expected: false
                description: "分析操作无副作用不应中断"

      # ─── 2.3 子Agent委派 ───
      - id: suite_subagent
        name: "子Agent委派"
        description: "验证Skill分发和子Agent结果聚合"
        layer: reasoning
        stage: subagent
        cases:
          - id: sa_delegate_001
            name: "技能正确分发"
            input: "分析客户张三的全景数据"
            assertions:
              - type: skill_invoked
                expected_skill: customer_360_analysis
              - type: contains_any
                expected: ["张三", "客户分析"]
          - id: sa_depth_001
            name: "嵌套深度限制"
            input: "对比分析5个客户的全部数据并生成报告"
            assertions:
              - type: subagent_max_depth
                max: 3
              - type: no_error

      # ─── 2.4 回复质量 ───
      - id: suite_response_quality
        name: "回复质量(LLM Judge)"
        description: "语义质量、专业性、完整性"
        layer: reasoning
        stage: response_quality
        cases:
          - id: rq_friendly_001
            name: "模糊表达友好回复"
            input: "我昨天买的那个东西不想要了"
            mock_tools:
              query_data: {order_id: "ORD-005", item: "蓝牙耳机", amount: 199}
              cancel_order: {success: true, refund_amount: 199}
            assertions:
              - type: llm_judge
                criteria:
                  - {name: correctness, weight: 2.0, rubric: "准确理解退货意图并执行"}
                  - {name: helpfulness, weight: 1.0, rubric: "给出退款时间等后续信息"}
                  - {name: tone, weight: 0.5, rubric: "语气友好专业"}
                pass_threshold: 3.5
          - id: rq_error_handle_001
            name: "错误场景优雅回复"
            input: "查看订单 ORD-99999"
            mock_tools:
              query_data: null
            assertions:
              - type: llm_judge
                criteria:
                  - {name: correctness, weight: 2.0, rubric: "明确告知订单不存在"}
                  - {name: helpfulness, weight: 1.5, rubric: "建议用户检查订单号或提供其他帮助"}
                pass_threshold: 3.0
              - type: not_contains
                forbidden: ["系统错误", "异常", "traceback"]

  # ═══════════════════════════════════════════════════════════
  # Layer 3：AG-UI 协议层评测
  # ═══════════════════════════════════════════════════════════
  - id: layer_3_agui_protocol
    name: "AG-UI协议层"
    description: "AGUIConverter + Renderer + 状态机"
    suites:
      # ─── 3.1 事件映射正确性 ───
      - id: suite_event_mapping
        name: "事件映射正确性"
        description: "LangGraph事件→AG-UI事件映射"
        layer: protocol
        stage: agui_converter
        cases:
          - id: em_text_001
            name: "文本流映射"
            langgraph_events:
              - {event: on_chat_model_stream, data: {chunk: {content: "Hello"}}}
              - {event: on_chat_model_stream, data: {chunk: {content: " World"}}}
              - {event: on_chat_model_end, data: {}}
            assertions:
              - type: agui_event_sequence
                expected:
                  - {type: TEXT_MESSAGE_START}
                  - {type: TEXT_MESSAGE_CONTENT, data_contains: {delta: "Hello"}}
                  - {type: TEXT_MESSAGE_CONTENT, data_contains: {delta: " World"}}
                  - {type: TEXT_MESSAGE_END}

          - id: em_tool_001
            name: "工具调用映射"
            langgraph_events:
              - {event: on_chat_model_stream, data: {chunk: {tool_call_chunks: [{name: query_data, args: '{"order_id":', id: tc1}]}}}
              - {event: on_chat_model_stream, data: {chunk: {tool_call_chunks: [{args: '"ORD-001"}', id: tc1}]}}}
              - {event: on_tool_end, data: {name: query_data, output: '{"status":"pending"}'}}
            assertions:
              - type: agui_event_sequence
                expected:
                  - {type: TOOL_CALL_START, data_contains: {tool_call_name: query_data}}
                  - {type: TOOL_CALL_ARGS}
                  - {type: TOOL_CALL_ARGS}
                  - {type: TOOL_CALL_RESULT}
                  - {type: TOOL_CALL_END}
          - id: em_reasoning_001
            name: "推理流映射"
            langgraph_events:
              - {event: on_chat_model_stream, data: {chunk: {thinking: "Let me analyze..."}}}
              - {event: on_chat_model_stream, data: {chunk: {content: "The answer is..."}}}
            assertions:
              - type: agui_event_sequence
                expected:
                  - {type: REASONING_START}
                  - {type: REASONING_MESSAGE_START}
                  - {type: REASONING_MESSAGE_CONTENT}
                  - {type: REASONING_MESSAGE_END}
                  - {type: REASONING_END}
                  - {type: TEXT_MESSAGE_START}
                  - {type: TEXT_MESSAGE_CONTENT}
          - id: em_step_001
            name: "Skill步骤映射"
            langgraph_events:
              - {event: on_chain_start, name: "skill_knowledge_doc_search"}
              - {event: on_chain_end, name: "skill_knowledge_doc_search", output: "result text"}
            assertions:
              - type: agui_event_contains
                expected_type: STEP_STARTED
                data_contains: {step_name: knowledge_doc_search}
              - type: agui_event_contains
                expected_type: STEP_FINISHED
                data_contains: {step_name: knowledge_doc_search}

      # ─── 3.2 三流互斥状态机 ───
      - id: suite_stream_mutex
        name: "三流互斥状态机"
        description: "text/reasoning/tool流不能并行"
        layer: protocol
        stage: stream_mutex
        cases:
          - id: sm_text_to_tool_001
            name: "文本→工具流切换"
            langgraph_events:
              - {event: on_chat_model_stream, data: {chunk: {content: "Let me check"}}}
              - {event: on_chat_model_stream, data: {chunk: {tool_call_chunks: [{name: search, id: t1}]}}}
            assertions:
              - type: event_order_strict
                before: TEXT_MESSAGE_END
                after: TOOL_CALL_START
                description: "工具流开启前文本流必须关闭"
          - id: sm_reasoning_to_text_001
            name: "推理→文本流切换"
            langgraph_events:
              - {event: on_chat_model_stream, data: {chunk: {thinking: "thinking..."}}}
              - {event: on_chat_model_stream, data: {chunk: {content: "answer"}}}
            assertions:
              - type: event_order_strict
                before: REASONING_END
                after: TEXT_MESSAGE_START
          - id: sm_no_parallel_001
            name: "不存在并行流"
            description: "任何完整事件序列中不应出现两个流同时active"
            full_execution: true
            assertions:
              - type: no_concurrent_streams
                streams: [text, reasoning, tool]

      # ─── 3.3 ProgressiveRenderer ───
      - id: suite_renderer
        name: "ProgressiveRenderer"
        description: "组件生命周期事件注入"
        layer: protocol
        stage: renderer
        cases:
          - id: rr_lifecycle_001
            name: "有匹配组件-完整生命周期"
            skill_apikey: customer_360_analysis
            component_match: CrmRecordCard
            agui_input_events:
              - {type: STEP_STARTED, data: {step_name: customer_360_analysis}}
              - {type: CUSTOM, data: {name: skill_output, value: {apikey: customer_360_analysis, data: {name: "张三"}}}}
              - {type: STEP_FINISHED, data: {step_name: customer_360_analysis}}
            assertions:
              - type: agui_event_contains
                expected_type: CUSTOM
                data_contains: {name: component_loading}
              - type: agui_event_contains
                expected_type: CUSTOM
                data_contains: {name: component_complete}
              - type: event_order_strict
                before: component_loading
                after: component_complete
              - type: skill_output_intercepted
                description: "skill_output不应透传到输出"
          - id: rr_no_match_001
            name: "无匹配组件-不注入lifecycle"
            skill_apikey: unknown_internal_skill
            component_match: null
            agui_input_events:
              - {type: STEP_STARTED, data: {step_name: unknown_internal_skill}}
              - {type: STEP_FINISHED, data: {step_name: unknown_internal_skill}}
            assertions:
              - type: agui_event_not_contains
                name: component_loading
              - type: agui_event_not_contains
                name: component_complete

      # ─── 3.4 子Agent事件过滤 ───
      - id: suite_subagent_filter
        name: "子Agent事件过滤"
        description: "子Agent内部事件不泄露，custom穿透"
        layer: protocol
        stage: subagent_filter
        cases:
          - id: sf_filter_001
            name: "子Agent文本事件被过滤"
            root_run_id: root_123
            langgraph_events:
              - {event: on_chat_model_stream, parent_ids: [root_123], data: {chunk: {content: "Main reply"}}}
              - {event: on_chat_model_stream, parent_ids: [sub_456], data: {chunk: {content: "Sub internal text"}}}
            assertions:
              - type: agui_output_contains
                delta: "Main reply"
              - type: agui_output_not_contains
                delta: "Sub internal text"
          - id: sf_passthrough_001
            name: "子Agent custom事件穿透"
            root_run_id: root_123
            langgraph_events:
              - {event: on_custom_event, parent_ids: [sub_456], name: agent_data, data: {model_name: component, value: {key: "val"}}}
            assertions:
              - type: agui_event_contains
                expected_type: CUSTOM
                description: "on_custom_event 不受子Agent过滤"

  # ═══════════════════════════════════════════════════════════
  # Layer 4：A2UI 层评测
  # ═══════════════════════════════════════════════════════════
  - id: layer_4_a2ui
    name: "A2UI层"
    description: "Builder + Aggregator + Catalog + Emitter"
    suites:
      # ─── 4.1 Builder 组件构建 ───
      - id: suite_builder
        name: "A2UI Builder"
        description: "验证组件树构建正确性"
        layer: a2ui
        stage: builder
        cases:
          - id: bd_basic_001
            name: "基础组件树构建"
            builder_calls:
              - {method: column, args: {id: root, children: [title, list]}}
              - {method: text, args: {id: title, literal: "客户列表", usage_hint: h2}}
              - {method: list_template, args: {id: list, data_binding: "/data/customers", template_id: row}}
            assertions:
              - type: message_types
                expected: [SurfaceUpdate, BeginRendering]
              - type: component_exists
                ids: [root, title, list]
              - type: component_type_match
                checks:
                  - {id: root, type: Column}
                  - {id: title, type: Text}
              - type: begin_rendering_root
                expected: root
          - id: bd_root_auto_001
            name: "Root自动选择-首个容器"
            builder_calls:
              - {method: text, args: {id: label1}}
              - {method: column, args: {id: col1}}
              - {method: text, args: {id: label2}}
            assertions:
              - type: begin_rendering_root
                expected: col1
                description: "首个容器组件应被选为root"
          - id: bd_binding_001
            name: "BoundValue路径绑定"
            builder_calls:
              - {method: column, args: {id: root, children: [name]}}
              - {method: text, args: {id: name, path: "/data/user/name"}}
            assertions:
              - type: component_prop_binding
                id: name
                prop: text
                binding_type: path
                expected_path: "/data/user/name"

      # ─── 4.2 Aggregator 状态管理 ───
      - id: suite_aggregator
        name: "Aggregator状态管理"
        description: "STATE_SNAPSHOT/DELTA决策"
        layer: a2ui
        stage: aggregator
        cases:
          - id: ag_first_001
            name: "首次add产出SNAPSHOT"
            operations:
              - {method: add, render_type: customers, data: [{id: C1, name: "工行"}]}
            assertions:
              - type: output_event_type
                expected: STATE_SNAPSHOT
              - type: state_path_exists
                path: data.customers
              - type: state_path_exists
                path: panelSurfaceMap.customers
          - id: ag_delta_001
            name: "小增量产出DELTA"
            operations:
              - {method: add, render_type: customers, data: [{id: C1, name: "工行"}]}
              - {method: add, render_type: customers, data: [{id: C1, name: "工商银行"}]}
            assertions:
              - type: second_output_event_type
                expected: STATE_DELTA
              - type: delta_op_exists
                op: replace
          - id: ag_notification_001
            name: "通知消息注入"
            operations:
              - {method: add, render_type: x, data: {}, notification_message: "✅ 加载完成"}
            assertions:
              - type: state_path_contains
                path: notifications
                expected: {type: info, message: "✅ 加载完成"}

      # ─── 4.3 Catalog 协商 ───
      - id: suite_catalog
        name: "Catalog协商"
        description: "客户端-服务端Catalog协商"
        layer: a2ui
        stage: catalog
        cases:
          - id: cat_match_001
            name: "优先选业务Catalog"
            client_supported: ["viking.crm-v1", "a2ui.standard-v0.8"]
            server_available: ["viking.crm-v1", "a2ui.standard-v0.8"]
            assertions:
              - type: negotiated_result
                expected: "viking.crm-v1"
          - id: cat_fallback_001
            name: "降级标准Catalog"
            client_supported: ["a2ui.standard-v0.8"]
            server_available: ["viking.crm-v1", "a2ui.standard-v0.8"]
            assertions:
              - type: negotiated_result
                expected: "a2ui.standard-v0.8"
          - id: cat_no_overlap_001
            name: "无交集使用默认"
            client_supported: ["custom.unknown-v1"]
            server_available: ["viking.crm-v1", "a2ui.standard-v0.8"]
            assertions:
              - type: negotiated_result
                expected: "a2ui.standard-v0.8"

      # ─── 4.4 ComponentMatcher ───
      - id: suite_component_matcher
        name: "ComponentMatcher 5层匹配"
        description: "组件匹配优先级验证"
        layer: a2ui
        stage: component_matcher
        cases:
          - id: cm_bind_001
            name: "Layer1-bind精确绑定"
            skill_apikey: customer_360_analysis
            catalog:
              CrmRecordCard: {skill_bindings: {bind: [customer_360_analysis]}}
              GenericCard: {skill_bindings: {prefer: [customer_360_analysis]}}
            assertions:
              - type: resolved_component
                expected: CrmRecordCard
                match_layer: 1
                description: "bind优先级高于prefer"
          - id: cm_prefer_001
            name: "Layer2-prefer首选"
            skill_apikey: customer_list
            catalog:
              CrmRecordCard: {skill_bindings: {prefer: [customer_list]}}
            assertions:
              - type: resolved_component
                expected: CrmRecordCard
                match_layer: 2
          - id: cm_model_001
            name: "Layer3-ModelName匹配"
            skill_apikey: some_skill
            output_model_names: [component]
            catalog:
              GenericCard: {supported_model_names: [component]}
            assertions:
              - type: resolved_component
                expected: GenericCard
                match_layer: 3
          - id: cm_none_001
            name: "无匹配返回null"
            skill_apikey: unregistered_skill
            catalog: {}
            assertions:
              - type: resolved_component
                expected: null

      # ─── 4.5 Emitter ───
      - id: suite_emitter
        name: "Emitter事件包装"
        description: "Mode A/B事件包装验证"
        layer: a2ui
        stage: emitter
        cases:
          - id: emit_mode_b_001
            name: "Mode B-ACTIVITY_SNAPSHOT"
            mode: activity
            messages:
              - {type: SurfaceUpdate, surface_id: "panel-1"}
              - {type: BeginRendering, surface_id: "panel-1", root: root}
            assertions:
              - type: output_agui_event_type
                expected: ACTIVITY_SNAPSHOT
              - type: activity_type_is
                expected: "a2ui-surface"
              - type: content_operation_count
                expected: 2
          - id: emit_mode_a_001
            name: "Mode A-CUSTOM事件"
            mode: custom
            messages:
              - {type: SurfaceUpdate, surface_id: "panel-1"}
            assertions:
              - type: output_agui_event_type
                expected: CUSTOM
              - type: custom_name_prefix
                expected: "a2ui."

  # ═══════════════════════════════════════════════════════════
  # Layer 5：传输层评测
  # ═══════════════════════════════════════════════════════════
  - id: layer_5_transport
    name: "传输层"
    description: "SSE序列化 + 事件顺序 + ThreadStore + Trace"
    suites:
      # ─── 5.1 SSE 事件完整性 ───
      - id: suite_sse_integrity
        name: "SSE事件完整性"
        description: "事件格式、顺序、配对验证"
        layer: transport
        stage: sse
        cases:
          - id: sse_lifecycle_001
            name: "Run生命周期完整"
            full_execution: true
            input: "你好"
            assertions:
              - type: event_starts_with
                expected: RUN_STARTED
              - type: event_ends_with
                expected: RUN_FINISHED
              - type: run_id_consistent
                description: "所有事件的run_id应一致"
          - id: sse_text_pair_001
            name: "文本消息配对"
            full_execution: true
            input: "帮我查订单"
            assertions:
              - type: event_pair_matched
                start: TEXT_MESSAGE_START
                end: TEXT_MESSAGE_END
                by_field: message_id
          - id: sse_tool_pair_001
            name: "工具调用配对"
            full_execution: true
            input: "查看客户张三"
            assertions:
              - type: event_pair_matched
                start: TOOL_CALL_START
                end: TOOL_CALL_END
                by_field: tool_call_id
              - type: tool_call_has_result
                description: "每个TOOL_CALL_START都应有对应RESULT"
          - id: sse_no_orphan_001
            name: "无孤立事件"
            full_execution: true
            input: "分析数据"
            assertions:
              - type: no_orphan_start
                description: "所有START都有对应END"
              - type: no_orphan_end
                description: "所有END都有对应START"

      # ─── 5.2 ThreadStore 持久化 ───
      - id: suite_thread_store
        name: "ThreadStore状态"
        description: "会话状态正确持久化"
        layer: transport
        stage: thread_store
        cases:
          - id: ts_message_persist_001
            name: "消息正确写入"
            input: "你好世界"
            assertions:
              - type: thread_store_message_count
                min: 2
                description: "至少有user+assistant两条"
              - type: thread_store_last_message
                role: assistant
                content_not_empty: true
          - id: ts_activity_persist_001
            name: "Activity正确记录"
            input: "分析客户张三全景"
            assertions:
              - type: thread_store_has_activity
                render_type_not_empty: true
          - id: ts_last_run_001
            name: "last_run_id更新"
            input: "随便问个问题"
            assertions:
              - type: thread_store_last_run_id
                not_null: true

      # ─── 5.3 Trace 链路持久化 ───
      - id: suite_trace_persist
        name: "Trace持久化"
        description: "Trace/Span正确写入数据库"
        layer: transport
        stage: trace
        cases:
          - id: tp_trace_created_001
            name: "Trace记录创建"
            full_execution: true
            input: "帮我查订单"
            assertions:
              - type: trace_exists
                status: success
              - type: trace_has_spans
                min_count: 3
          - id: tp_span_types_001
            name: "Span类型覆盖"
            full_execution: true
            input: "取消订单 ORD-001"
            assertions:
              - type: span_type_exists
                expected: [content_review, memory_retrieval, llm_call, tool_call]
          - id: tp_error_trace_001
            name: "异常Trace正确记录"
            input: "__trigger_error__"
            assertions:
              - type: trace_exists
                status: error
              - type: trace_error_message_not_empty

  # ═══════════════════════════════════════════════════════════
  # Layer 6：端到端集成评测
  # ═══════════════════════════════════════════════════════════
  - id: layer_6_e2e
    name: "端到端集成"
    description: "全链路冒烟 + Reconnect + UserAction + 性能"
    suites:
      # ─── 6.1 全链路冒烟 ───
      - id: suite_e2e_smoke
        name: "全链路冒烟测试"
        description: "验证输入→输出的完整链路可用性"
        layer: e2e
        stage: smoke
        cases:
          - id: e2e_text_001
            name: "纯文本回答-端到端"
            endpoint: /api/chat/agui
            request:
              threadId: "test_e2e_text_001"
              message: "你好，介绍一下你自己"
            assertions:
              - type: http_status
                expected: 200
              - type: sse_has_event
                event_type: RUN_STARTED
              - type: sse_has_event
                event_type: TEXT_MESSAGE_CONTENT
              - type: sse_has_event
                event_type: RUN_FINISHED
              - type: response_content_not_empty
              - type: latency_max
                max_ms: 10000
          - id: e2e_tool_001
            name: "工具调用-端到端"
            endpoint: /api/chat/agui
            request:
              threadId: "test_e2e_tool_001"
              message: "帮我查一下客户张三的信息"
            assertions:
              - type: http_status
                expected: 200
              - type: sse_has_event
                event_type: TOOL_CALL_START
              - type: sse_has_event
                event_type: TOOL_CALL_RESULT
              - type: sse_has_event
                event_type: TEXT_MESSAGE_CONTENT
              - type: sse_has_event
                event_type: RUN_FINISHED
          - id: e2e_component_001
            name: "组件渲染-端到端"
            endpoint: /api/chat/agui
            request:
              threadId: "test_e2e_comp_001"
              message: "分析客户张三全景"
              a2uiClientCapabilities:
                supportedCatalogIds: ["viking.crm-v1", "a2ui.standard-v0.8"]
            assertions:
              - type: sse_has_event
                event_type: STEP_STARTED
              - type: sse_has_event_custom
                name: component_complete
              - type: sse_has_event
                event_type: RUN_FINISHED

      # ─── 6.2 Reconnect ───
      - id: suite_reconnect
        name: "断线重连"
        description: "重连首包顺序和数据完整性"
        layer: e2e
        stage: reconnect
        cases:
          - id: rc_order_001
            name: "重连首包固定顺序"
            setup:
              - {action: send_message, threadId: "rc_test_001", message: "你好"}
            endpoint: /agent/chat/reconnect
            request:
              threadId: "rc_test_001"
            assertions:
              - type: sse_event_order
                expected: [RUN_STARTED, MESSAGES_SNAPSHOT, STATE_SNAPSHOT]
              - type: messages_snapshot_not_empty
              - type: state_snapshot_has_phase
          - id: rc_activity_001
            name: "重连恢复Activity"
            setup:
              - {action: send_message, threadId: "rc_test_002", message: "分析客户张三"}
            endpoint: /agent/chat/reconnect
            request:
              threadId: "rc_test_002"
            assertions:
              - type: sse_has_event
                event_type: ACTIVITY_SNAPSHOT
              - type: activity_has_operations

      # ─── 6.3 UserAction 闭环 ───
      - id: suite_user_action
        name: "UserAction闭环"
        description: "用户交互回传→Agent响应"
        layer: e2e
        stage: user_action
        cases:
          - id: ua_button_001
            name: "按钮点击回传"
            setup:
              - {action: send_message, threadId: "ua_test_001", message: "查看客户列表"}
            endpoint: /agent/a2ui/event
            request:
              threadId: "ua_test_001"
              userAction:
                name: button_click
                surfaceId: "panel-slot-1"
                sourceComponentId: "btn_detail"
                timestamp: "2026-06-16T10:00:00Z"
                context: {customerId: "C1"}
            assertions:
              - type: http_status
                expected: 202
              - type: response_status
                expected: accepted
          - id: ua_dedupe_001
            name: "重复事件去重"
            endpoint: /agent/a2ui/event
            request_twice: true
            request:
              threadId: "ua_test_002"
              userAction:
                name: button_click
                surfaceId: "panel-slot-1"
                sourceComponentId: "btn_1"
                timestamp: "2026-06-16T10:00:00Z"
                context: {}
            assertions:
              - type: second_response_status
                expected: duplicate

      # ─── 6.4 性能基线 ───
      - id: suite_performance
        name: "性能基线"
        description: "延迟和Token消耗上限"
        layer: e2e
        stage: performance
        cases:
          - id: perf_simple_001
            name: "简单查询延迟"
            input: "你好"
            assertions:
              - type: latency_max
                max_ms: 3000
              - type: token_max
                max_tokens: 500
          - id: perf_tool_001
            name: "单工具调用延迟"
            input: "查看客户张三"
            assertions:
              - type: latency_max
                max_ms: 8000
              - type: token_max
                max_tokens: 2000
          - id: perf_multi_001
            name: "多工具调用延迟"
            input: "取消订单ORD-001并查看退款"
            assertions:
              - type: latency_max
                max_ms: 15000
              - type: token_max
                max_tokens: 5000
          - id: perf_ttft_001
            name: "首Token延迟(TTFT)"
            input: "你好"
            assertions:
              - type: time_to_first_token
                max_ms: 1500
