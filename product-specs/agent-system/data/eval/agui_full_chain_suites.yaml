            mock_tools:
              analyze_data: {forecast_amount: 180.0, high_probability_deals: 3}
            assertions:
              - type: tool_call_check
                expected: analyze_data
                mode: must_call
          # ═══ D. 订单(Order)场景 ═══
          - id: rd_order_query_001
            name: "[订单]订单状态查询"
            input: "查看订单 ORD-001 的状态"
            mock_tools:
              query_data: {order_id: "ORD-001", status: "pending_payment", amount: 299}
            assertions:
              - type: tool_call_check
                expected: query_data
                mode: must_call
              - type: contains_any
                expected: ["待支付", "299", "ORD-001"]
          - id: rd_order_cancel_normal_001
            name: "[订单]正常取消"
            input: "取消我的订单 ORD-001"
            mock_tools:
              query_data: {status: "pending_payment", order_id: "ORD-001", amount: 299}
              cancel_order: {success: true, refund_amount: 299}
            assertions:
              - type: sequence_check
                expected_order: [query_data, cancel_order]
              - type: contains_any
                expected: ["取消", "退款"]
          - id: rd_order_cancel_reject_001
            name: "[订单]已发货拒绝取消"
            input: "取消订单 ORD-002"
            mock_tools:
              query_data: {status: "shipped", order_id: "ORD-002", tracking_no: "SF123456"}
            assertions:
              - type: tool_call_check
                expected: cancel_order
                mode: must_not_call
              - type: contains_any
                expected: ["无法取消", "已发货", "不能"]
          - id: rd_order_notfound_001
            name: "[订单]订单不存在"
            input: "查看订单 ORD-99999"
            mock_tools:
              query_data: null
            assertions:
              - type: contains_any
                expected: ["不存在", "找不到", "未找到"]
          # ═══ E. 数据分析场景 ═══
          - id: rd_analyze_revenue_001
            name: "[分析]营收统计"
            input: "统计上个月各客户的签单总金额"
            mock_tools:
              analyze_data: {results: [{account: "华为", total: 63}, {account: "腾讯", total: 62}]}
            assertions:
              - type: tool_call_check
