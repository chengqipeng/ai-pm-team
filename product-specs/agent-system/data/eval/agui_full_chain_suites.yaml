                mode: must_call
          - id: rd_analyze_rank_001
            name: "[分析]销售排行"
            input: "按商机金额从高到低排列Top5客户"
            mock_tools:
              analyze_data: {results: [{name: "招行", amount: 120}, {name: "比亚迪", amount: 85}]}
