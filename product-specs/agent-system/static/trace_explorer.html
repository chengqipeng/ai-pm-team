<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace 链路 - DeepAgent AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.3s ease-out; }
.span-detail { display: none; }
.span-card.expanded .span-detail { display: block; }
.span-card.expanded .arrow-icon { transform: rotate(90deg); }
.loop-group { border-left: 3px solid #a78bfa; padding-left: 12px; margin: 8px 0; }
.loop-group.final { border-left-color: #22c55e; }
.parallel-group { border-left: 2px dashed #60a5fa; padding-left: 8px; margin: 4px 0 4px 16px; }
.compact-group { background: #f8fafc; border-radius: 8px; padding: 6px 10px; margin: 4px 0; }
.phase-section { margin-bottom: 16px; }
.phase-header { font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="flex h-screen w-full bg-[#f4f7fb] font-sans text-slate-800 overflow-hidden relative">
  <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-indigo-400/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- 左侧边栏 -->
  <aside class="w-72 flex flex-col z-20 shrink-0 bg-white/40 backdrop-blur-xl border-r border-gray-200/50">
    <div class="p-6">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </div>
        <span class="font-bold text-lg tracking-tight text-gray-900">Trace 链路</span>
      </div>
      <!-- 筛选 -->
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 block">状态筛选</label>
          <select id="filter-status" onchange="renderList()" class="w-full bg-gray-100/50 border-none rounded-xl py-2 px-3 text-xs focus:ring-2 focus:ring-blue-500/20">
            <option value="">全部</option>
            <option value="success">成功</option>
            <option value="error">失败</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 block">Thread ID</label>
          <input id="filter-thread" type="text" placeholder="输入 Thread ID..." oninput="renderList()" class="w-full bg-gray-100/50 border-none rounded-xl py-2 px-3 text-xs focus:ring-2 focus:ring-blue-500/20 placeholder:text-gray-400"/>
        </div>
        <button onclick="loadTraces()" class="w-full py-2 px-3 bg-blue-600 rounded-xl text-xs font-bold text-white hover:bg-blue-700 transition-all shadow-sm">刷新数据</button>
      </div>
    </div>
    <!-- Trace 列表 -->
    <div id="trace-sidebar-list" class="flex-1 overflow-y-auto custom-scrollbar px-4 pb-4 space-y-1">
      <div class="text-center text-gray-400 text-xs py-10">加载中...</div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="flex-1 flex flex-col min-w-0 relative z-10 overflow-hidden">
    <!-- 头部 -->
    <div class="px-8 py-5 bg-white/40 backdrop-blur-md border-b border-gray-200/50 shrink-0 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-lg font-bold text-gray-900">Trace 链路</h1>
        <p class="text-xs text-gray-400 mt-1">查看 Agent 调用链路详情</p>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-white/60 border border-gray-200/50 rounded-xl text-[11px]">
          <span class="text-gray-400 font-medium">租户</span>
          <span id="currentTenantDisplay" class="text-gray-800 font-bold">1</span>
          <span class="text-gray-200">|</span>
          <span class="text-gray-400 font-medium">用户</span>
          <span id="currentUserDisplay" class="text-gray-800 font-bold max-w-[120px] truncate" title="">—</span>
        </div>
        <a href="/" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all no-underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          返回对话
        </a>
      </div>
    </div>
    <div id="main-content" class="flex-1 overflow-y-auto custom-scrollbar px-8 py-6">
      <div class="text-center text-gray-400 text-sm py-20">
        <div class="text-4xl mb-3">🔍</div>
        <p>从左侧选择一条 Trace 查看详情</p>
      </div>
    </div>
  </main>
</div>

<script>
const API='';
let curTraces=[],selectedTraceId=null;

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function trunc(s,n){if(!s)return'';s=String(s);return s.length>n?s.slice(0,n)+'...':s}
function fT(ts){if(!ts)return'—';const d=new Date(typeof ts==='number'&&ts>1e12?ts:ts*1000);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fD(ms){if(!ms||ms<=0)return'0ms';return ms>=1000?(ms/1000).toFixed(1)+'s':Math.round(ms)+'ms'}
function fK(n){if(!n)return'0';return n>=1000?(n/1000).toFixed(1)+'K':String(n)}

const SC={context_build:{icon:'📋',cls:'bg-indigo-50 text-indigo-600'},resource_preload:{icon:'📚',cls:'bg-teal-50 text-teal-600'},memory_retrieval:{icon:'🔍',cls:'bg-blue-50 text-blue-600'},intent_analysis:{icon:'🧠',cls:'bg-purple-50 text-purple-600'},llm_call:{icon:'⚡',cls:'bg-blue-50 text-blue-600'},llm_input:{icon:'📝',cls:'bg-slate-50 text-slate-600'},tool_call:{icon:'🔧',cls:'bg-amber-50 text-amber-600'},tool_result_compact:{icon:'📦',cls:'bg-orange-50 text-orange-600'},skill_execution:{icon:'🎯',cls:'bg-pink-50 text-pink-600'},memory_extract:{icon:'💾',cls:'bg-indigo-50 text-indigo-600'},hierarchical_search:{icon:'🌲',cls:'bg-green-50 text-green-600'},middleware:{icon:'⚙️',cls:'bg-gray-50 text-gray-500'},content_review:{icon:'🛡️',cls:'bg-yellow-50 text-yellow-600'},query_rewrite:{icon:'✏️',cls:'bg-cyan-50 text-cyan-600'},error:{icon:'❌',cls:'bg-red-50 text-red-600'},done:{icon:'🏁',cls:'bg-green-50 text-green-600'}};
function gc(type){return SC[type]||{icon:'📋',cls:'bg-gray-50 text-gray-600'}}

// ═══ 加载 Trace 列表 ═══
async function loadTraces(){
  const el=document.getElementById('trace-sidebar-list');
  el.innerHTML='<div class="text-center text-gray-400 text-xs py-10">加载中...</div>';
  try{
    const r=await(await fetch(API+'/api/traces?limit=50')).json();
    curTraces=r.traces||[];
    renderList();
  }catch(e){el.innerHTML='<div class="text-center text-red-400 text-xs py-10">加载失败</div>'}
}

function renderList(){
  const st=document.getElementById('filter-status').value;
  const th=document.getElementById('filter-thread').value.trim().toLowerCase();
  let filtered=curTraces;
  if(st)filtered=filtered.filter(t=>t.status===st);
  if(th)filtered=filtered.filter(t=>(t.thread_id||'').toLowerCase().includes(th));
  const el=document.getElementById('trace-sidebar-list');
  if(!filtered.length){el.innerHTML='<div class="text-center text-gray-400 text-xs py-10">暂无数据</div>';return}
  el.innerHTML=filtered.map(t=>`
    <div onclick="loadDetail('${t.trace_id}')" class="group flex flex-col gap-1 px-4 py-3 rounded-xl cursor-pointer transition-all ${selectedTraceId===t.trace_id?'bg-white shadow-sm ring-1 ring-black/5':'hover:bg-white/60'}">
      <p class="text-xs font-medium text-gray-800 truncate">${esc(trunc(t.user_input||'无输入',35))}</p>
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full ${t.status==='success'?'bg-green-500':'bg-red-500'}"></span>
        <span class="text-[10px] text-gray-400">${fT(t.start_time)}</span>
        <span class="text-[10px] text-gray-400">${fD(t.total_duration_ms)}</span>
        <span class="text-[10px] text-gray-400">${t.iteration_count}轮</span>
      </div>
    </div>`).join('');
}

// ═══ 加载 Trace 详情 ═══
async function loadDetail(traceId){
  selectedTraceId=traceId;
  renderList();
  const el=document.getElementById('main-content');
  el.innerHTML='<div class="text-center text-gray-400 text-xs py-20">加载中...</div>';
  try{
    const r=await(await fetch(API+'/api/traces/'+traceId)).json();
    if(r.error){el.innerHTML='<div class="text-center text-red-400 py-20">'+r.error+'</div>';return}
    renderDetail(r.trace);
  }catch(e){el.innerHTML='<div class="text-center text-red-400 py-20">加载失败</div>'}
}

// ═══ 核心：结构化渲染 Trace 详情 ═══
// 将 flat spans 按阶段分组，Agent Loop 内按循环分组，区分并行/串行工具调用

function renderDetail(trace){
  const el=document.getElementById('main-content');
  const spans=trace.spans||[];
  const maxD=trace.total_duration_ms||1;
  let totalTok=trace.total_tokens||0;

  // ── 统计头部 ──
  let html=`
    <div class="mb-6 p-5 rounded-2xl bg-white/70 backdrop-blur-sm border border-white/40 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-base font-bold text-gray-900">${esc(trunc(trace.user_input||'Trace 详情',50))}</h2>
          <p class="text-[11px] text-gray-400 mt-1">ID: ${trace.trace_id} · ${trace.agent_name||''} · ${trace.model||''}</p>
        </div>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${trace.status==='success'?'bg-green-50 text-green-600':'bg-red-50 text-red-600'}">${trace.status}</span>
      </div>
      <div class="flex gap-4 flex-wrap">
        <div class="text-center bg-white/60 rounded-xl px-4 py-2 border border-white/60"><div class="text-base font-bold text-blue-600">${fD(trace.total_duration_ms)}</div><div class="text-[10px] text-gray-400">耗时</div></div>
        <div class="text-center bg-white/60 rounded-xl px-4 py-2 border border-white/60"><div class="text-base font-bold text-blue-600">${fK(totalTok)}</div><div class="text-[10px] text-gray-400">Token</div></div>
        <div class="text-center bg-white/60 rounded-xl px-4 py-2 border border-white/60"><div class="text-base font-bold text-blue-600">${trace.iteration_count||0}</div><div class="text-[10px] text-gray-400">迭代</div></div>
        <div class="text-center bg-white/60 rounded-xl px-4 py-2 border border-white/60"><div class="text-base font-bold text-blue-600">${trace.tool_count||0}</div><div class="text-[10px] text-gray-400">工具</div></div>
        <div class="text-center bg-white/60 rounded-xl px-4 py-2 border border-white/60"><div class="text-base font-bold text-blue-600">${spans.length}</div><div class="text-[10px] text-gray-400">Span</div></div>
      </div>
    </div>`;

  // ── 将 spans 分为三个阶段 ──
  const structured = structureSpans(spans);
  html += renderContextPhase(structured.context, maxD);
  html += renderReasoningPhase(structured.reasoning, maxD);
  html += renderPostPhase(structured.post, maxD);

  // ── 用户输入 & Agent 输出 ──
  if(trace.user_input||trace.agent_output){
    html+=`<div class="mt-6 p-5 rounded-2xl bg-white/70 backdrop-blur-sm border border-white/40 shadow-sm space-y-4">
      ${trace.user_input?`<div><div class="text-[10px] font-bold text-gray-400 uppercase mb-2">👤 用户输入</div><p class="text-sm text-gray-700 leading-relaxed">${esc(trace.user_input)}</p></div>`:''}
      ${trace.agent_output?`<div><div class="text-[10px] font-bold text-gray-400 uppercase mb-2">⚡ Agent 输出</div><p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">${esc(trunc(trace.agent_output,2000))}</p></div>`:''}
    </div>`;
  }
  el.innerHTML=html;
}

// ═══ Span 结构化分组逻辑 ═══
// 按 phase 字段 + span type 将 flat spans 分为 context / reasoning / post 三阶段
// reasoning 阶段内部按 llm_call 切分为循环（loop）

function structureSpans(spans) {
  const context = [];   // 上下文准备阶段
  const reasoning = []; // Agent Loop 推理阶段（含循环）
  const post = [];      // 后处理阶段

  // 阶段判定：context 类型的 span
  const CONTEXT_TYPES = new Set(['context_build', 'resource_preload', 'memory_retrieval', 'content_review', 'query_rewrite']);
  const POST_TYPES = new Set(['memory_extract']);

  // 第一遍：按阶段分桶
  for (const s of spans) {
    const phase = s.phase || '';
    const type = s.type || '';

    if (CONTEXT_TYPES.has(type) || phase === 'context' || phase === 'entry') {
      context.push(s);
    } else if (POST_TYPES.has(type) || phase === 'post') {
      post.push(s);
    } else {
      // reasoning 阶段：llm_call, tool_call, skill_execution, middleware, tool_result_compact, llm_input, intent_analysis
      reasoning.push(s);
    }
  }

  return { context, reasoning, post };
}

// ═══ 渲染上下文准备阶段 ═══
function renderContextPhase(spans, maxD) {
  if (!spans.length) return '';
  // 分离中间件 spans 和核心 spans
  const mwSpans = spans.filter(s => s.type === 'middleware');
  const coreSpans = spans.filter(s => s.type !== 'middleware');

  let html = `<div class="phase-section">
    <div class="phase-header bg-blue-50 text-blue-700">📦 上下文准备</div>
    <div class="space-y-1.5 pl-3">`;

  // 渲染核心 spans（resource_preload, memory_retrieval 等）
  for (const s of coreSpans) {
    html += renderSimpleSpan(s, maxD);
  }

  // 中间件折叠显示
  if (mwSpans.length) {
    const totalMwDur = mwSpans.reduce((sum, s) => sum + (s.duration_ms || 0), 0);
    const mwId = 'ctx-mw-' + Math.random().toString(36).slice(2, 8);
    html += `<details class="compact-group">
      <summary class="cursor-pointer text-[10px] text-gray-500 font-medium">
        ⚙️ ${mwSpans.length} 个中间件 · ${fD(totalMwDur)}
      </summary>
      <div class="mt-1 space-y-0.5 pl-2">`;
    for (const mw of mwSpans) {
      const name = (mw.metadata||{}).middleware_name || mw.name || '';
      const effect = (mw.metadata||{}).has_effect;
      html += `<div class="text-[10px] text-gray-400">· ${esc(name)} · ${fD(mw.duration_ms)}${effect?' → <span class="text-blue-500">已修改</span>':''}</div>`;
    }
    html += `</div></details>`;
  }

  html += `</div></div>`;
  return html;
}

// ═══ 渲染推理阶段（Agent Loop）— 按循环分组 ═══
function renderReasoningPhase(spans, maxD) {
  if (!spans.length) return '';

  // 将 reasoning spans 按循环分组
  // 规则：每个 llm_call span 开始一个新循环
  // 循环内包含：该 llm_call 之前的 compact/middleware spans + llm_call 本身 + 后续 tool_call/skill spans
  const loops = groupIntoLoops(spans);

  let html = `<div class="phase-section">
    <div class="phase-header bg-purple-50 text-purple-700">⚡ 模型推理 Agent Loop</div>
    <div class="space-y-2">`;

  loops.forEach((loop, idx) => {
    html += renderLoop(loop, idx, loops.length, maxD);
  });

  html += `</div></div>`;
  return html;
}

// 将 reasoning spans 按 llm_call 切分为循环
// 关键认知：
//   - compact spans（tool_result_compact）是在 awrap_tool_call 中产生的，
//     即工具执行完成后立即记录，属于当前循环的工具执行阶段
//   - 由于中间件嵌套顺序，compact span 可能出现在 span 列表中的任意位置
//   - 使用 metadata.iteration 字段来精确归组（如果有的话）
//   - 如果没有 iteration 字段，则按出现顺序归入当前循环
function groupIntoLoops(spans) {
  // 第一遍：找出所有 llm_call 及其 iteration 编号
  const llmCalls = [];
  for (let i = 0; i < spans.length; i++) {
    if (spans[i].type === 'llm_call') {
      const iter = (spans[i].metadata||{}).iteration || (llmCalls.length + 1);
      llmCalls.push({ index: i, span: spans[i], iteration: iter });
    }
  }

  // 如果没有 llm_call，所有 spans 归入一个循环
  if (!llmCalls.length) {
    return [{ llmCall: null, beforeSpans: spans.slice(), toolCalls: [], compactSpans: [], afterMw: [], wrapMw: [] }];
  }

  // 第二遍：按 llm_call 位置切分区间，每个区间是一个循环
  const loops = [];
  for (let li = 0; li < llmCalls.length; li++) {
    const llmInfo = llmCalls[li];
    const startIdx = (li === 0) ? 0 : llmCalls[li - 1].index + 1;
    const endIdx = (li < llmCalls.length - 1) ? llmCalls[li + 1].index : spans.length;

    const loop = {
      llmCall: llmInfo.span,
      iteration: llmInfo.iteration,
      beforeSpans: [],
      toolCalls: [],
      compactSpans: [],
      afterMw: [],
      wrapMw: [],
    };

    // 处理 llm_call 之前的 spans（属于本循环的 before_model）
    for (let i = startIdx; i < llmInfo.index; i++) {
      const s = spans[i];
      if (s.type === 'tool_result_compact') {
        // compact span 在 llm_call 之前出现 → 属于上一个循环的工具结果
        // 归入上一个循环（如果有的话）
        if (loops.length > 0) {
          loops[loops.length - 1].compactSpans.push(s);
        } else {
          loop.beforeSpans.push(s);
        }
      } else if (s.type === 'middleware') {
        const phase = (s.metadata||{}).phase || (s.input_data||{}).phase || '';
        if (phase === 'before_model') {
          loop.beforeSpans.push(s);
        } else {
          loop.beforeSpans.push(s);
        }
      } else {
        loop.beforeSpans.push(s);
      }
    }

    // 处理 llm_call 之后的 spans（工具调用、after_model 中间件、compact）
    for (let i = llmInfo.index + 1; i < endIdx; i++) {
      const s = spans[i];
      if (s.type === 'tool_call' || s.type === 'skill_execution') {
        loop.toolCalls.push(s);
      } else if (s.type === 'tool_result_compact') {
        loop.compactSpans.push(s);
      } else if (s.type === 'middleware') {
        const phase = (s.metadata||{}).phase || (s.input_data||{}).phase || '';
        if (phase === 'after_model') {
          loop.afterMw.push(s);
        } else if (phase === 'wrap_tool_call') {
          loop.wrapMw.push(s);
        } else {
          loop.afterMw.push(s);
        }
      } else {
        loop.afterMw.push(s);
      }
    }

    loops.push(loop);
  }

  return loops;
}

// ═══ 渲染单个循环 ═══
function renderLoop(loop, idx, totalLoops, maxD) {
  const llm = loop.llmCall;
  const m = llm ? (llm.metadata || {}) : {};
  const isFinal = m.is_final || false;
  const iteration = m.iteration || (idx + 1);
  const toolCalls = m.tool_calls || [];
  const knowledgeRefs = m.knowledge_refs || [];
  const isParallel = toolCalls.length > 1;

  // 循环标题
  let loopLabel = '';
  if (isFinal) {
    loopLabel = `循环 ${iteration} [FINAL]（生成最终回复）`;
  } else if (toolCalls.length) {
    if (isParallel) {
      loopLabel = `循环 ${iteration}（并行调用 ${toolCalls.join(' + ')}）`;
    } else {
      loopLabel = `循环 ${iteration}（调用 ${toolCalls[0] || '工具'}）`;
    }
  } else {
    loopLabel = `循环 ${iteration}`;
  }

  let html = `<div class="loop-group ${isFinal ? 'final' : ''}">
    <div class="text-[11px] font-bold ${isFinal ? 'text-green-600' : 'text-purple-600'} mb-1.5">├─ ${esc(loopLabel)}</div>
    <div class="space-y-1 pl-2">`;

  // 1. before_model 中间件（折叠）
  const beforeMw = loop.beforeSpans.filter(s => s.type === 'middleware');
  const beforeOther = loop.beforeSpans.filter(s => s.type !== 'middleware');
  for (const s of beforeOther) {
    html += renderSimpleSpan(s, maxD);
  }
  if (beforeMw.length) {
    const totalDur = beforeMw.reduce((sum, s) => sum + (s.duration_ms||0), 0);
    html += `<div class="text-[10px] text-gray-400">· ContextWindowMiddleware · ${fD(totalDur)}</div>`;
  }

  // 2. LLM 推理
  if (llm) {
    const dur = llm.duration_ms || 0;
    let desc = isFinal ? '生成最终回复 ✅' : (toolCalls.length ? `决定调用 ${toolCalls.join(', ')}` : '推理中');
    html += `<div class="flex items-center gap-2 py-0.5">
      <span class="text-[11px]">🧠</span>
      <span class="text-[11px] font-medium text-gray-700">模型推理 → ${esc(desc)}</span>
      <span class="text-[10px] text-blue-500 font-bold">${fD(dur)}</span>
    </div>`;
    // 知识引用
    if (knowledgeRefs.length) {
      html += `<div class="text-[10px] text-teal-500 pl-5">📚 引用: ${knowledgeRefs.map(r=>esc(r)).join(', ')}</div>`;
    }
  }

  // 3. after_model 中间件（折叠为一行）
  const afterMwReal = loop.afterMw.filter(s => s.type === 'middleware');
  if (afterMwReal.length) {
    const names = afterMwReal.map(s => (s.metadata||{}).middleware_name || '').filter(Boolean);
    html += `<div class="text-[10px] text-gray-400">· ${names.join(' · ')}</div>`;
  }

  // 4. 工具调用
  if (loop.toolCalls.length) {
    if (isParallel && loop.toolCalls.length > 1) {
      // 并行工具调用 — 用虚线框标记
      html += `<div class="parallel-group">
        <div class="text-[10px] text-blue-500 font-medium mb-1">⫘ 并行执行 (${loop.toolCalls.length} 个工具)</div>`;
      for (const tc of loop.toolCalls) {
        html += renderToolSpan(tc, maxD);
      }
      html += `</div>`;
    } else {
      // 串行工具调用
      for (const tc of loop.toolCalls) {
        if (loop.wrapMw.length) {
          const wrapNames = loop.wrapMw.map(s => (s.metadata||{}).middleware_name || '').filter(Boolean);
          if (wrapNames.length) {
            html += `<div class="text-[10px] text-gray-400 pl-2">· ${wrapNames.join(' · ')}</div>`;
          }
          loop.wrapMw = [];
        }
        html += renderToolSpan(tc, maxD);
      }
    }
  }

  // 5. 源头压缩记录（工具执行后产生的压缩结果，属于本循环）
  if (loop.compactSpans.length) {
    // 分为实际压缩和跳过（保留原文）两类
    const compressed = loop.compactSpans.filter(s => (s.output_data||{}).action !== 'skip');
    const skipped = loop.compactSpans.filter(s => (s.output_data||{}).action === 'skip');

    if (compressed.length) {
      html += `<details class="compact-group" style="margin-top:4px;">
        <summary class="cursor-pointer text-[10px] text-orange-600 font-medium">
          📦 源头压缩: ${compressed.length} 个工具结果已压缩
        </summary>
        <div class="mt-1 space-y-0.5 pl-2">`;
      for (const cs of compressed) {
        const od = cs.output_data || {};
        const id = cs.input_data || {};
        const toolName = id.tool_name || (cs.metadata||{}).tool_name || '?';
        const orig = id.original_length || 0;
        const summ = od.summary_length || 0;
        const ratio = od.compression_ratio || '';
        html += `<div class="text-[10px] text-orange-500">· ${esc(toolName)} ${orig}→${summ}字符 (${ratio})</div>`;
      }
      html += `</div></details>`;
    }
    // 跳过的不显示（保留原文 = 无需关注）
  }

  html += `</div></div>`;
  return html;
}

// ═══ 渲染工具/技能 span ═══
function renderToolSpan(s, maxD) {
  const m = s.metadata || {};
  const toolName = m.tool_name || m.skill_name || s.name || '';
  const status = m.status || s.status || 'success';
  const isError = status === 'error';
  const dur = s.duration_ms || 0;
  const icon = isError ? '❌' : '✓';
  const colorCls = isError ? 'text-red-500' : 'text-green-500';

  let label = '';
  if (s.type === 'skill_execution') {
    const mode = m.context_mode || '';
    label = `skill:${m.skill_name || m.skill_apikey || '?'}${mode ? ' [' + mode + ']' : ''}`;
  } else {
    label = `tool:${toolName}`;
  }

  let html = `<div class="flex items-center gap-2 py-0.5 ${isError ? 'bg-red-50/50 rounded px-1 -mx-1' : ''}">
    <span class="text-[11px] ${colorCls} font-bold">${icon}</span>
    <span class="text-[11px] font-medium ${isError ? 'text-red-600' : 'text-gray-700'}">${esc(label)}</span>
    <span class="text-[10px] text-blue-500 font-bold">${fD(dur)}</span>`;

  // 错误信息
  if (isError && (m.error || (s.output_data||{}).error)) {
    const errMsg = m.error || (s.output_data||{}).error || '';
    html += `<span class="text-[9px] text-red-400 truncate max-w-[200px]">${esc(trunc(errMsg, 60))}</span>`;
  }

  html += `</div>`;

  // 子 Agent 展开（skill_execution with fork mode）
  if (s.type === 'skill_execution' && s.children && s.children.length) {
    html += `<div class="ml-4 mt-1 p-2 border border-orange-200 rounded-lg bg-orange-50/30">
      <div class="text-[10px] text-orange-600 font-bold mb-1">🤖 子 Agent: ${esc(m.skill_name||'')} [${m.context_mode||'fork'}]</div>
      <div class="space-y-0.5 pl-2 border-l border-orange-200">`;
    for (const child of s.children) {
      html += `<div class="text-[9px] text-gray-500">${esc(child.name||child.type)} · ${fD(child.duration_ms)}</div>`;
    }
    html += `</div></div>`;
  }

  return html;
}

// ═══ 渲染后处理阶段 ═══
function renderPostPhase(spans, maxD) {
  if (!spans.length) return '';
  let html = `<div class="phase-section">
    <div class="phase-header bg-indigo-50 text-indigo-700">💾 后处理</div>
    <div class="space-y-1.5 pl-3">`;
  for (const s of spans) {
    html += renderSimpleSpan(s, maxD);
  }
  html += `</div></div>`;
  return html;
}

// ═══ 渲染简单 span（通用） ═══
function renderSimpleSpan(s, maxD) {
  const cfg = gc(s.type);
  const m = s.metadata || {};
  const dur = s.duration_ms || 0;
  let desc = s.detail || s.name || s.type;

  // 特殊类型的描述增强
  if (s.type === 'resource_preload') {
    const od = s.output_data || {};
    desc = `知识预加载 · 预加载 ${od.preload_loaded||od.loaded_count||'?'} 个知识文件`;
  } else if (s.type === 'memory_retrieval') {
    const hitCount = m.hit_count != null ? m.hit_count : ((s.output_data||{}).hit_count || 0);
    desc = `记忆检索 — 命中 ${hitCount} 条`;
  } else if (s.type === 'context_build') {
    const od = s.output_data || s.input_data || {};
    desc = `上下文构建: ${od.total_messages||od.message_count||'?'} 条消息, 预估 ${od.estimated_tokens||'?'} tokens`;
  } else if (s.type === 'memory_extract') {
    const od = s.output_data || {};
    desc = `记忆提取 — ${od.extracted_count||0} 条新记忆`;
  }

  return `<div class="flex items-center gap-2 py-0.5">
    <span class="text-[11px]">${cfg.icon}</span>
    <span class="text-[11px] text-gray-600">${esc(trunc(desc, 80))}</span>
    <span class="text-[10px] text-blue-500 font-bold">${fD(dur)}</span>
  </div>`;
}

// 显示当前浏览器的 user_id（与对话页一致）
(function(){
  let id = localStorage.getItem('deepagent_user_id');
  if (!id) { id = 'user_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('deepagent_user_id', id); }
  const el = document.getElementById('currentUserDisplay');
  if (el) { el.textContent = id; el.title = id; }
})();

loadTraces();
