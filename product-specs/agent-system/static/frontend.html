<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>DeepAgent AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// Tailwind CDN fallback：如果主 CDN 加载失败，尝试备用源
if (typeof tailwind === 'undefined') {
  document.write('<script src="https://unpkg.com/tailwindcss@3/lib/cdn.min.js"><\/script>');
}
</script>
<script>
// 最终兜底：如果 Tailwind 仍未加载，注入关键布局样式
window.addEventListener('DOMContentLoaded', function() {
  if (!document.querySelector('style[data-tailwind]') && typeof tailwind === 'undefined') {
    var s = document.createElement('style');
    s.textContent = `
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-1 { flex: 1 1 0%; }
      .h-screen { height: 100vh; }
      .w-full { width: 100%; }
      .overflow-hidden { overflow: hidden; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .hidden { display: none; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .gap-2 { gap: 0.5rem; }
      .gap-3 { gap: 0.75rem; }
      .gap-4 { gap: 1rem; }
      .p-4 { padding: 1rem; }
      .p-6 { padding: 1.5rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .px-8 { padding-left: 2rem; padding-right: 2rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .mb-2 { margin-bottom: 0.5rem; }
      .mb-8 { margin-bottom: 2rem; }
      .text-center { text-align: center; }
      .text-sm { font-size: 0.875rem; }
      .text-xs { font-size: 0.75rem; }
      .text-lg { font-size: 1.125rem; }
      .text-2xl { font-size: 1.5rem; }
      .font-bold { font-weight: 700; }
      .rounded-xl { border-radius: 0.75rem; }
      .rounded-2xl { border-radius: 1rem; }
      .border { border-width: 1px; }
      .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .bg-white { background-color: #fff; }
      .text-gray-500 { color: #6b7280; }
      .text-gray-800 { color: #1f2937; }
      .text-gray-900 { color: #111827; }
      .min-w-0 { min-width: 0; }
      .shrink-0 { flex-shrink: 0; }
      .w-72 { width: 18rem; }
      .overflow-y-auto { overflow-y: auto; }
      .border-r { border-right-width: 1px; }
      .border-b { border-bottom-width: 1px; }
      .border-t { border-top-width: 1px; }
      .h-16 { height: 4rem; }
      .space-y-1 > * + * { margin-top: 0.25rem; }
      .space-y-2 > * + * { margin-top: 0.5rem; }
      .space-y-4 > * + * { margin-top: 1rem; }
      .space-y-6 > * + * { margin-top: 1.5rem; }
      .space-y-10 > * + * { margin-top: 2.5rem; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pointer-events-none { pointer-events: none; }
      .cursor-pointer { cursor: pointer; }
      .transition-all { transition: all 0.15s ease; }
      .resize-none { resize: none; }
      .flex-wrap { flex-wrap: wrap; }
      .w-0 { width: 0; }
      .opacity-0 { opacity: 0; }
      .m-0 { margin: 0; }
      .border-0 { border-width: 0; }
    `;
    document.head.appendChild(s);
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.05); border-radius: 10px; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slide-in-right { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.5s ease-out; }
.animate-slide-right { animation: slide-in-right 0.5s ease-out; }
.animate-ping-slow { animation: pulse-dot 1.5s infinite; }
textarea:focus { outline: none; }
/* 文档预览 markdown 样式 */
#docPreviewContent h1 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; color: #1a1a2e; }
#docPreviewContent h2 { font-size: 1.1rem; font-weight: 700; margin: 1rem 0 0.4rem; color: #2d3748; }
#docPreviewContent h3 { font-size: 0.95rem; font-weight: 600; margin: 0.8rem 0 0.3rem; color: #4a5568; }
#docPreviewContent p { margin: 0.4rem 0; line-height: 1.7; }
#docPreviewContent ul, #docPreviewContent ol { padding-left: 1.2rem; margin: 0.4rem 0; }
#docPreviewContent li { margin: 0.2rem 0; line-height: 1.6; }
#docPreviewContent table { width: 100%; border-collapse: collapse; margin: 0.6rem 0; font-size: 12px; }
#docPreviewContent th, #docPreviewContent td { border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left; }
#docPreviewContent th { background: #f7fafc; font-weight: 600; }
#docPreviewContent strong { color: #2563eb; }
#docPreviewContent blockquote { border-left: 3px solid #3b82f6; padding: 0.5rem 1rem; margin: 0.5rem 0; background: #eff6ff; border-radius: 0 8px 8px 0; }
#docPreviewContent code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
#docPreviewContent pre { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 0.5rem 0; }
#docPreviewContent pre code { background: none; color: inherit; padding: 0; }
/* 对话区内文档内容截断样式 */
.prose-content h1 { font-size: 1rem; font-weight: 700; margin: 0.3rem 0; }
.prose-content h2 { font-size: 0.9rem; font-weight: 600; margin: 0.3rem 0; }
.prose-content p { margin: 0.2rem 0; font-size: 13px; line-height: 1.6; }
.prose-content table { width: 100%; border-collapse: collapse; margin: 0.4rem 0; font-size: 12px; }
.prose-content th, .prose-content td { border: 1px solid #e5e7eb; padding: 4px 8px; }
.prose-content th { background: #f9fafb; font-weight: 600; }

/* ═══ 布局基线（不依赖 Tailwind JIT 任意值）═══ */
/* 防止 Tailwind CDN 未加载/未处理任意值时布局崩溃 */
html, body { height: 100%; }
body { margin: 0; }

/* 顶层容器强制 flex 布局（双保险，即便 Tailwind 失败也生效） */
#app { display: flex; height: 100vh; width: 100%; overflow: hidden; position: relative; background: #f4f7fb; }

/* 左侧边栏固定宽度 */
#sidebar { width: 18rem; flex-shrink: 0; display: flex; flex-direction: column; }

/* 主工作区占据剩余空间，min-width:0 至关重要 —— 防止 flex 子项被内容撑破 */
#app > main { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* 主工作区内的对话/右侧面板 flex 容器 */
#app > main > div.flex-1.flex { display: flex; flex: 1 1 0%; overflow: hidden; min-width: 0; }

/* 对话核心区 min-width:0，否则长内容（代码块、trace 预览）会把它撑破 */
#app > main > div.flex-1.flex > div.flex-1 { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* 右侧面板：显式宽度，防止被内容撑开 */
#rightPanel { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
#rightPanel.w-0 { width: 0 !important; margin: 0 !important; border-width: 0 !important; opacity: 0; pointer-events: none; }

/* 消息气泡最大宽度（避免没有 Tailwind 任意值时铺满整行） */
#chatInner .flex.justify-end > div,
#chatInner .flex.justify-start > div { max-width: 85%; }

/* 顶部标题最大宽度（避免长会话标题把租户/用户信息挤下去） */
#headerTitle { max-width: 180px; }
#headerUserDisplay { max-width: 100px; }

/* 聊天区容器最大宽度 */
#chatInner { max-width: 56rem; margin-left: auto; margin-right: auto; width: 100%; }

/* 任意值：常用宽度 */
.w-\[400px\] { width: 400px; }
.max-w-\[85\%\] { max-width: 85%; }
.max-w-\[180px\] { max-width: 180px; }
.max-w-\[100px\] { max-width: 100px; }
.max-w-\[120px\] { max-width: 120px; }
.max-w-\[200px\] { max-width: 200px; }

/* 标准 Tailwind 尺寸 fallback（供 Tailwind CDN 失效时兜底） */
.max-w-4xl { max-width: 56rem; }
.max-w-5xl { max-width: 64rem; }
.max-w-xl { max-width: 36rem; }
.max-w-none { max-width: none; }
.mx-auto { margin-left: auto; margin-right: auto; }

/* 圆角 */
.rounded-\[32px\] { border-radius: 32px; }

/* 常用 px 级字号 */
.text-\[9px\] { font-size: 9px; }
.text-\[10px\] { font-size: 10px; }
.text-\[10\.5px\] { font-size: 10.5px; }
.text-\[11px\] { font-size: 11px; }
.text-\[12px\] { font-size: 12px; }
.text-\[13px\] { font-size: 13px; }
.text-\[14px\] { font-size: 14px; }

/* trace 预览卡片内最大高度 */
.max-h-\[200px\] { max-height: 200px; }
.max-h-40 { max-height: 10rem; }
.max-h-56 { max-height: 14rem; }

/* 推理链路阶段容器样式 */
.trace-node summary::-webkit-details-marker { display: none; }
.trace-node summary::marker { display: none; }
.trace-phase-entry { border-left-color: #f97316; }
.trace-phase-context { border-left-color: #3b82f6; }
.trace-phase-reasoning { border-left-color: #8b5cf6; }
.trace-phase-output { border-left-color: #22c55e; }
.trace-phase-post { border-left-color: #f43f5e; }

/* 文本链路风格 */
.trace-phase { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.trace-line { word-break: break-word; overflow-wrap: anywhere; }
.trace-line-mw { word-break: break-word; overflow-wrap: anywhere; }
.trace-loop { position: relative; }
#traceContent { font-size: 11px; line-height: 1.7; }
/* 中间件名称 */
.trace-mw-name { font-weight: 600; }
/* 描述文本自然换行 */
.trace-desc { word-break: break-word; overflow-wrap: break-word; }
/* 普通节点名称 */
.trace-step-name { white-space: nowrap; }
/* 序号列固定宽度 */
.trace-seq { min-width: 28px; width: 28px; text-align: right; margin-right: 4px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
/* 中间件折叠组 */
.trace-mw-group summary { list-style: none; }
.trace-mw-group summary::-webkit-details-marker { display: none; }
.trace-mw-group summary::marker { display: none; }
.trace-mw-group[open] .trace-mw-chevron { transform: rotate(180deg); }
.trace-mw-group summary:hover { background: rgba(59, 130, 246, 0.04); border-radius: 6px; }
/* 输入/输出展开区域 */
.trace-io-details summary { list-style: none; }
.trace-io-details summary::-webkit-details-marker { display: none; }
.trace-io-details summary::marker { display: none; }
.trace-io-details[open] .trace-io-chevron { transform: rotate(180deg); }
.trace-io-pre { margin: 2px 0; padding: 4px 8px; background: #f8fafc; border-radius: 4px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; color: #334155; }
.trace-io-chevron { transition: transform 0.2s; }

/* ═══ 异常状态高亮样式 ═══ */
/* 异常节点背景高亮 */
.trace-line-error { background: #fef2f2; border-left: 3px solid #ef4444; border-radius: 4px; padding-left: 8px; margin-left: -4px; }
.trace-line-mw-error { background: #fef2f2; border-left: 3px solid #ef4444; border-radius: 4px; padding-left: 8px; margin-left: -4px; }
/* 异常中间件组 */
.trace-mw-group-error { background: #fef2f2; border-radius: 6px; padding: 2px 4px; }
.trace-mw-group-error > summary { color: #dc2626; }
/* 异常详情展开区域 */
.trace-error-details summary { list-style: none; cursor: pointer; }
.trace-error-details summary::-webkit-details-marker { display: none; }
.trace-error-details summary::marker { display: none; }
.trace-error-details[open] .trace-error-chevron { transform: rotate(180deg); }
.trace-error-chevron { transition: transform 0.2s; }
.trace-error-content { margin: 4px 0; padding: 6px 10px; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 6px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; color: #991b1b; }
/* 循环容器异常边框 */
.trace-loop-error { border-left-color: #fca5a5 !important; }
/* 异常步骤名称颜色 */
.trace-step-name-error { color: #dc2626 !important; }
/* 异常序号颜色 */
.trace-seq-error { color: #ef4444 !important; font-weight: 600; }

/* 背景装饰球 */
.top-\[-10\%\] { top: -10%; }
.left-\[-5\%\] { left: -5%; }
.bottom-\[-10\%\] { bottom: -10%; }
.right-\[-5\%\] { right: -5%; }
.w-\[40\%\] { width: 40%; }
.h-\[40\%\] { height: 40%; }
.w-\[30\%\] { width: 30%; }
.h-\[30\%\] { height: 30%; }
.blur-\[100px\] { filter: blur(100px); }

/* 让 flex-1 子项默认拥有 min-width:0，防止 flex overflow 扩张 */
.flex-1.min-w-0 { min-width: 0; }
</style>
</head>
<body>
<div id="app" class="flex h-screen w-full bg-[#f4f7fb] font-sans text-slate-800 overflow-hidden relative">
  <!-- 氛围背景装饰 -->
  <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-indigo-400/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- 左侧对话历史面板 -->
  <aside id="sidebar" class="w-72 flex flex-col z-20 shrink-0 bg-white/40 backdrop-blur-xl border-r border-gray-200/50">
    <div class="p-6">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <span class="font-bold text-lg tracking-tight text-gray-900">DeepAgent AI</span>
      </div>
      <button onclick="newChat()" class="w-full py-3 px-4 bg-white border border-gray-200/50 rounded-2xl flex items-center justify-center gap-2 text-sm font-bold text-blue-600 shadow-sm hover:shadow-md hover:bg-blue-50 transition-all group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:rotate-90 transition-transform duration-300"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建对话
      </button>
    </div>
    <div class="flex-1 overflow-y-auto custom-scrollbar px-4 space-y-6 pb-6">
      <div class="relative mx-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="搜索历史内容..." oninput="onSearchInput(this.value)" class="w-full bg-gray-100/50 border-none rounded-xl py-2 pl-9 pr-4 text-xs focus:ring-2 focus:ring-blue-500/20 placeholder:text-gray-400 transition-all"/>
      </div>
      <div id="chatListToday">
        <h3 class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">今天</h3>
        <div id="chatListTodayItems" class="space-y-1"></div>
      </div>
      <div id="chatListYesterday">
        <h3 class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">更早</h3>
        <div id="chatListYesterdayItems" class="space-y-1"></div>
      </div>
    </div>
    <div class="p-4 border-t border-gray-100/50 bg-white/20">
      <!-- 用户信息 -->
      <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/40 transition-all cursor-pointer group">
        <div class="w-10 h-10 rounded-full bg-blue-100 border-2 border-white shadow-sm flex items-center justify-center text-blue-600 font-bold text-xs group-hover:scale-105 transition-transform">王</div>
        <div class="flex-1 overflow-hidden">
          <p class="text-xs font-bold text-gray-900">王经理</p>
          <p class="text-[10px] text-gray-500 truncate">华东大区负责人</p>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </div>
    </div>
  </aside>

  <!-- 主工作区 -->
  <main class="flex-1 flex flex-col min-w-0 relative z-10 transition-all duration-300">
    <header class="h-14 flex items-center justify-between px-6 bg-white/40 backdrop-blur-md border-b border-gray-200/50 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span id="headerTitle" class="text-sm font-bold text-gray-900 truncate max-w-[180px]">新对话</span>
        <span class="text-[10px] text-gray-400 font-medium bg-blue-50 px-2 py-0.5 rounded-full text-blue-600 shrink-0">当前会话</span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <nav class="flex items-center">
          <a href="/knowledge" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">知识库</a>
          <a href="/metamodel" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">元模型</a>
          <a href="/skills" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">技能</a>
          <a href="/memory" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">记忆</a>
          <a href="/trace" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">Trace</a>
        </nav>
        <div class="h-4 w-px bg-gray-200 mx-1"></div>
        <div class="flex items-center gap-1.5 px-2 py-1 bg-white/60 border border-gray-200/50 rounded-lg text-[10px]">
          <span class="text-gray-400">协议</span>
          <select id="apiModeSelect" onchange="switchApiMode(this.value)" class="text-[10px] font-bold text-gray-800 bg-transparent border-none outline-none cursor-pointer">
            <option value="sse">SSE</option>
            <option value="agui">AG-UI</option>
          </select>
        </div>
        <div class="h-4 w-px bg-gray-200 mx-1"></div>
        <div class="flex items-center gap-1.5 px-2 py-1 bg-white/60 border border-gray-200/50 rounded-lg text-[10px]">
          <span class="text-gray-400">租户</span>
          <span id="headerTenantDisplay" class="text-gray-800 font-bold">—</span>
          <span class="text-gray-200">|</span>
          <span class="text-gray-400">用户</span>
          <span id="headerUserDisplay" class="text-gray-800 font-bold max-w-[100px] truncate" title="">—</span>
        </div>
        <button id="openPanelBtn" onclick="openRightPanel()" class="hidden p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all shadow-sm bg-white ml-1">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <!-- 对话核心区 -->
      <div class="flex-1 flex flex-col min-w-0 relative">
        <div id="chatArea" class="flex-1 overflow-y-auto custom-scrollbar px-6 py-10">
          <div id="chatInner" class="max-w-4xl mx-auto w-full space-y-10">
            <!-- 欢迎页 -->

<script>
// ═══ 状态管理 ═══
const API = '';
let apiMode = localStorage.getItem('deepagent_api_mode') || 'sse'; // 'sse' | 'agui'
let tid = localStorage.getItem('deepagent_current_tid') || genId();
localStorage.setItem('deepagent_current_tid', tid);
let hist = [], pf = [];
let activeTab = 'realtime';
let isRightPanelOpen = true;
let chatHistory = [];
let liveSpans = [];
let generatedDocs = []; // 生成的文档列表
let currentPreviewDoc = null; // 当前预览的文档

// ═══ 会话 localStorage 持久化 ═══
function saveHistToStorage() {
  try {
    const key = `deepagent_hist_${tid}`;
    localStorage.setItem(key, JSON.stringify(hist.slice(-50))); // 最多保存 50 条
  } catch(e) {}
}
function loadHistFromStorage(threadId) {
  try {
    const key = `deepagent_hist_${threadId}`;
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : [];
  } catch(e) { return []; }
}
// 推理链路 localStorage 持久化
function saveTraceToStorage() {
  try {
    const key = `deepagent_trace_${tid}`;
    // 只保存核心字段，控制大小
    const slim = liveSpans.map(s => ({
      type: s.step_name_en || s.type || '',
      name: s.title || s.step_name || '',
      step_name: s.step_name || '',
      step_name_en: s.step_name_en || '',
      phase: s.phase || '',
      detail: s.detail || '',
      duration_ms: s.duration_ms || 0,
      status: s.status || 'complete',
      input_data: s.input_data || {},
      output_data: s.output_data || {},
      metadata: s.metadata || {},
      children: s.sub_agent_spans || s.children || [],
    }));
    localStorage.setItem(key, JSON.stringify(slim));
  } catch(e) {}
}
function loadTraceFromStorage(threadId) {
  try {
    const key = `deepagent_trace_${threadId}`;
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : [];
  } catch(e) { return []; }
}
function saveChatListToStorage() {
  try {
    localStorage.setItem('deepagent_chat_list', JSON.stringify(chatHistory.slice(0, 100)));
  } catch(e) {}
}
function loadChatListFromStorage() {
  try {
    const data = localStorage.getItem('deepagent_chat_list');
    return data ? JSON.parse(data) : [];
  } catch(e) { return []; }
}

// 持久化用户 ID（优先从后端获取真实用户信息，fallback 到 localStorage 随机 ID）
let userId = localStorage.getItem('deepagent_user_id') || '';
let userName = '';
let tenantId = '';

(async function initUserIdentity() {
  try {
    const r = await fetch(API + '/api/auth/me');
    if (r.ok) {
      const me = await r.json();
      if (me.userId) {
        userId = String(me.userId);
        userName = me.name || '';
        tenantId = String(me.tenantId || '');
        localStorage.setItem('deepagent_user_id', userId);
      }
    }
  } catch (e) { /* 后端未启动或接口不存在，用 fallback */ }

  if (!userId) {
    userId = 'user_' + genId();
    localStorage.setItem('deepagent_user_id', userId);
  }
  if (!tenantId) tenantId = '292193';

  console.log('[DeepAgent] user_id:', userId, 'name:', userName, 'tenant:', tenantId);

  // 更新顶部显示
  const userEl = document.getElementById('headerUserDisplay');
  if (userEl) {
    const display = userName || userId;
    userEl.textContent = display;
    userEl.title = userName ? `${userName} (${userId})` : userId;
  }
  const tenantEl = document.getElementById('headerTenantDisplay');
  if (tenantEl) tenantEl.textContent = tenantId;
})();

function genId() {
  try { if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID().replace(/-/g, '').slice(0, 12); } catch(e) {}
  return 'xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function truncStr(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : s; }

// ═══ API 模式切换 ═══
function switchApiMode(mode) {
  apiMode = mode;
  localStorage.setItem('deepagent_api_mode', mode);
  console.log('[DeepAgent] API mode:', mode);
}

// 初始化 select 状态
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('apiModeSelect');
  if (sel) sel.value = apiMode;
});

// ═══ Interrupt UI 渲染 ═══
function renderInterruptCard(iv) {
  const type = iv.type || 'confirm';
  const title = iv.title || '请确认';
  const message = iv.message || '';
  const options = iv.options || [];
  const interruptId = iv.interrupt_id || '';

  let html = `<div class="interrupt-card bg-white border border-blue-200 rounded-xl p-4 my-3 shadow-sm" data-interrupt-id="${esc(interruptId)}">`;
  html += `<div class="text-sm font-bold text-gray-800 mb-2">${esc(title)}</div>`;
  if (message) html += `<div class="text-xs text-gray-600 mb-3">${esc(message)}</div>`;

  if (type === 'select' || type === 'multi_select') {
    html += `<div class="space-y-2">`;
    for (const opt of options) {
      html += `<button onclick="handleInterruptSelect('${esc(interruptId)}', '${esc(opt.id)}')" 
        class="w-full text-left px-3 py-2.5 border border-gray-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition-all group">
        <div class="text-sm font-medium text-gray-800 group-hover:text-blue-700">${esc(opt.label)}</div>
        ${opt.description ? `<div class="text-xs text-gray-500 mt-0.5">${esc(opt.description)}</div>` : ''}
      </button>`;
    }
    html += `</div>`;
  } else if (type === 'input') {
    const defaultVal = iv.default_value || '';
    html += `<div class="flex gap-2">
      <input type="text" id="interrupt-input-${esc(interruptId)}" value="${esc(defaultVal)}" 
        placeholder="请输入..." class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200">
      <button onclick="handleInterruptInput('${esc(interruptId)}')" 
        class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">提交</button>
    </div>`;
  } else {
    // confirm
    html += `<div class="flex gap-2 justify-end">
      <button onclick="handleInterruptResponse('${esc(interruptId)}', {cancelled: true})" 
        class="px-4 py-2 text-sm border border-gray-200 rounded-lg hover:bg-gray-50">取消</button>
      <button onclick="handleInterruptResponse('${esc(interruptId)}', {value: 'confirmed'})" 
        class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">确认</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function handleInterruptSelect(interruptId, selectedId) {
  // 禁用卡片
  const card = document.querySelector(`[data-interrupt-id="${interruptId}"]`);
  if (card) {
    card.querySelectorAll('button').forEach(b => { b.disabled = true; b.classList.add('opacity-50'); });
    // 高亮选中项
    const selected = card.querySelector(`button[onclick*="'${selectedId}'"]`);
    if (selected) selected.classList.add('border-blue-500', 'bg-blue-50');
  }
  handleInterruptResponse(interruptId, { value: selectedId });
}

function handleInterruptInput(interruptId) {
  const input = document.getElementById(`interrupt-input-${interruptId}`);
  const value = input ? input.value.trim() : '';
  if (!value) return;
  handleInterruptResponse(interruptId, { value });
}

async function handleInterruptResponse(interruptId, response) {
  // 发送 resume 请求
  const resumeData = { interrupt_id: interruptId, ...response };
  console.log('[interrupt] resume:', resumeData);

  if (apiMode === 'agui') {
    // AG-UI 模式：通过 /api/chat/agui 发送 resume
    await sendAgui('', { resume: resumeData });
  } else {
    // SSE 模式：通过 /api/chat 发送（将 resume 信息作为新消息）
    const label = response.value || '确认';
    await send(label);
  }
}
// ═══ 右侧面板控制 ═══
function closeRightPanel() {
  isRightPanelOpen = false;
  document.getElementById('rightPanel').classList.add('w-0', 'opacity-0', 'pointer-events-none', 'm-0', 'border-0');
  document.getElementById('rightPanel').classList.remove('w-[400px]', 'm-6');
  document.getElementById('openPanelBtn').classList.remove('hidden');

function openRightPanel() {
  isRightPanelOpen = true;
  document.getElementById('rightPanel').classList.remove('w-0', 'opacity-0', 'pointer-events-none', 'm-0', 'border-0');
  document.getElementById('rightPanel').classList.add('w-[400px]', 'm-6');
  document.getElementById('openPanelBtn').classList.add('hidden');
}

// ═══ Tab 切换 ═══
function switchTab(tab) {
  activeTab = tab;
  const tabRealtime = document.getElementById('tabRealtime');
  const tabDocs = document.getElementById('tabDocs');
  const panelRealtime = document.getElementById('panelRealtime');
  const panelDocs = document.getElementById('panelDocs');

  if (tab === 'realtime') {
    tabRealtime.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600';
    tabDocs.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all text-gray-500 hover:bg-white/40';
    panelRealtime.classList.remove('hidden');
    panelDocs.classList.add('hidden');
  } else {
    tabDocs.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600';
    tabRealtime.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all text-gray-500 hover:bg-white/40';
    panelDocs.classList.remove('hidden');
    panelRealtime.classList.add('hidden');
  }
}

// ═══ 对话历史 ═══
function renderHistoryItem(title, active, chatId) {
  return `<div class="group flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-all ${active ? 'bg-white shadow-sm ring-1 ring-black/5 text-blue-600' : 'text-gray-600 hover:bg-white/60 hover:text-gray-900'}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="${active ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-600'}"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="text-xs font-medium truncate flex-1">${esc(title)}</span>
    <button onclick="event.stopPropagation();deleteChat('${esc(chatId)}')" class="hidden group-hover:flex w-5 h-5 items-center justify-center rounded-lg text-gray-300 hover:text-red-500 hover:bg-red-50 transition-all shrink-0" title="删除会话">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    ${active ? '<div class="w-1 h-3 bg-blue-500 rounded-full"></div>' : ''}
  </div>`;
}

function renderChatList() {
  saveChatListToStorage(); // 持久化到 localStorage
  const todayItems = document.getElementById('chatListTodayItems');
  const yesterdayItems = document.getElementById('chatListYesterdayItems');

  // 按自然日零点划分（而不是 24 小时）
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
  const yesterdayStart = todayStart - 86400;

  let todayHtml = '';
  let yesterdayHtml = '';
  let olderHtml = '';

  chatHistory.forEach(c => {
    const isActive = c.id === tid;
    const html = `<div onclick="loadChat('${esc(c.id)}')">${renderHistoryItem(c.title || '新对话', isActive, c.id)}</div>`;
    if (c.time >= todayStart) todayHtml += html;
    else if (c.time >= yesterdayStart) yesterdayHtml += html;
    else yesterdayHtml += html; // 更早的也放到"更早"分组
  });

  todayItems.innerHTML = todayHtml || '<div class="px-4 text-[10px] text-gray-400">暂无</div>';
  yesterdayItems.innerHTML = yesterdayHtml || '<div class="px-4 text-[10px] text-gray-400">暂无</div>';
}

  try {
    await fetch(API + '/api/conversations/' + chatId, { method: 'DELETE' });

let searchTimer = null;

function filterChatList(query) {
  const q = (query || '').trim().toLowerCase();
  const todayItems = document.getElementById('chatListTodayItems');
  const yesterdayItems = document.getElementById('chatListYesterdayItems');
  const todaySection = document.getElementById('chatListToday');
  const yesterdaySection = document.getElementById('chatListYesterday');

  if (!q) {
    // 无搜索词，恢复正常显示
    todaySection.classList.remove('hidden');
    yesterdaySection.classList.remove('hidden');
    renderChatList();
    return;
  }

  // 过滤匹配的对话
  const now2 = new Date();
  const todayStart2 = new Date(now2.getFullYear(), now2.getMonth(), now2.getDate()).getTime() / 1000;
  let todayHtml = '';
  let yesterdayHtml = '';

  chatHistory.forEach(c => {
    const title = c.title || '新对话';
    if (!title.toLowerCase().includes(q)) return;
    const isActive = c.id === tid;
    const html = `<div onclick="loadChat('${esc(c.id)}')">${renderHistoryItem(title, isActive, c.id)}</div>`;
    if (c.time >= todayStart2) todayHtml += html;
    else yesterdayHtml += html;
  });

  if (todayHtml) {
    todaySection.classList.remove('hidden');
    todayItems.innerHTML = todayHtml;
  } else {
    todaySection.classList.add('hidden');
  }

  if (yesterdayHtml) {
    yesterdaySection.classList.remove('hidden');
    yesterdayItems.innerHTML = yesterdayHtml;
  } else {
    yesterdaySection.classList.add('hidden');
  }

  // 都没有匹配
  if (!todayHtml && !yesterdayHtml) {
    todaySection.classList.remove('hidden');
    todayItems.innerHTML = '<div class="px-4 py-4 text-center text-[11px] text-gray-400">未找到匹配的对话</div>';
    yesterdaySection.classList.add('hidden');
  }
}

// ═══ Trace 链路渲染（层级结构版）═══
// 设计参考：入口预处理 → 上下文准备 → 模型推理 Agent Loop（含循环/Skill 子 Agent）→ 回复输出 → 后处理
function resetTrace() {

    } else {

function renderTraceNode(span, idx, seqNum) {
  const isComplete = span.status === 'complete';
  const isActive = span.status === 'active';
  const isSkipped = span.status === 'skipped';
  const isError = span.status === 'error' || span.status === 'failed';
  const md = span.metadata || {};
  const isFinalResponse = (md.is_final === true) || (span.output_data && span.output_data.is_final === true);

  const stepNum = seqNum || (idx + 1);
  let stepName = span.step_name || span.title || '';
  const stepNameEn = span.step_name_en || span.type || '';
  const durationMs = span.duration_ms || 0;
  const durationText = durationMs ? `${Math.round(durationMs)}ms` : '';
  const detail = span.detail || span.desc || '';

  // 判断是否为中间件节点
  const isMiddleware = stepNameEn === 'middleware' || (md.is_middleware === true);
  // 判断是否为技能执行节点
  const isSkillExec = stepNameEn === 'skill_execution' || (md.skill_name != null);
  // 判断是否有子 Agent 循环
  const hasSubAgent = span.sub_agent_spans && span.sub_agent_spans.length > 0;

  // ═══ 提取异常信息 ═══
  const errorInfo = _extractErrorInfo(span);

  // ═══ 构建详细描述文本 ═══
  const descText = _buildStepDescription(span, md, detail);

  // ═══ 构建输入/输出展开区域 ═══
  const ioHtml = _buildIOSection(span);

  // ═══ 构建异常详情展开区域 ═══
  const errorHtml = isError && errorInfo ? _buildErrorSection(errorInfo) : '';

  // ═══ 中间件节点：紧凑布局 [N] · ⚙️ Name · Xms — desc ═══
  if (isMiddleware) {
    const mwName = md.middleware_name || stepName;
    const checkPrefix = isError ? '✗' : (isComplete ? '✓' : (isActive ? '⏳' : '·'));
    const errorClass = isError ? 'trace-line-mw-error' : '';
    const textColorClass = isError ? 'text-red-600' : (isActive ? 'text-blue-500' : 'text-gray-500');
    return `
      <div class="trace-line-mw flex items-start py-[2px] text-[10.5px] leading-[1.6] ${textColorClass} ${errorClass}">
        <span class="trace-seq ${isError ? 'trace-seq-error' : 'text-gray-400'} shrink-0 select-none">[${stepNum}]</span>
        <div class="flex-1 min-w-0">
          <span>${checkPrefix} ${isError ? '❌' : '⚙️'} <span class="trace-mw-name ${isError ? 'text-red-700' : ''}">${esc(mwName)}</span></span>
          ${durationText ? `<span class="${isError ? 'text-red-400' : 'text-gray-400'} ml-1">· ${durationText}</span>` : ''}
          ${isError && errorInfo ? `<span class="text-red-500 ml-1 font-semibold">异常</span>` : ''}
          ${descText ? `<span class="trace-desc ${isError ? 'text-red-400' : 'text-gray-400'} ml-1">— ${descText}</span>` : ''}
          ${errorHtml}
          ${ioHtml}
        </div>
      </div>`;
  }

  // ═══ 普通节点：[N] 步骤名 · Xms — 详细描述 ═══
  let subAgentHtml = '';
  if (hasSubAgent) {
    // 子 Agent 链路：与主 Agent 相同的层级结构
    subAgentHtml = `<div class="ml-[32px] pl-3 my-1 border-l-2 border-indigo-300/60 text-[10px] leading-[1.6]">`;

    const subSpans = span.sub_agent_spans;

    // 辅助：渲染输入/输出折叠
    function subIO(s) {
      const inp = s.input_data || {};
      const out = s.output_data || {};
      const hasData = (Object.keys(inp).length > 0) || (Object.keys(out).length > 0);
      if (!hasData) return '';
      let h = `<details class="pl-2 my-0.5 text-[9px]"><summary class="cursor-pointer text-blue-400 hover:text-blue-600 select-none">查看输入/输出</summary><div class="pl-2 text-gray-500 bg-gray-50/80 rounded p-1.5 my-0.5 max-h-[150px] overflow-auto text-[8.5px] font-mono">`;
      if (Object.keys(inp).length > 0) h += `<div><span class="text-gray-600 font-semibold font-sans">输入:</span><pre class="whitespace-pre-wrap mt-0.5">${esc(JSON.stringify(inp, null, 2).slice(0, 400))}</pre></div>`;
      if (Object.keys(out).length > 0) h += `<div class="mt-1"><span class="text-gray-600 font-semibold font-sans">输出:</span><pre class="whitespace-pre-wrap mt-0.5">${esc(JSON.stringify(out, null, 2).slice(0, 400))}</pre></div>`;
      h += `</div></details>`;
      return h;
    }

    // 辅助：渲染一组中间件（按 phase 分组折叠，每个可查看输入/输出）
    function renderSubMwGroup(mws, indent) {
      if (mws.length === 0) return '';
      // 按 phase 分组
      const groups = {};
      mws.forEach(m => {
        const ph = (m.metadata || {}).phase || 'other';
        (groups[ph] = groups[ph] || []).push(m);
      });
      let h = '';
      const phaseLabels = { 'before_model': '推理前', 'after_model': '推理后', 'wrap_tool_call': '护栏(含执行)', 'before_agent': '准备阶段', 'after_agent': '结束阶段' };
      for (const [ph, items] of Object.entries(groups)) {
        const dur = items.reduce((s, m) => s + (m.duration_ms || 0), 0);
        const durText = dur ? ` · ${Math.round(dur)}ms` : '';
        const label = phaseLabels[ph] || ph;
        h += `<details class="${indent} my-0.5"><summary class="cursor-pointer text-gray-400 hover:text-gray-600 select-none text-[9.5px]">⚙️ ${items.length} 个 ${label} 中间件${durText}</summary><div class="pl-3 text-[9px]">`;
        items.forEach(m => {
          const mName = (m.metadata || {}).middleware_name || m.name || '';
          const mDur = m.duration_ms ? ` ${Math.round(m.duration_ms)}ms` : '';
          const effect = (m.metadata || {}).has_effect ? ' <span class="text-amber-500">→ 已修改</span>' : '';
          h += `<div class="text-gray-500">· ${esc(mName)}${mDur}${effect}</div>`;
          h += subIO(m);
        });
        h += `</div></details>`;
      }
      return h;
    }

    // 分离 context 和 reasoning 阶段
    let contextEnd = 0;
    for (let i = 0; i < subSpans.length; i++) {
      const t = subSpans[i].type || '';
      const mwPhase = (subSpans[i].metadata || {}).phase || '';
      if (t === 'tool_call' || t === 'skill_execution') { contextEnd = i; break; }
      if (t === 'middleware' && (mwPhase === 'before_model' || mwPhase === 'after_model' || mwPhase === 'wrap_tool_call')) { contextEnd = i; break; }
      contextEnd = i + 1;
    }

    // ═══ 上下文准备 ═══
    const ctxSpans = subSpans.slice(0, contextEnd);
    if (ctxSpans.length > 0) {
      subAgentHtml += `<div class="font-semibold text-gray-700 mb-0.5">📦 上下文准备</div>`;
      const ctxMw = ctxSpans.filter(s => s.type === 'middleware');
      const ctxNonMw = ctxSpans.filter(s => s.type !== 'middleware');
      ctxNonMw.forEach(s => {
        const dur = s.duration_ms ? ` · ${Math.round(s.duration_ms)}ms` : '';
        const label = s.type === 'context_build' ? '上下文构建' : (s.type === 'memory_retrieval' ? '记忆检索' : (s.name || s.type));
        subAgentHtml += `<div class="pl-3 text-gray-600">${esc(label)}${dur} <span class="text-gray-400">${esc(s.detail || '')}</span></div>`;
        subAgentHtml += subIO(s);
      });
      subAgentHtml += renderSubMwGroup(ctxMw, 'pl-3');
    }

    // ═══ 模型推理 ═══
    const reasonSpans = subSpans.slice(contextEnd);
    if (reasonSpans.length > 0) {
      subAgentHtml += `<div class="font-semibold text-gray-700 mt-1.5 mb-0.5">⚡ 模型推理</div>`;

      let loopNum = 0;
      let beforeModelBuf = [];
      let afterModelBuf = [];
      let wrapToolBuf = [];
      let inLoop = false;

      function flushBeforeModel() {
        if (beforeModelBuf.length === 0) return '';
        let h = renderSubMwGroup(beforeModelBuf, 'pl-5');
        beforeModelBuf = [];
        return h;
      }
      function flushAfterModel() {
        if (afterModelBuf.length === 0) return '';
        let h = renderSubMwGroup(afterModelBuf, 'pl-5');
        afterModelBuf = [];
        return h;
      }
      function flushWrapTool() {
        if (wrapToolBuf.length === 0) return '';
        let h = renderSubMwGroup(wrapToolBuf, 'pl-5');
        wrapToolBuf = [];
        return h;
      }

      for (let i = 0; i < reasonSpans.length; i++) {
        const s = reasonSpans[i];
        const sType = s.type || '';
        const sMeta = s.metadata || {};
        const mwPhase = sMeta.phase || '';

        if (sType === 'middleware') {
          const mwName = sMeta.middleware_name || s.name || '';
          // ContextWindowMiddleware/SummarizationMiddleware(before_model) 标志新循环开始
          if ((mwName.includes('Summarization') || mwName.includes('ContextWindow')) && mwPhase === 'before_model' && beforeModelBuf.length === 0 && afterModelBuf.length === 0) {
            // flush 上一轮剩余
            subAgentHtml += flushAfterModel();
            subAgentHtml += flushWrapTool();
            loopNum++;
            // 预扫描本轮的 tool_call 名称
            let toolName = '';
            for (let j = i + 1; j < reasonSpans.length; j++) {
              if (reasonSpans[j].type === 'tool_call') { toolName = reasonSpans[j].name || ''; break; }
              if (reasonSpans[j].type === 'middleware' && ((reasonSpans[j].metadata || {}).middleware_name || '').match(/Summarization|ContextWindow/) && (reasonSpans[j].metadata || {}).phase === 'before_model') break;
            }
            const loopLabel = toolName ? `调用 ${toolName.replace('tool:', '')}` : '生成最终回复 ✅';
            subAgentHtml += `<div class="text-amber-600 font-medium mt-1.5 pl-2">├─ 循环 ${loopNum}</div>`;
            inLoop = true;
          }
          // 按 phase 分桶
          if (mwPhase === 'before_model') beforeModelBuf.push(s);
          else if (mwPhase === 'after_model') afterModelBuf.push(s);
          else if (mwPhase === 'wrap_tool_call') wrapToolBuf.push(s);
          else beforeModelBuf.push(s); // fallback
        } else if (sType === 'tool_call' || sType === 'skill_execution') {
          // 显示顺序：before_model → 推理节点 → after_model → tool_call（含护栏）
          subAgentHtml += flushBeforeModel();
          const toolName = (s.name || '').replace('tool:', '');
          subAgentHtml += `<div class="text-gray-700 pl-5">🧠 模型推理 → 决定调用 ${esc(toolName)}</div>`;
          subAgentHtml += flushAfterModel();
          const toolStatus = sMeta.status === 'error' ? '<span class="text-red-500">❌</span>' : '<span class="text-green-600">✓</span>';
          const dur = s.duration_ms ? ` · ${Math.round(s.duration_ms)}ms` : '';
          // wrap_tool_call 护栏折叠在 tool_call 内部（它包裹了工具执行）
          const wrapHtml = flushWrapTool();
          subAgentHtml += `<div class="text-blue-600 pl-5 font-medium">${toolStatus} ${esc(s.name || '')}${dur}</div>`;
          if (wrapHtml) subAgentHtml += `<div class="pl-7">${wrapHtml}</div>`;
          subAgentHtml += subIO(s);
        } else {
          subAgentHtml += flushBeforeModel();
          subAgentHtml += flushAfterModel();
          subAgentHtml += flushWrapTool();
          const dur = s.duration_ms ? ` · ${Math.round(s.duration_ms)}ms` : '';
          subAgentHtml += `<div class="pl-5 text-gray-600">${esc(s.name || sType)}${dur}</div>`;
          subAgentHtml += subIO(s);
        }
      }
      // flush 最终剩余（最后一轮是"生成最终回复"，没有 tool_call）
      if (beforeModelBuf.length > 0 || afterModelBuf.length > 0) {
        subAgentHtml += flushBeforeModel();
        subAgentHtml += `<div class="text-gray-700 pl-5">🧠 模型推理 → 生成最终回复</div>`;
        subAgentHtml += flushAfterModel();
      }
      subAgentHtml += flushWrapTool();
    }

    subAgentHtml += `</div>`;
  }

  // 技能后缀
  const skillSuffix = isSkillExec ? ` (${md.skill_mode || md.context_mode || 'inline'})` : '';
  // 最终回复标记
  const finalMark = isFinalResponse ? ' → 生成回复' : '';

  // 异常节点样式
  const errorLineClass = isError ? 'trace-line-error' : '';
  const activeClass = isActive ? 'bg-blue-50/60 rounded px-1 -mx-1' : '';

  return `
    <div class="trace-line flex items-start py-[3px] text-[11px] leading-[1.7] ${errorLineClass} ${activeClass}">
      <span class="trace-seq ${isError ? 'trace-seq-error' : 'text-gray-400'} shrink-0 select-none">[${stepNum}]</span>
      <div class="flex-1 min-w-0">
        <span class="trace-step-name font-semibold ${isError ? 'trace-step-name-error' : 'text-gray-800'}">${esc(stepName)}${skillSuffix}${finalMark}</span>
        ${isError ? ' <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold bg-red-100 text-red-700 border border-red-200">异常</span>' : ''}
        ${durationText ? `<span class="${isError ? 'text-red-400' : 'text-gray-400'} ml-1">· ${durationText}</span>` : ''}
        ${descText ? `<br/><span class="trace-desc ${isError ? 'text-red-500' : 'text-gray-500'} text-[10.5px]">${descText}</span>` : ''}
        ${isFinalResponse ? ' ✅' : ''}
        ${isActive ? ' <span class="inline-block w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse align-middle"></span>' : ''}
        ${errorHtml}
        ${ioHtml}
      </div>
    </div>
    ${subAgentHtml}`;
}

// ═══ 提取异常信息 ═══
function _extractErrorInfo(span) {
  const md = span.metadata || {};
  const outputData = span.output_data || {};

  // 多种来源提取错误信息
  const errorMessage = span.error_message
    || md.error_message || md.error || md.exception
    || outputData.error_message || outputData.error || outputData.exception
    || (span.error && (typeof span.error === 'string' ? span.error : span.error.message))
    || '';

  const errorType = md.error_type || md.exception_type || outputData.error_type || '';
  const errorStack = md.error_stack || md.traceback || outputData.traceback || outputData.stack || '';

  if (!errorMessage && !errorType && !errorStack) return null;

  return {
    type: errorType,
    message: errorMessage,
    stack: errorStack,
  };
}

// ═══ 构建异常详情可展开区域 ═══
function _buildErrorSection(errorInfo) {
  if (!errorInfo) return '';

  let content = '';
  if (errorInfo.type) {
    content += `<div class="mb-1"><span class="font-bold text-red-700">异常类型:</span> <span class="text-red-600">${esc(errorInfo.type)}</span></div>`;
  }
  if (errorInfo.message) {
    content += `<div class="mb-1"><span class="font-bold text-red-700">错误信息:</span> <span class="text-red-600">${esc(truncStr(errorInfo.message, 500))}</span></div>`;
  }
  if (errorInfo.stack) {
    content += `<div><span class="font-bold text-red-700">堆栈:</span><pre class="trace-error-content">${esc(truncStr(errorInfo.stack, 2000))}</pre></div>`;
  }

  return `
    <details class="trace-error-details mt-0.5">
      <summary class="cursor-pointer text-[10px] text-red-500 hover:text-red-700 select-none inline-flex items-center gap-0.5">
        <svg class="trace-error-chevron w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        <span>🔍 查看异常详情</span>
      </summary>
      <div class="trace-error-content mt-1">
        ${content}
      </div>
    </details>`;
}

// ═══ 构建输入/输出可展开区域 ═══
function _buildIOSection(span) {
  const inputData = span.input_data || {};
  const outputData = span.output_data || {};
  const md = span.metadata || {};

  // 判断是否有有意义的输入/输出数据
  const inputStr = _formatIOData(inputData);
  const outputStr = _formatIOData(outputData);

  if (!inputStr && !outputStr) return '';

  let content = '';
  if (inputStr) {
    content += `<div class="mb-1"><span class="text-blue-600 font-semibold">输入:</span><pre class="trace-io-pre">${esc(inputStr)}</pre></div>`;
  }
  if (outputStr) {
    content += `<div><span class="text-green-600 font-semibold">输出:</span><pre class="trace-io-pre">${esc(outputStr)}</pre></div>`;
  }

  return `
    <details class="trace-io-details mt-0.5">
      <summary class="cursor-pointer text-[10px] text-blue-500 hover:text-blue-700 select-none inline-flex items-center gap-0.5">
        <svg class="trace-io-chevron w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        <span>查看输入/输出</span>
      </summary>
      <div class="trace-io-content mt-1 p-2 rounded-lg bg-gray-50/80 border border-gray-200/60 text-[10px] leading-[1.5]">
        ${content}
      </div>
    </details>`;
}

function _formatIOData(data) {
  if (!data || typeof data !== 'object') return '';
  const keys = Object.keys(data);
  if (keys.length === 0) return '';
  // 过滤掉空值和内部字段
  const filtered = {};
  for (const k of keys) {
    if (data[k] === null || data[k] === undefined || data[k] === '') continue;
    if (k.startsWith('_')) continue;
    filtered[k] = data[k];
  }
  if (Object.keys(filtered).length === 0) return '';
  try {
    const str = JSON.stringify(filtered, null, 2);
    // 截断过长的内容
    return str.length > 2000 ? str.slice(0, 2000) + '\n... (已截断)' : str;
  } catch (e) {
    return String(data);
  }
}

// ═══ 为每种步骤类型生成详细技术描述 ═══
function _buildStepDescription(span, md, fallbackDetail) {
  const type = span.step_name_en || span.type || '';
  const outputData = span.output_data || {};
  const inputData = span.input_data || {};

  switch (type) {
    case 'title_generation': {
      const title = md.generated_title || outputData.title || '';
      return title
        ? `生成标题「${esc(truncStr(title, 30))}」（规则同步 + 后台 LLM 异步优化）`
        : (fallbackDetail || '生成会话标题（规则同步 + 后台 LLM 异步优化）');
    }
    case 'content_review': {
      const passed = md.passed !== false && outputData.passed !== false;
      const blocked = md.blocked_reason || (outputData.blocked_keywords || []).join(', ');
      return passed
        ? '敏感词 + LLM 语义审查 → ✅ 通过'
        : `敏感词 + LLM 语义审查 → ❌ 拦截: ${esc(truncStr(blocked, 40))}`;
    }
    case 'query_rewrite': {
      const original = md.original_query || inputData.original_query || '';
      const rewritten = md.rewritten_query || outputData.rewritten_query || '';
      if (original && rewritten && original !== rewritten) {
        return `改写:「${esc(truncStr(original, 20))}」→「${esc(truncStr(rewritten, 30))}」`;
      }
      return fallbackDetail || '首轮对话，无需改写';
    }
    case 'context_build': {
      const msgCount = md.message_count || inputData.message_count || outputData.message_count || 0;
      const tokens = md.estimated_tokens || outputData.estimated_tokens || 0;
      let desc = `构建 LLM 上下文: ${msgCount}条消息`;
      if (tokens) desc += `, 预估 ${tokens} tokens`;
      return desc;
    }
    case 'memory_retrieval': {
      const hitCount = md.hit_count != null ? md.hit_count : (outputData.hit_count != null ? outputData.hit_count : '?');
      return `命中 ${hitCount} 条记忆 → 注入 SystemMessage`;
    }
    case 'middleware': {
      const mwName = md.middleware_name || span.step_name || '';
      if (mwName.includes('DanglingToolCall')) return '无悬挂 tool_calls';
      if (mwName.includes('FileProcess')) {
        const changed = md.changed || outputData.changed;
        return changed ? '文件已处理' : '无文件需处理';
      }
      if (mwName.includes('InputTransform')) {
        const changed = md.changed || outputData.changed;
        return `敏感词 + PII脱敏 → ${changed ? '已变更' : '无变更'}`;
      }
      if (mwName.includes('MultimodalInject')) {
        const changed = md.changed || outputData.changed;
        return changed ? '多模态内容已注入' : '无变更';
      }
      if (mwName.includes('Summarization') || mwName.includes('ContextWindow')) {
        const before = md.before_count || '';
        const after = md.after_count || '';
        return (before && after) ? `上下文压缩: ${before}条→${after}条` : '无需压缩';
      }
      if (mwName.includes('SubagentLimit')) return '无子 Agent 并发';
      if (mwName.includes('LoopDetection')) {
        const loopCount = md.loop_count || 0;
        return loopCount > 0 ? `检测到循环 (${loopCount}次)` : '首次调用，无循环';
      }
      if (mwName.includes('OutputValidation')) return '输出敏感词校验通过';
      if (mwName.includes('Guardrail')) {
        const toolName = md.tool_name || '';
        return toolName ? `安全护栏: ${esc(toolName)} → 放行` : '安全护栏 → 放行';
      }
      if (mwName.includes('ToolErrorHandling')) return '异常兜底';
      if (mwName.includes('Clarification')) return '透传';
      if (mwName.includes('OutputRender')) return 'PII 还原 + Markdown 格式化';
      return fallbackDetail || '';
    }
    case 'llm_call': {
      const iteration = md.iteration || '';
      const toolCalls = md.tool_calls || outputData.tool_calls || [];
      if (toolCalls.length > 0) {
        const firstTool = typeof toolCalls[0] === 'string' ? toolCalls[0] : (toolCalls[0].name || toolCalls[0].tool_name || '');
        return iteration ? `第${iteration}轮: 调用 ${esc(firstTool)}` : `调用 ${esc(firstTool)}`;
      }
      const isFinal = (md.is_final === true) || (span.output_data && span.output_data.is_final === true);
      if (isFinal) return iteration ? `第${iteration}轮: 生成最终回复` : '生成最终回复';
      return fallbackDetail || (iteration ? `第${iteration}轮推理` : '');
    }
    case 'tool_call': {
      const toolName = md.display_name || md.tool_name || '';
      const output = md.output || (outputData.result) || '';
      const ctxMode = md.skill_context_mode || '';
      let desc = toolName || '';
      if (ctxMode) desc += ` [${ctxMode}]`;
      if (output) desc += ` → ${esc(truncStr(String(output), 50))}`;
      return desc || fallbackDetail || '';
    }
    case 'skill_execution': {
      const skillName = md.skill_name || '';
      const mode = md.skill_mode || md.context_mode || 'inline';
      let desc = skillName || '';
      if (md.skill_result_desc) {
        desc = `${skillName} [${mode}] → ${esc(truncStr(md.skill_result_desc, 50))}`;
      } else if (mode === 'inline') {
        desc += ' [inline] → 返回 SOP prompt，LLM 下一轮按步骤执行';
      } else if (mode === 'fork') {
        desc += ' [fork] → 启动子 Agent 独立执行，返回结果';
      } else {
        desc += ` [${mode}]`;
      }
      return desc || fallbackDetail || '';
    }
    case 'memory_extract': {
      const count = md.extracted_count || outputData.extracted_count || '?';
      return `提取 ${count} 条新记忆（MemoryMiddleware.aafter_agent → engine.extract_and_update）`;
    }
    case 'response_complete':
    case 'response': {
      return 'SSE 流式推送最终回复（前端 type=done 事件）';
    }
    case 'stream_pii_restore': {
      return '流式 PII 占位符还原为原始值（逐 token，before SSE push）';
    }
    case 'output_render': {
      return 'PII 还原 fallback + 输出格式化: Markdown 清理 + UI 组件映射';
    }
    default:
      return fallbackDetail || '';
  }
}

function formatDetailValue(val) {
  if (val == null) return '';
  if (typeof val === 'string') {
    // 尝试美化 JSON 字符串
    const trimmed = val.trim();
    if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
      try { return JSON.stringify(JSON.parse(trimmed), null, 2); } catch(e) {}
    }
    return val;
  }
  try { return JSON.stringify(val, null, 2); } catch(e) { return String(val); }
}

function refreshTrace() {
  const el = document.getElementById('traceContent');

  // ═══ 阶段定义（严格线性：entry → context → reasoning → output → post）═══
  // 关键设计：阶段只能前进，不能回退。一旦进入 reasoning，后续所有中间件都归属 reasoning。
  const PHASE_ORDER = ['entry', 'context', 'reasoning', 'output', 'post'];

  const PHASE_META = {
    'entry': { label: '入口预处理', labelEn: 'server.py 入口层，LangGraph 之外', icon: '🚀' },
    'context': { label: '上下文准备', labelEn: 'before_agent，执行 1 次', icon: '📦' },
    'reasoning': { label: '模型推理 Agent Loop', labelEn: '', icon: '⚡' },
    'output': { label: '回复输出', labelEn: '', icon: '✅' },
    'post': { label: '后处理', labelEn: 'after_agent，执行 1 次', icon: '💾' },
  };

  // 根据 span 类型确定其"自然"阶段
  function getNaturalPhase(span) {
    const typeKey = span.step_name_en || span.type || '';
    // 入口预处理
    if (['content_review', 'content_review_input', 'content_review_output', 'query_rewrite', 'title_generation'].includes(typeKey)) return 'entry';
    // 上下文准备
    if (['context_build', 'memory_retrieval', 'user_input'].includes(typeKey)) return 'context';
    // Agent Loop
    if (['llm_call', 'tool_call', 'skill_execution', 'hierarchical_search', 'error'].includes(typeKey)) return 'reasoning';
    // 回复输出
    if (['response_complete', 'response', 'stream_pii_restore', 'output_render'].includes(typeKey)) return 'output';
    // 后处理
    if (typeKey === 'memory_extract') return 'post';
    // 中间件：根据设计归属阶段 + 实际执行阶段联合判断
    // 设计原则：每个中间件有唯一的"设计归属阶段"（见 Agent整体设计方案.md 架构图）
    //   - before_agent 层：Tracing / DanglingToolCall / FileProcess / InputTransform / MultimodalInject / Memory
    //   - before_model 层：Summarization
    //   - after_model 层：SubagentLimit / LoopDetection / OutputValidation
    //   - wrap_tool_call 层：Guardrail / ToolErrorHandling / Clarification
    //   - 输出转换层：OutputRender
    //   - after_agent 层：Memory（记忆提取）
    // 规则：只有当 metadata.phase 匹配中间件的设计归属阶段时才显示，否则隐藏
    if (typeKey === 'middleware') {
      const mwName = (span.metadata && span.metadata.middleware_name) || span.step_name || '';
      // 优先取 input_data/input 中的原始 phase（before_model/after_model），
      // metadata.phase 可能被映射后的值覆盖（历史数据兼容）
      const rawPhaseFromInput = (span.input_data && span.input_data.phase) || (span.input && span.input.phase) || '';
      const metaPhase = (span.metadata && span.metadata.phase) || '';
      // 如果 metaPhase 是映射后的值（context/reasoning/post），优先用 input 中的原始值
      const MAPPED_PHASES = ['context', 'reasoning', 'output', 'post', 'entry'];
      const mwPhase = (rawPhaseFromInput && !MAPPED_PHASES.includes(rawPhaseFromInput))
        ? rawPhaseFromInput
        : (!MAPPED_PHASES.includes(metaPhase) ? metaPhase : rawPhaseFromInput || metaPhase);

      // 中间件 → 设计归属阶段映射
      // key: 中间件名称片段
      // value: { allow: 允许显示的执行阶段列表, display: 显示在哪个前端阶段 }
      const MW_DESIGN_PHASE = {
        // before_agent 层（上下文准备）
        'DanglingToolCall':   { allow: ['before_agent'], display: 'context' },
        'FileProcess':        { allow: ['before_agent'], display: 'context' },
        'InputTransform':     { allow: ['before_agent'], display: 'context' },
        'MultimodalInject':   { allow: ['before_agent'], display: 'context' },
        // before_model 层（Agent Loop - LLM 调用前）
        'Summarization':      { allow: ['before_model'], display: 'reasoning' },
        'ContextWindow':      { allow: ['before_model'], display: 'reasoning' },
        // after_model 层（Agent Loop - LLM 返回后）
        'SubagentLimit':      { allow: ['after_model'], display: 'reasoning' },
        'LoopDetection':      { allow: ['after_model'], display: 'reasoning' },
        'OutputValidation':   { allow: ['after_model'], display: 'reasoning' },
        // wrap_tool_call 层（Agent Loop - 工具调用时）
        'Guardrail':          { allow: ['wrap_tool_call'], display: 'reasoning' },
        'ToolErrorHandling':  { allow: ['wrap_tool_call'], display: 'reasoning' },
        'Clarification':      { allow: ['wrap_tool_call'], display: 'reasoning' },
        // 输出转换层（after_agent 执行，但语义归属"回复输出"）
        'OutputRender':       { allow: ['after_agent'], display: 'output' },
        'StreamPIIRestor':    { allow: ['after_agent'], display: 'output' },
      };

      // 查找该中间件的设计归属阶段
      let designEntry = null;
      for (const [nameFragment, entry] of Object.entries(MW_DESIGN_PHASE)) {
        if (mwName.includes(nameFragment)) { designEntry = entry; break; }
      }

      // 如果找到设计归属且执行阶段匹配 → 使用指定的显示阶段
      if (designEntry) {
        if (designEntry.allow.includes(mwPhase)) {
          return designEntry.display;
        }
        // before_model / after_model 阶段：即使不是设计归属，也显示在 reasoning 中（它们确实执行了）
        if (mwPhase === 'before_model' || mwPhase === 'after_model') {
          return 'reasoning';
        }
        // 其他阶段不匹配设计归属 → 隐藏
        return '_hidden';
      }

      // fallback：未在映射表中的中间件，按执行阶段映射
      if (mwPhase === 'before_agent') return 'context';
      if (mwPhase === 'after_agent') return 'post';
      if (mwPhase === 'before_model' || mwPhase === 'after_model' || mwPhase === 'wrap_tool_call') return 'reasoning';
      // 无 phase 标记的中间件，默认跟随当前阶段（不触发切换）
      return null;
    }
    return null;
  }

  let html = '';
  let seqNum = 0;
  let currentPhaseId = null;
  let currentPhaseIdx = -1; // 当前阶段在 PHASE_ORDER 中的索引
  let currentLoopNum = 0;
  let llmCallCount = 0;
  let totalLoopCount = 0; // 全局循环计数（不因阶段切换重置）

  const HIDDEN_SPAN_TYPES = new Set(['llm_input', 'intent_analysis', 'request', 'clarification']);

  // 预扫描：统计 Agent Loop 中有多少轮 LLM 调用
  const totalLlmCalls = liveSpans.filter(s => {
    const en = s.step_name_en || s.type || '';
    return en === 'llm_call' || (s.title && s.title.includes('思考'));
  }).length;
  const isMultiLoop = totalLlmCalls > 1;

  // 预扫描：收集每轮循环的描述
  let loopDescriptions = [];
  for (const s of liveSpans) {
    const en = s.step_name_en || s.type || '';
    if (en === 'llm_call' || (s.title && s.title.includes('思考'))) {
      const md = s.metadata || {};
      const toolCalls = md.tool_calls || (s.output_data && s.output_data.tool_calls) || [];
      let desc = '';
      if (md.is_final) {
        desc = 'LLM 整合结果生成最终回复';
      } else if (toolCalls.length > 0) {
        const firstTool = typeof toolCalls[0] === 'string' ? toolCalls[0] : (toolCalls[0].name || toolCalls[0].tool_name || '');
        desc = `LLM 决定调用 ${firstTool}`;
      } else {
        desc = 'LLM 推理';
      }
      loopDescriptions.push(desc);
    }
  }

  // 获取中间件 span 的原始执行阶段（before_agent / before_model / after_model / wrap_tool_call）
  function getMwRawPhase(s) {
    // 优先从 input_data / input 中取原始 phase（后端写入时保留了原始值）
    // metadata.phase 可能被映射后的值覆盖（历史 bug 兼容）
    const fromInput = (s.input_data && s.input_data.phase) || (s.input && s.input.phase) || '';
    const fromMeta = (s.metadata && s.metadata.phase) || '';
    // 映射后的值列表（这些不是原始 phase）
    const MAPPED = ['context', 'reasoning', 'output', 'post', 'entry'];
    // 优先用 input 中的值（一定是原始值）
    if (fromInput && !MAPPED.includes(fromInput)) return fromInput;
    // metadata.phase 如果不是映射后的值，也可以用
    if (fromMeta && !MAPPED.includes(fromMeta)) return fromMeta;
    // fallback: 返回 metadata.phase（即使是映射后的值，也比空好）
    return fromMeta || fromInput || '';
  }

  // 渲染一组中间件为折叠块
  function renderMwGroup(spans) {
    console.log('[Trace] renderMwGroup called, count:', spans.length, 'phase:', getMwRawPhase(spans[0]), 'names:', spans.map(s => (s.metadata||{}).middleware_name || s.step_name));
    const total = spans.length;
    const failed = spans.filter(s => s.status === 'error' || s.status === 'failed').length;
    const totalDur = spans.reduce((sum, s) => sum + (s.duration_ms || 0), 0);
    // 推断 phaseLabel：优先用原始 phase，否则根据中间件名称推断
    let phaseLabel = getMwRawPhase(spans[0]) || '';
    const MAPPED = ['context', 'reasoning', 'output', 'post', 'entry'];
    if (MAPPED.includes(phaseLabel)) {
      // 映射后的值，尝试从中间件名称推断
      const firstName = ((spans[0].metadata || {}).middleware_name) || spans[0].step_name || '';
      if (firstName.includes('Summarization') || firstName.includes('ContextWindow')) phaseLabel = 'before_model';
      else if (firstName.includes('SubagentLimit') || firstName.includes('LoopDetection') || firstName.includes('OutputValidation')) phaseLabel = 'after_model';
      else if (firstName.includes('Guardrail') || firstName.includes('ToolErrorHandling') || firstName.includes('Clarification')) phaseLabel = 'wrap_tool_call';
      else if (firstName.includes('OutputRender') || firstName.includes('StreamPII')) phaseLabel = 'after_agent';
      else phaseLabel = phaseLabel; // 保持映射后的值
    }
    const hasError = failed > 0;
    const statusIcon = hasError ? '⚠️' : '✓';
    const statusText = hasError
      ? `${total} 个 ${phaseLabel} 中间件，<span class="text-red-500 font-semibold">${failed} 个异常</span>`
      : `${total} 个 ${phaseLabel} 中间件，全部通过`;
    const durText = totalDur ? ` · ${Math.round(totalDur)}ms` : '';
    const groupErrorClass = hasError ? 'trace-mw-group-error' : '';

    const mwNodesHtml = spans.map(s => {
      seqNum++;
      return renderTraceNode(s, seqNum - 1, seqNum);
    }).join('');

    return `
      <details class="trace-mw-group my-1 ${groupErrorClass}" ${hasError ? 'open' : ''}>
        <summary class="cursor-pointer select-none py-[3px] px-1 text-[10.5px] leading-[1.6] ${hasError ? 'text-red-600' : 'text-gray-500'} hover:text-gray-700 transition-colors">
          <span class="inline-flex items-center gap-1">
            <span>${statusIcon}</span>
            <span>${hasError ? '❌' : '⚙️'} ${statusText}${durText}</span>
            <svg class="trace-mw-chevron w-3 h-3 ${hasError ? 'text-red-400' : 'text-gray-400'} transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </summary>
        <div class="pl-3 border-l-2 ${hasError ? 'border-red-200' : 'border-gray-200/60'} ml-3 mt-1 mb-1 space-y-0">
          ${mwNodesHtml}
        </div>
      </details>`;
  }

  // ═══ 渲染主循环（保持原始 span 顺序，中间件参与阶段切换但延迟渲染） ═══
  let mwBuffer = [];
  let mwBufferPhase = '';

  function flushMwBuffer() {
    if (mwBuffer.length > 0) {
      html += renderMwGroup(mwBuffer);
      mwBuffer = [];
      mwBufferPhase = '';
    }
  }

  for (const s of liveSpans) {
    const spanTypeKey = s.step_name_en || s.type || '';
    if (HIDDEN_SPAN_TYPES.has(spanTypeKey)) continue;

    // 确定该 span 应归属的阶段
    let targetPhase = getNaturalPhase(s);
    if (targetPhase === '_hidden') continue;

    const isMiddleware = spanTypeKey === 'middleware' || (s.metadata && s.metadata.is_middleware === true);

    // 核心规则：阶段只能前进，不能回退
    if (targetPhase === null) {
      targetPhase = currentPhaseId || 'context';
    }
    const targetIdx = PHASE_ORDER.indexOf(targetPhase);
    if (targetIdx < currentPhaseIdx) {
      targetPhase = currentPhaseId;
    }

    // ── 阶段切换：仅在前进时触发（中间件和非中间件都参与） ──
    if (targetPhase !== currentPhaseId) {
      // flush 中间件缓冲（属于上一个阶段）
      flushMwBuffer();
      // 关闭上一个循环容器
      if (currentPhaseId === 'reasoning' && currentLoopNum > 0 && isMultiLoop) {
        html += '</div>';
      }
      // 关闭上一个阶段容器
      if (currentPhaseId !== null) {
        html += '</div>';
      }
      currentPhaseId = targetPhase;
      currentPhaseIdx = PHASE_ORDER.indexOf(targetPhase);
      currentLoopNum = 0;
      llmCallCount = 0;

      const meta = PHASE_META[targetPhase] || { label: '其他', labelEn: '', icon: '📌' };

      // 纯文本阶段标题行
      html += `
        <div class="trace-phase mt-4 mb-1 first:mt-0">
          <div class="text-[12px] font-bold text-gray-700 py-1">
            <span>${meta.icon}</span>
            <span class="ml-1">${meta.label}</span>
            ${meta.labelEn ? `<span class="text-[10px] text-gray-400 font-normal ml-1">(${meta.labelEn})</span>` : ''}
          </div>
          <div class="pl-0">`;

      // 进入 reasoning 阶段时开始第 1 轮
      if (targetPhase === 'reasoning') {
        totalLoopCount++;
        currentLoopNum = totalLoopCount;
        const loopDesc = loopDescriptions[0] || '';
        if (isMultiLoop) {
          html += `
            <div class="trace-loop ml-0 pl-3 border-l-2 border-violet-200 mt-1 mb-1">
              <div class="text-[10px] text-violet-600 font-semibold mb-0.5">├─ 循环 ${currentLoopNum}<span class="text-gray-400 font-normal ml-2">（${esc(loopDesc)}）</span></div>`;
        }
      }
    }

    // ── 中间件：收集到缓冲区（不渲染，但已参与阶段切换） ──
    if (isMiddleware) {
      const rawPhase = getMwRawPhase(s);
      console.log('[Trace] MW buffered:', (s.metadata||{}).middleware_name || s.step_name, 'rawPhase:', rawPhase, 'targetPhase:', targetPhase);
      // 按原始阶段分组：阶段变化时 flush
      // 如果 rawPhase 都是映射后的值（如 "reasoning"），则不分组，靠非中间件 span 来断开
      if (mwBuffer.length > 0 && rawPhase !== mwBufferPhase && rawPhase && mwBufferPhase) {
        // 只有当两个 phase 都是原始值（非映射值）时才按 phase 分组
        const MAPPED = ['context', 'reasoning', 'output', 'post', 'entry'];
        if (!MAPPED.includes(rawPhase) && !MAPPED.includes(mwBufferPhase)) {
          flushMwBuffer();
        }
      }
      mwBuffer.push(s);
      mwBufferPhase = rawPhase;
      continue;
    }

    // ── 非中间件：先 flush 缓冲区，再处理当前 span ──
    flushMwBuffer();

    // ── Agent Loop 内部：LLM 调用触发新循环 ──
    if (currentPhaseId === 'reasoning') {
      const stepEn = s.step_name_en || s.type || '';
      const isLlmCall = stepEn === 'llm_call' || (s.title && s.title.includes('思考'));

      if (isLlmCall) {
        llmCallCount++;
        if (llmCallCount > 1) {
          // 关闭上一轮
          if (isMultiLoop && currentLoopNum > 0) {
            html += '</div>';
          }
          totalLoopCount++;
          currentLoopNum = totalLoopCount;
          const isFinal = s.metadata && s.metadata.is_final;
          const loopDesc = loopDescriptions[llmCallCount - 1] || '';
          const finalTag = isFinal ? ' [FINAL]' : '';
          if (isMultiLoop) {
            html += `
              <div class="trace-loop ml-0 pl-3 border-l-2 ${isFinal ? 'border-green-300' : 'border-violet-200'} mt-1 mb-1">
                <div class="text-[10px] ${isFinal ? 'text-green-600' : 'text-violet-600'} font-semibold mb-0.5">├─ 循环 ${currentLoopNum}${finalTag}<span class="text-gray-400 font-normal ml-2">（${esc(loopDesc)}）</span></div>`;
          }
        }
      }
    }

    seqNum++;
    html += renderTraceNode(s, seqNum - 1, seqNum);
  }

  // flush 末尾残留的中间件
  flushMwBuffer();

  // 关闭容器
  if (currentPhaseId === 'reasoning' && currentLoopNum > 0 && isMultiLoop) {
    html += '</div>';
  }
  if (currentPhaseId !== null) {
    html += '</div>';
  }

  el.innerHTML = html || '<div class="text-center text-gray-400 text-xs py-10">等待对话开始...</div>';
}

// ═══ 文档检测与预览 ═══

function detectDocument(content) {
  // 检测是否是报告/文档格式
  if (!content || content.length < 400) return null;

  // 排除短文本模板类（请假条、邮件、通知等 — 通常 < 1000 字且只有 1-2 个标题）
  const isTemplate = /请假条|通知书|邮件|备忘录|会议纪要/.test(content.slice(0, 100));
  if (isTemplate && content.length < 1200) return null;

  // 统计标题数量
  const mdHeadings = (content.match(/^#{1,3}\s+.+/gm) || []).length;
  const cnHeadings = (content.match(/^[一二三四五六七八九十]+[、.]\s*.+/gm) || []).length;
  const totalHeadings = mdHeadings + cnHeadings;

  // 判断条件：
  // - 长文本（>= 800字）+ 2个以上标题 → 文档
  // - 中等文本（400-800字）+ 3个以上标题 → 文档
  const isDoc = (content.length >= 800 && totalHeadings >= 2) ||
                (content.length >= 400 && totalHeadings >= 3);
  if (!isDoc) return null;

  // 提取标题
  let title = '分析报告';
  const h1Match = content.match(/^#\s+(.+)/m);
  if (h1Match) {
    title = h1Match[1].trim().replace(/^[《]|[》]$/g, '');
  } else {
    const firstLine = content.trim().split('\n')[0].replace(/^#+\s*/, '').trim();
    if (firstLine.length > 2 && firstLine.length < 50) title = firstLine.replace(/^[《]|[》]$/g, '');
  }
  return { title };
}

function openDocPreview(docId) {
  const doc = generatedDocs.find(d => d.id === docId);
  if (!doc) return;

  currentPreviewDoc = doc;

  // 切换到参考上下文 tab
  switchTab('docs');

  // 打开右侧面板（如果关闭了）
  if (!isRightPanelOpen) openRightPanel();

  // 显示文档预览模式
  document.getElementById('docListMode').classList.add('hidden');
  document.getElementById('docPreviewMode').classList.remove('hidden');
  document.getElementById('docPreviewTitle').textContent = doc.title + '.md';

  // 渲染 markdown 全文
  const rendered = typeof marked !== 'undefined' ? marked.parse(doc.content) : esc(doc.content);
  document.getElementById('docPreviewContent').innerHTML = rendered;
}

function closeDocPreview() {
  currentPreviewDoc = null;
  document.getElementById('docPreviewMode').classList.add('hidden');
  document.getElementById('docListMode').classList.remove('hidden');
}

function downloadCurrentDoc() {
  if (!currentPreviewDoc) return;
  const blob = new Blob([currentPreviewDoc.content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (currentPreviewDoc.title || '报告') + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  genEl.innerHTML = generatedDocs.map(doc => `

let stepsContainer = null; // 当前消息的步骤容器
let stepsWrapper = null; // 步骤容器的外层包装（含标题和折叠）

function createStepsContainer() {
  const inner = document.getElementById('chatInner');
  const wrapper = document.createElement('div');
  wrapper.className = 'ml-12 mb-2 animate-fade-in';
  const wrapperId = 'live-trace-' + Date.now();
  wrapper.innerHTML = `
    <div class="border border-gray-100 rounded-xl bg-gray-50/50 overflow-hidden">
      <div class="flex items-center gap-2 px-3 py-2 cursor-pointer select-none hover:bg-gray-100/60 transition-colors"
           onclick="toggleInlineTrace('${wrapperId}')">
        <svg id="${wrapperId}-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             class="text-gray-400 transition-transform duration-200" style="transform: rotate(90deg);">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="text-xs font-medium text-gray-500">⚡ 推理链路</span>
        <span id="${wrapperId}-status" class="text-[10px] text-blue-400">执行中...</span>
      </div>
      <div id="${wrapperId}" class="px-3 pb-2">
        <div class="steps-list space-y-1"></div>
      </div>
    </div>`;
  inner.appendChild(wrapper);
  stepsWrapper = wrapper;
  stepsWrapper._traceId = wrapperId;
  stepsContainer = wrapper.querySelector('.steps-list');
  mwGroupEl = null;
  mwGroupCount = 0;
  scrollToBottom();
  return stepsContainer;
}

// 执行完成后自动折叠推理链路
function collapseStepsContainer() {
  if (stepsWrapper && stepsWrapper._traceId) {
    const id = stepsWrapper._traceId;
    const content = document.getElementById(id);
    const arrow = document.getElementById(id + '-arrow');
    const status = document.getElementById(id + '-status');
    if (content) content.classList.add('hidden');
    if (arrow) arrow.style.transform = 'rotate(0deg)';
    if (status) {
      // 计算步骤数
      const stepCount = stepsContainer ? stepsContainer.children.length : 0;
      status.textContent = `${stepCount} 步`;
      status.className = 'text-[10px] text-gray-400';
    }
  }
}

function addStep(label, status, opts) {
  if (!stepsContainer) createStepsContainer();
  const isChild = opts && opts.indent;
  const dotClass = status === 'done' ? 'bg-green-500' :
                   status === 'run' ? 'bg-blue-500 animate-pulse' :
                   status === 'err' ? 'bg-red-500' : 'bg-gray-300';
  const id = 'step-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
  const indent = isChild ? 'pl-4' : '';
  const dotSize = isChild ? 'w-1 h-1' : 'w-1.5 h-1.5';
  const textColor = isChild ? 'text-gray-400' : 'text-gray-500';
  stepsContainer.insertAdjacentHTML('beforeend', `
    <div id="${id}" class="flex items-center gap-2 py-0.5 text-xs ${textColor} ${indent}">
      <div class="${dotSize} rounded-full ${dotClass} shrink-0"></div>
      <span>${esc(label)}</span>
      <span class="step-dur text-[10px] text-gray-300 ml-auto"></span>
    </div>`);
  scrollToBottom();
  return id;
}

function updateStep(id, status, durMs) {
  const el = document.getElementById(id);
  if (!el) return;
  const dot = el.querySelector('div');
  dot.className = 'w-1.5 h-1.5 rounded-full shrink-0 ' +
    (status === 'done' ? 'bg-green-500' : status === 'err' ? 'bg-red-500' : 'bg-blue-500 animate-pulse');
  if (durMs != null) {
    const durEl = el.querySelector('.step-dur');
    if (durEl) durEl.textContent = durMs + 'ms';
  }
}

function addMwStep(label, status) {
  if (!stepsContainer) createStepsContainer();
  // 如果还没有折叠组，创建一个
  if (!mwGroupEl || !stepsContainer.contains(mwGroupEl)) {
    mwGroupCount = 0;
    const groupId = 'mw-group-' + Date.now();
    stepsContainer.insertAdjacentHTML('beforeend', `
      <div id="${groupId}" class="mw-collapse-group">
        <div class="mw-collapse-header flex items-center gap-2 py-0.5 text-xs text-gray-400 cursor-pointer select-none hover:text-gray-600" onclick="toggleMwGroup(this)">
          <svg class="mw-arrow w-3 h-3 transition-transform -rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          <span class="mw-collapse-title">中间件处理</span>
          <span class="mw-collapse-count text-[10px] text-gray-300 ml-1"></span>
        </div>
        <div class="mw-collapse-body hidden pl-4 space-y-0.5"></div>
      </div>`);
    mwGroupEl = document.getElementById(groupId);
  }
  mwGroupCount++;
  const body = mwGroupEl.querySelector('.mw-collapse-body');
  const countEl = mwGroupEl.querySelector('.mw-collapse-count');
  countEl.textContent = `(${mwGroupCount})`;

  const dotClass = status === 'done' ? 'bg-green-500' : status === 'err' ? 'bg-red-500' : 'bg-gray-300';
  body.insertAdjacentHTML('beforeend', `
    <div class="flex items-center gap-2 py-0.5 text-xs text-gray-400">
      <div class="w-1 h-1 rounded-full ${dotClass} shrink-0"></div>
      <span>${esc(label)}</span>
    </div>`);
  scrollToBottom();
}

function toggleMwGroup(headerEl) {
  const body = headerEl.nextElementSibling;
  const arrow = headerEl.querySelector('.mw-arrow');
  if (body.classList.contains('hidden')) {
    body.classList.remove('hidden');
    arrow.classList.remove('-rotate-90');
  } else {
    body.classList.add('hidden');
    arrow.classList.add('-rotate-90');
  }
}
