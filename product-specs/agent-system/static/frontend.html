// ═══ AG-UI 模式发送 ═══
async function sendAgui(text, extra) {
  if (!text && !extra) return;

  // 显示用户消息
  if (text) {
    addUserBubble(text);
    hist.push({ role: 'user', content: text });
    saveHistToStorage();
    if (hist.filter(h => h.role === 'user').length === 1) {
      const title = text.length > 20 ? text.slice(0, 20) + '...' : text;
      document.getElementById('headerTitle').textContent = title;
    }
  }

  // 重置 trace
  liveSpans = [];
  stepsContainer = null;
  stepsWrapper = null;
  updatePanelStatus(true);
  createStepsContainer();
  addStep('AG-UI 处理中...', 'run');

  const body = {
    message: text || '',
    threadId: tid,
    history: hist.slice(0, -1).slice(-10),
    runId: genId(),
  };
  if (extra && extra.resume) {
    body.resume = extra.resume;
  }

  try {
    const r = await fetch(API + '/api/chat/agui', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('AG-UI API error: ' + r.status);

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let aiContent = '';
    let textMsgActive = false;
    let textMsgFinalized = false; // 标记第一轮 TEXT_MESSAGE 已完成（防止 skill_result + LLM 双重输出）
    let seenToolCalls = new Set(); // 去重 TOOL_CALL_START
    window._skillStepAdded = false; // 技能执行步骤只添加一次
    window._subLoopCount = 0;

    // AG-UI SSE 格式: "event: TYPE\ndata: {...}\n\n"
    let currentEventType = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEventType = line.slice(7).trim();
          continue;
        }
        if (!line.startsWith('data: ')) continue;
        const dataStr = line.slice(6);
        if (!dataStr || dataStr === '[DONE]') continue;

        try {
          const data = JSON.parse(dataStr);
          const type = currentEventType || data.type || '';
          currentEventType = ''; // reset after use

          // RUN_STARTED
          if (type === 'RUN_STARTED') {
            // 运行开始
          }
          // TEXT_MESSAGE_START
          else if (type === 'TEXT_MESSAGE_START') {
            textMsgActive = true;
            // 如果已经输出过内容，忽略后续的 TEXT_MESSAGE 流（防止重复气泡）
            if (textMsgFinalized || aiContent.length > 0) continue;
            if (!_aguiStreamEl) {
              addAiBubbleStart();
            }
          }
          // TEXT_MESSAGE_CONTENT
          else if (type === 'TEXT_MESSAGE_CONTENT') {
            if (textMsgFinalized || (aiContent.length > 0 && !textMsgActive)) continue;
            const delta = data.delta || (data.data && data.data.delta) || '';
            if (delta) {
              aiContent += delta;
              updateAiBubble(aiContent);
            }
          }
          // TEXT_MESSAGE_END
          else if (type === 'TEXT_MESSAGE_END') {
            textMsgActive = false;
            if (!textMsgFinalized) {
              finalizeAiBubble(aiContent);
              textMsgFinalized = true;
            }
          }
          // TOOL_CALL_START
          else if (type === 'TOOL_CALL_START') {
            const toolCallId = data.tool_call_id || '';
            const toolName = data.name || data.tool_call_name || '';
            // 去重
            const dedupeKey = toolName + ':' + (toolCallId || String(Date.now()));
            if (!seenToolCalls.has(dedupeKey)) {
              seenToolCalls.add(dedupeKey);
              // skills_tool 开始时显示"生成中"占位 + 左侧步骤标记（只执行一次）
              if (toolName === 'skills_tool' && !window._skillStepAdded) {
                window._skillStepAdded = true;
                if (!_aguiStreamEl) {
                  addAiBubbleStart();
                  updateAiBubble('<div class="flex items-center gap-2 text-gray-400 text-sm"><div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>正在分析生成中...</div>');
                }
                window._subLoopCount = 0;
                addStep('⚡ 技能执行 (fork) 中...', 'run');
              }
            }
          }
          // TOOL_CALL_ARGS
          else if (type === 'TOOL_CALL_ARGS') {
            // 工具参数流式传入（可选展示）
          }
          // TOOL_CALL_END
          else if (type === 'TOOL_CALL_END') {
            // 工具调用结束
          }
          // TOOL_CALL_RESULT
          else if (type === 'TOOL_CALL_RESULT') {
            // 右侧面板由 mw_span 统一渲染（含完整输入/输出/耗时），这里不重复
          }
          // STEP_STARTED
          else if (type === 'STEP_STARTED') {
            // 技能执行由 mw_span(skill_execution) 统一渲染
          }
          // STEP_FINISHED
          else if (type === 'STEP_FINISHED') {
            // 由 mw_span 统一渲染
          }
          // CUSTOM
          else if (type === 'CUSTOM') {
            const name = data.name || '';
            const value = data.value || data;

            if (name === 'interrupt') {
              // 渲染 interrupt 选择卡片
              const chatInner = document.getElementById('chatInner');
              chatInner.insertAdjacentHTML('beforeend', renderInterruptCard(value));
              scrollToBottom();
              addStep('⏸️ 等待用户确认', 'run');
            }
            else if (name === 'run_interrupted') {
              addStep('⏸️ 已暂停，等待选择', 'done');
            }
            else if (name === 'mw_span') {
              // 中间件 span（与 SSE 模式一致的推理链路）
              const sp = value || {};
              const spanType = sp.type || 'unknown';
              const spanName = sp.name || sp.step_name || spanType;
              const stepName = sp.step_name || spanName;
              const meta = sp.metadata || {};
              let children = [];
              if (sp.children && sp.children.length) {
                children = sp.children.map(ch => ({
                  label: ch.name || ch.type || '', status: 'complete', duration_ms: ch.duration_ms || 0,
                  type: ch.type || '', name: ch.name || '', detail: ch.detail || '',
                  input_data: ch.input_data || {}, output_data: ch.output_data || {},
                  metadata: ch.metadata || {},
                }));
              }
              addLiveSpan({
                status: sp.status || 'complete', type: spanType, icon: getSpanIcon(spanType),
                title: spanName, step_name: stepName, step_name_en: sp.step_name_en || spanType,
                phase: sp.phase || '', detail: sp.detail || '',
                desc: sp.detail || '', time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
                duration_ms: sp.duration_ms || 0, children: children,
                sub_agent_spans: (spanType === 'skill_execution' && children.length > 0) ? children : [],
                input_data: sp.input_data || {}, output_data: sp.output_data || {}, metadata: meta,
              });
              // 关键步骤也显示在左侧
              if (['content_review', 'query_rewrite', 'context_build', 'memory_retrieval', 'memory_extract'].includes(spanType)) {
                addStep(`${stepName}`, 'done');
              } else if (spanType === 'skill_execution') {
                // 技能执行完成 — 更新左侧步骤状态（从"执行中"变为"完成"）
                const skillMeta = meta || {};
                const sName = skillMeta.skill_name || '';
                const sMode = skillMeta.context_mode || 'inline';
                const sDur = sp.duration_ms ? ` ${Math.round(sp.duration_ms / 1000)}s` : '';
                addStep(`✓ 技能: ${sName} (${sMode})${sDur}`, 'done');
              }
            }
            else if (name === 'sub_agent_span') {
              // 子 Agent 实时 span — 累积到最后一个 skill_execution 节点的 sub_agent_spans
              const sp = value || {};
              // 找到最后一个 skill_execution 类型的 liveSpan
              for (let i = liveSpans.length - 1; i >= 0; i--) {
                if ((liveSpans[i].step_name_en || liveSpans[i].type) === 'skill_execution') {
                  if (!liveSpans[i].sub_agent_spans) liveSpans[i].sub_agent_spans = [];
                  liveSpans[i].sub_agent_spans.push({
                    type: sp.type || '', name: sp.name || '', detail: sp.detail || '',
                    duration_ms: sp.duration_ms || 0,
                    input_data: sp.input_data || {}, output_data: sp.output_data || {},
                    metadata: sp.metadata || {},
                  });
                  refreshTrace();
                  break;
                }
              }
              // 左侧步骤：参照右侧链路逻辑，按循环显示
              const subType = sp.type || '';
              const subMeta = sp.metadata || {};
              const subMwName = subMeta.middleware_name || sp.name || '';
              const subMwPhase = subMeta.phase || '';
              if (subType === 'middleware' && (subMwName.includes('ContextWindow') || subMwName.includes('Summarization')) && subMwPhase === 'before_model') {
                // before_model 标志新循环 — 更新步骤为"循环 N"
                if (!window._subLoopCount) window._subLoopCount = 0;
                window._subLoopCount++;
              } else if (subType === 'tool_call') {
                const toolName = (sp.name || '').replace('tool:', '');
                const loopNum = window._subLoopCount || 1;
                const dur = sp.duration_ms ? ` ${Math.round(sp.duration_ms)}ms` : '';
                addStep(`  循环${loopNum}: ${toolName}${dur}`, 'done', {indent: true});
              }
            }
            else if (name === 'llm_start') {
              // 不再使用（由 mw_span 统一渲染）
            }
            else if (name === 'llm_end') {
              // 不再使用（由 mw_span 统一渲染）
            }
            else if (name === 'step_metadata') {
              // 由 mw_span(skill_execution / tool_call) 统一渲染
            }
          }
          // REASONING_START / REASONING_CONTENT
          else if (type === 'REASONING_START' || type === 'REASONING_STARTED') {
            addStep('🧠 推理中...', 'run');
          }
          else if (type === 'REASONING_CONTENT') {
            // 推理内容（可选展示在右侧面板）
            const delta = data.delta || '';
            if (delta) {
              addLiveSpan({
                status: 'complete', type: 'llm_call', icon: '🧠',
                title: '推理', step_name: '模型推理', step_name_en: 'reasoning',
                phase: 'reasoning', detail: truncStr(delta, 80),
                desc: truncStr(delta, 40), time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
                children: [], input_data: {}, output_data: { reasoning: delta.slice(0, 300) }, metadata: {},
              });
            }
          }
          // RUN_FINISHED
          else if (type === 'RUN_FINISHED') {
            collapseStepsContainer();
          }
          // RUN_ERROR
          else if (type === 'RUN_ERROR') {
            const errMsg = data.message || '执行出错';
            addStep(`❌ ${truncStr(errMsg, 40)}`, 'err');
            addLiveSpan({
              status: 'error', type: 'error', icon: '❌',
              title: '错误', step_name: '执行错误', step_name_en: 'error',
              phase: 'execution', detail: errMsg,
              desc: truncStr(errMsg, 60), time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
              children: [], input_data: {}, output_data: { error: errMsg }, metadata: {},
            });
            if (!aiContent) {
              addAiBubbleStart();
              aiContent = '⚠️ ' + errMsg;
              finalizeAiBubble(aiContent);
            }
          }
          // MESSAGES_SNAPSHOT (忽略)
          else if (type === 'MESSAGES_SNAPSHOT') {
            // 历史消息快照，AG-UI 断线重连用
          }
        } catch(e) { /* skip parse errors */ }
      }
    }

    // 如果有内容但没有正式结束
    if (aiContent && textMsgActive) {
      finalizeAiBubble(aiContent);
    }
    if (aiContent) {
      hist.push({ role: 'assistant', content: aiContent });
      saveHistToStorage();
    }

  } catch(e) {
    console.error('[AG-UI] error:', e);
    addSystemBubble('请求失败: ' + e.message);
  }

  updatePanelStatus(false);
  saveTraceToStorage(); // 对话完成后持久化链路到 localStorage
}

async function send(overrideText) {
  const inp = document.getElementById('inp');
  const text = overrideText || inp.value.trim();
  if (!text && !overrideText) return;
  if (!overrideText) { inp.value = ''; inp.style.height = '28px'; }

  // 上传文件
  if (pf.length) await uploadAll();

  // AG-UI 模式路由
  if (apiMode === 'agui') {
    return sendAgui(text);
  }

  // 显示用户消息
  addUserBubble(text);
  hist.push({ role: 'user', content: text });
  saveHistToStorage();

  // 更新标题
  if (hist.filter(h => h.role === 'user').length === 1) {
    const title = text.length > 20 ? text.slice(0, 20) + '...' : text;
    document.getElementById('headerTitle').textContent = title;
    const c = chatHistory.find(c => c.id === tid);
    if (c) c.title = title;
    renderChatList();
  }

  // 重置 trace & steps
  liveSpans = [];
  stepsContainer = null;
  stepsWrapper = null;
  updatePanelStatus(true);

  // 显示轻量处理中指示器（不占编号位，收到第一个 mw_span 后自动移除）
  document.getElementById('traceContent').innerHTML = `
    <div id="trace-loading-indicator" class="flex items-center gap-3 px-4 py-3 bg-blue-50/60 border border-blue-100 rounded-xl animate-fade-in">
      <div class="w-5 h-5 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
      <div>
        <div class="text-[11px] font-semibold text-blue-700">正在处理请求...</div>
        <div class="text-[9px] text-blue-400 mt-0.5">内容审查 → 查询改写 → 上下文准备</div>
      </div>
    </div>`;

  // 创建步骤容器
  createStepsContainer();
  const parseStepId = addStep('处理中...', 'run');

  // 跟踪当前 LLM/Tool 状态
  let currentLlmStepId = null;
  let currentToolStepId = null;
  let iterCount = 0;
  let streamingDoc = false; // 是否正在流式输出文档
  let serverDocMeta = null; // 后端返回的文档元信息
  let docTokenCount = 0;    // token 计数（用于节流渲染）

  // 调用 API
  try {
    const historyToSend = hist.slice(0, -1).slice(-10);
    console.log('[send] tid=%s, hist.length=%d, historyToSend.length=%d', tid, hist.length, historyToSend.length);
    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, thread_id: tid, user_id: userId, history: historyToSend })
    });

    if (!r.ok) throw new Error('API error: ' + r.status);

    // SSE 流式处理
    if (r.headers.get('content-type')?.includes('text/event-stream')) {
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let aiContent = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const evt = JSON.parse(data);

            // ── 中间件 Span（记忆检索、意图分析、上下文构建等）──
            if (evt.type === 'mw_span') {
              const sp = evt.span || {};
              const spanType = sp.type || 'unknown';
              const spanName = sp.name || getSpanLabel(spanType);
              const meta = sp.metadata || {};

              // 首次收到 mw_span 时：移除 loading 指示器，更新左侧步骤
              const loadingEl = document.getElementById('trace-loading-indicator');
              if (loadingEl) {
                loadingEl.remove();
                updateStep(parseStepId, 'done');
              }

              // 构建子节点
              let children = [];
              if (sp.children && sp.children.length) {
                children = sp.children.map(ch => ({
                  label: ch.name || ch.type || '',
                  status: 'complete',
                  duration_ms: ch.duration_ms || 0,
                  type: ch.type || '', name: ch.name || '', detail: ch.detail || '',
                  input_data: ch.input_data || {}, output_data: ch.output_data || {},
                  metadata: ch.metadata || {},
                }));
              }
              if (meta.hit_count != null) {
                children.push({ label: `命中 ${meta.hit_count} 条结果`, status: 'complete' });
              }
              if (meta.task_type) {
                children.push({ label: `任务类型: ${meta.task_type}`, status: 'complete' });
              }

              // 添加到右侧面板（使用新的 PipelineNode 格式）
              addLiveSpan({
                status: sp.status || 'complete',
                type: spanType,
                icon: getSpanIcon(spanType),
                title: spanName,
                step_name: sp.step_name || getSpanLabel(spanType),
                step_name_en: sp.step_name_en || spanType,
                phase: sp.phase || '',
                detail: sp.detail || (meta.query_used ? `查询: "${truncStr(meta.query_used, 50)}"` : (sp.description || '')),
                input_data: sp.input_data || {},
                output_data: sp.output_data || {},
                duration_ms: sp.duration_ms || 0,
                desc: sp.detail || (meta.query_used ? `查询: "${truncStr(meta.query_used, 30)}"` : (sp.description || '')),
                time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
                children: children,
                // skill_execution 的 children 同时映射为 sub_agent_spans（前端渲染子 Agent 循环用）
                sub_agent_spans: (spanType === 'skill_execution' && children.length > 0) ? children : [],
                input: sp.input_data || meta.input || '',
                output: sp.output_data || meta.output || '',
                metadata: meta,
              });

              // 添加到对话区步骤（只显示关键节点，中间件按阶段过滤）
              if (spanType === 'middleware' || meta.is_middleware) {
                const mwName = meta.middleware_name || sp.step_name || spanName;
                const mwPhase = meta.phase || (sp.input_data && sp.input_data.phase) || '';
                // 只有 before_agent 阶段的中间件才在对话区显示（折叠）
                // before_model / after_model / wrap_tool_call 阶段的中间件只在推理链路中显示
                if (mwPhase === 'before_agent' || mwPhase === '') {
                  const cnName = getMwCnName(mwName);
                  const mwLabel = cnName !== mwName ? `${cnName} ${mwName}` : mwName;
                  addMwStep(mwLabel + (sp.duration_ms ? ` ${Math.round(sp.duration_ms)}ms` : ''), 'done');
                }
                // 其他阶段的中间件不在对话区显示
              } else {
                const stepLabel = (sp.step_name || spanName) + (meta.hit_count != null ? ` (${meta.hit_count} 条)` : '') + (sp.duration_ms ? ` ${Math.round(sp.duration_ms)}ms` : '');
                addStep(stepLabel, 'done');
              }
            }

            // ── LLM 开始 ──
            else if (evt.type === 'llm_start') {
              // before_model 中间件由后端通过 mw_span 事件推送，无需前端手动插入

              iterCount = evt.iteration || iterCount + 1;
              const title = `第 ${iterCount} 轮思考`;
              addLiveSpan({
                status: 'active',
                icon: getSpanIcon('llm_call'),
                title: title,
                step_name: `模型推理 (第${iterCount}轮)`,
                step_name_en: 'llm_call',
                phase: 'reasoning',
                detail: '模型推理中...',
                desc: '模型推理中...',
                time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
                children: [],
                input_data: evt.input ? { messages_preview: evt.input } : {},
                output_data: {},
                input: evt.input || '',
                output: '',
              });
              currentLlmStepId = addStep(title + '...', 'run');
            }

            // ── LLM 结束 ──
            else if (evt.type === 'llm_end') {
              // 更新最后一个 active llm span
              for (let i = liveSpans.length - 1; i >= 0; i--) {
                if (liveSpans[i].status === 'active' && liveSpans[i].title.includes('思考')) {
                  liveSpans[i].status = 'complete';
                  liveSpans[i].desc = `完成 (${evt.duration_ms || 0}ms)`;
                  liveSpans[i].detail = `模型推理完成: ${evt.duration_ms || 0}ms`;
                  liveSpans[i].duration_ms = evt.duration_ms || 0;
                  if (evt.output) {
                    liveSpans[i].output = evt.output;
                  }
                  if (evt.tokens) {
                    const tok = evt.tokens;
                    liveSpans[i].children.push({ label: `输出 ${tok.output_tokens || '?'} tokens`, status: 'complete' });
                    liveSpans[i].output_data = {
                      tokens: tok,
                      tool_calls: evt.tool_calls || [],
                      is_final: evt.is_final,
                      duration_ms: evt.duration_ms,
                    };
                    liveSpans[i].metadata = Object.assign({}, liveSpans[i].metadata || {}, {
                      tokens: tok,
                      tool_calls: evt.tool_calls || [],
                      is_final: evt.is_final,
                      duration_ms: evt.duration_ms,
                    });
                  }
                  break;
                }
              }
              refreshTrace();
              if (currentLlmStepId) {
                updateStep(currentLlmStepId, 'done', evt.duration_ms);
                currentLlmStepId = null;
              }

              // after_model 中间件由后端通过 mw_span 事件推送，无需前端手动插入
            }

            // ── 工具调用开始 ──
            else if (evt.type === 'tool_start') {
              const toolName = evt.tool_name || 'unknown';
              // 对 skills_tool / agent_tool 等路由型工具，补充真实调用目标
              let displayName = evt.display_name;
              if (!displayName) {
                let subName = evt.sub_name;
                if (!subName && evt.input) {
                  try {
                    const parsed = JSON.parse(evt.input);
                    subName = parsed.skill_name || parsed.agent_name || '';
                  } catch (e) {}
                }
                displayName = subName ? `${toolName}(${subName})` : toolName;
              }
              // 构建带 inline/fork 标识的显示名
              const ctxMode = evt.skill_context_mode || '';
              const displayWithMode = ctxMode ? `${displayName} [${ctxMode}]` : displayName;
              addLiveSpan({
                status: 'active',
                icon: getSpanIcon('tool_call'),
                title: `工具: ${displayWithMode}`,
                step_name: `工具调用: ${displayWithMode}`,
                step_name_en: 'tool_call',
                phase: 'execution',
                detail: evt.input ? `参数: ${truncStr(evt.input, 80)}` : '执行中...',
                desc: evt.input ? truncStr(evt.input, 50) : '执行中...',
                time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
                children: [],
                input_data: { tool_name: toolName, arguments: evt.input_full || evt.input || '' },
                output_data: {},
                input: evt.input_full || evt.input || '',
                output: '',
                metadata: { tool_name: toolName, display_name: displayName, skill_context_mode: ctxMode },
              });
              currentToolStepId = addStep(`调用 ${displayWithMode}...`, 'run', {indent: true});
            }

            // ── 工具调用结束 ──
            else if (evt.type === 'tool_end') {
              const toolName = evt.tool_name || 'unknown';
              const isToolError = evt.error === true || evt.status === 'error' || evt.status === 'failed';
              for (let i = liveSpans.length - 1; i >= 0; i--) {
                if (liveSpans[i].status === 'active' && liveSpans[i].title.includes(toolName)) {
                  liveSpans[i].status = isToolError ? 'error' : 'complete';
                  liveSpans[i].desc = isToolError
                    ? `异常 (${evt.duration_ms || 0}ms)`
                    : `完成 (${evt.duration_ms || 0}ms)`;
                  liveSpans[i].detail = isToolError
                    ? `工具 ${toolName} 执行异常: ${evt.error_message || evt.output || '未知错误'}`
                    : `工具 ${toolName} 执行完成: ${evt.duration_ms || 0}ms`;
                  liveSpans[i].duration_ms = evt.duration_ms || 0;
                  if (evt.output) {
                    liveSpans[i].output = evt.output_full || evt.output;
                    liveSpans[i].children.push({ label: truncStr(evt.output, 60), status: isToolError ? 'error' : 'complete' });
                  }
                  liveSpans[i].output_data = {
                    result: evt.output_full || evt.output || '',
                    duration_ms: evt.duration_ms,
                    ...(isToolError ? { error: evt.error_message || evt.output || '工具执行失败' } : {}),
                  };
                  liveSpans[i].metadata = Object.assign({}, liveSpans[i].metadata || {}, {
                    duration_ms: evt.duration_ms,
                    ...(isToolError ? {
                      error_message: evt.error_message || evt.output || '工具执行失败',
                      error_type: evt.error_type || '',
                    } : {}),
                  });
                  break;
                }
              }
              refreshTrace();
              if (currentToolStepId) {
                updateStep(currentToolStepId, isToolError ? 'err' : 'done', evt.duration_ms);
                currentToolStepId = null;
              }
            }

            // ── 流式文本 ──
            else if (evt.type === 'token' || evt.type === 'content') {
              const chunk = evt.data || evt.content || '';
              aiContent += chunk;

              // 如果已收到 doc_start 信号，流式渲染到右侧面板
              if (streamingDoc) {
                // 节流：每 3 个 token 渲染一次，避免频繁 DOM 操作
                docTokenCount++;
                if (docTokenCount % 3 === 0 || chunk.includes('\n')) {
                  const rendered = typeof marked !== 'undefined' ? marked.parse(aiContent) : esc(aiContent);
                  const previewEl = document.getElementById('docPreviewContent');
                  previewEl.innerHTML = rendered;
                  previewEl.scrollTop = previewEl.scrollHeight;
                }
              }
            }

            // ── 文档开始信号（后端提前判断） ──
            else if (evt.type === 'doc_start') {
              streamingDoc = true;
              docTokenCount = 0;
              serverDocMeta = evt.document || {};
              // 立即打开右侧面板并切换到文档预览模式
              if (!isRightPanelOpen) openRightPanel();
              switchTab('docs');
              document.getElementById('docListMode').classList.add('hidden');
              document.getElementById('docPreviewMode').classList.remove('hidden');
              document.getElementById('docPreviewTitle').textContent = (serverDocMeta.title || '生成中...') + '.md';
              document.getElementById('docPreviewContent').innerHTML = '<div class="flex items-center gap-2 text-gray-400 text-xs py-4"><div class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></div>正在生成文档...</div>';
              addStep('开始生成文档: ' + (serverDocMeta.title || ''), 'run');
            }

            // ── 完成 ──
            else if (evt.type === 'done') {
              // 自动折叠推理链路
              collapseStepsContainer();
              // 处理后端文档检测结果（兜底：即使没有 doc_start，done 中也可能有 document）
              if (evt.document && !serverDocMeta) {
                serverDocMeta = evt.document;
                // 兜底触发：打开面板显示完整文档
                if (!streamingDoc && aiContent.length > 800) {
                  streamingDoc = true;
                  if (!isRightPanelOpen) openRightPanel();
                  switchTab('docs');
                  document.getElementById('docListMode').classList.add('hidden');
                  document.getElementById('docPreviewMode').classList.remove('hidden');
                  document.getElementById('docPreviewTitle').textContent = (serverDocMeta.title || '分析报告') + '.md';
                  const rendered = typeof marked !== 'undefined' ? marked.parse(aiContent) : esc(aiContent);
                  document.getElementById('docPreviewContent').innerHTML = rendered;
                }
              }
            }

            // ── 中断确认（interrupt）──
            else if (evt.type === 'interrupt') {
              const interrupts = evt.interrupts || [];
              for (const iv of interrupts) {
                const chatInner = document.getElementById('chatInner');
                chatInner.insertAdjacentHTML('beforeend', renderInterruptCard(iv));
                scrollToBottom();
              }
            }

            // ── 错误 ──
            else if (evt.type === 'error') {
              addLiveSpan({
                status: 'error',
                icon: getSpanIcon('error'),
                title: '错误',
                step_name: '执行错误',
                step_name_en: 'error',
                phase: 'execution',
                detail: evt.content || '未知错误',
                desc: evt.content || '未知错误',
                time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
                children: [],
                input_data: {},
                output_data: { error: evt.content || '未知错误' },
                metadata: {
                  error_message: evt.content || '未知错误',
                  error_type: evt.error_type || evt.code || '',
                  error_stack: evt.traceback || evt.stack || '',
                },
              });
              addStep('错误: ' + truncStr(evt.content || '', 40), 'err');
            }

          } catch(e) {}
        }
      }

      if (aiContent) {
        // 判断是否为文档模式（doc_start 信号 或 done 事件中的 document 字段）
        const isDoc = streamingDoc || (serverDocMeta != null);
        if (isDoc) {
          // 文档模式：用实际内容提取更准确的标题（覆盖预测标题）
          const actualDoc = detectDocument(aiContent);
          const docTitle = actualDoc ? actualDoc.title : (serverDocMeta ? serverDocMeta.title : '分析报告');

          // 存储文档
          const docId = 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
          generatedDocs.push({ id: docId, title: docTitle, content: aiContent, time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,5) });
          refreshGeneratedFiles();
          currentPreviewDoc = generatedDocs[generatedDocs.length - 1];

          // 对话区显示缩略 + 卡片
          addAIBubbleRaw(aiContent, docTitle, docId);

          // 更新右侧面板标题和最终渲染
          document.getElementById('docPreviewTitle').textContent = docTitle + '.md';
          const finalRendered = typeof marked !== 'undefined' ? marked.parse(aiContent) : esc(aiContent);
          document.getElementById('docPreviewContent').innerHTML = finalRendered;

          addStep('文档生成完成 ✓', 'done');
        } else {
          // 非文档模式：addAIBubble 内部会自行检测是否为文档
          addAIBubble(aiContent);
        }
        hist.push({ role: 'assistant', content: aiContent });
        saveHistToStorage();
      }
    } else {
      // JSON 响应（同步模式）
      const data = await r.json();
      const reply = data.response || data.content || data.message || JSON.stringify(data);
      addAIBubble(reply);
      hist.push({ role: 'assistant', content: reply });
      saveHistToStorage();

      // 处理 trace spans
      if (data.trace && data.trace.spans) {
        liveSpans = data.trace.spans.map((s, idx) => ({
          status: 'complete',
          title: s.name || getSpanLabel(s.type),
          step_name: s.step_name || getSpanLabel(s.type),
          step_name_en: s.step_name_en || s.type || '',
          phase: s.phase || '',
          detail: s.detail || s.description || '',
          desc: s.detail || s.description || '',
          duration_ms: s.duration_ms || 0,
          time: '',
          icon: getSpanIcon(s.type),
          children: [],
          input_data: s.input_data || {},
          output_data: s.output_data || {},
          input: '',
          output: '',
          metadata: s.metadata || {},
        }));
        refreshTrace();
      }
    }

    // 完成所有 trace
    liveSpans.forEach(s => { if (s.status === 'active') s.status = 'complete'; });
    // 添加 StreamPIIRestorer 节点（非中间件，后端不会推送，前端补充）
    const hasStreamPII = liveSpans.some(s => (s.step_name_en === 'stream_pii_restore') || ((s.metadata || {}).middleware_name || '').includes('StreamPIIRestor'));
    if (!hasStreamPII) {
      addLiveSpan({
        status: 'complete',
        icon: getSpanIcon('done'),
        title: 'StreamPIIRestorer',
        step_name: 'StreamPIIRestorer',
        step_name_en: 'stream_pii_restore',
        phase: 'output',
        detail: '流式 PII 占位符还原为原始值（逐 token，before SSE push）',
        desc: '流式 PII 占位符还原为原始值（逐 token，before SSE push）',
        time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
        children: [],
        input_data: {},
        output_data: {},
        metadata: { is_middleware: true, middleware_name: 'StreamPIIRestorer' },
      });
    }
    // 添加 OutputRenderMiddleware 节点（后端可能已推送 middleware span，去重）
    const hasOutputRender = liveSpans.some(s => (s.step_name_en === 'output_render') || ((s.metadata || {}).middleware_name || '').includes('OutputRender'));
    if (!hasOutputRender) {
      addLiveSpan({
        status: 'complete',
        icon: getSpanIcon('done'),
        title: 'OutputRenderMiddleware',
        step_name: 'OutputRenderMiddleware',
        step_name_en: 'output_render',
        phase: 'output',
        detail: 'PII 还原 fallback + 输出格式化: Markdown 清理 + UI 组件映射',
        desc: 'PII 还原 fallback + 输出格式化: Markdown 清理 + UI 组件映射',
        time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
        children: [],
        input_data: {},
        output_data: {},
        metadata: { is_middleware: true, middleware_name: 'OutputRenderMiddleware' },
      });
    }
    // 添加完成节点
    addLiveSpan({
      status: 'complete',
      icon: getSpanIcon('done'),
      title: '回复完成',
      step_name: '回复完成',
      step_name_en: 'response_complete',
      phase: 'post',
      detail: '已生成最终回复',
      desc: '已生成最终回复',
      time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8),
      children: [],
      input_data: {},
      output_data: {},
    });
    refreshTrace();
    updatePanelStatus(false);
    saveTraceToStorage(); // 对话完成后持久化链路到 localStorage
    addStep('回复完成 ✓', 'done');

    // 首次对话：延迟刷新标题（TitleMiddleware 异步生成）
    if (hist.filter(h => h.role === 'user').length <= 1) {
      setTimeout(async () => {
        try {
          const r = await (await fetch(API + '/api/conversations?limit=5')).json();
          const conv = (r.conversations || []).find(c => c.thread_id === tid);
          if (conv && conv.title && conv.title !== '新对话' && conv.title !== '对话') {
            document.getElementById('headerTitle').textContent = conv.title;
            const c = chatHistory.find(c => c.id === tid);
            if (c) c.title = conv.title;
            renderChatList();
          }
        } catch(e) {}
      }, 3000);
    }

  } catch(e) {
    addAIBubble('抱歉，请求出错了：' + e.message);
    updatePanelStatus(false);
    addStep('请求失败', 'err');
  }
}

// ═══ 加载对话历史 ═══
async function loadChatHistory() {
  // 从 localStorage 加载本地会话列表
  const localList = loadChatListFromStorage();

  try {
    const r = await (await fetch(API + '/api/conversations?limit=50')).json();
    const convs = r.conversations || [];
    chatHistory = convs
      .filter(c => !c.thread_id.startsWith('t-agui-') && !c.thread_id.startsWith('t-stream-'))  // 过滤测试数据
      .map(c => ({ id: c.thread_id, title: c.title || '对话', time: c.last_time || 0 }));
  } catch(e) {
    chatHistory = [];
  }

  // 合并 localStorage 中的会话（去重，localStorage 优先）
  for (const lc of localList) {
    if (!chatHistory.find(c => c.id === lc.id)) {
      chatHistory.push(lc);
    }
  }
  // 按时间排序
  chatHistory.sort((a, b) => (b.time || 0) - (a.time || 0));

  if (!chatHistory.find(c => c.id === tid)) {
    chatHistory.unshift({ id: tid, title: '新对话', time: Date.now() / 1000 });
  }
  renderChatList();

  // 刷新后自动恢复当前对话内容
  const localHist = loadHistFromStorage(tid);
  if (localHist.length > 0) {
    // localStorage 有数据 — 直接恢复（无需请求服务端）
    hist = localHist;
    const inner = document.getElementById('chatInner');
    const w = document.getElementById('welcomeBlock');
    if (w) w.remove();
    inner.innerHTML = '';
    for (const msg of localHist) {
      if (msg.role === 'user') addUserBubble(msg.content);
      else if (msg.role === 'assistant') addAIBubble(msg.content, {skipDocDetect: true});
    }
    const c = chatHistory.find(c => c.id === tid);
    if (c) document.getElementById('headerTitle').textContent = c.title || '对话';

    // 异步加载推理链路数据（优先 localStorage，fallback 服务端）
    const localTrace = loadTraceFromStorage(tid);
    if (localTrace.length > 0) {
      renderHistoricalTrace(localTrace);
    } else {
      (async () => {
        try {
          const r = await (await fetch(API + '/api/conversations/' + tid + '/messages')).json();
          const messages = r.messages || [];
          if (messages.length > 0) {
            const lastMsg = messages[messages.length - 1];
            if (lastMsg && lastMsg.spans && lastMsg.spans.length) {
              renderHistoricalTrace(lastMsg.spans);
            }
          }
        } catch(e) {
          console.debug('[Trace] 刷新后加载链路失败:', e);
        }
      })();
    }
  } else {
    // fallback: 从服务端加载
    const current = chatHistory.find(c => c.id === tid);
    if (current && current.title !== '新对话') {
      loadChat(tid);
    }
  }
}

async function loadChat(chatId) {
  tid = chatId;
  localStorage.setItem('deepagent_current_tid', tid);
  hist = [];
  const c = chatHistory.find(c => c.id === chatId);
  document.getElementById('headerTitle').textContent = c ? c.title : '对话';
  renderChatList();
  resetTrace();

  const inner = document.getElementById('chatInner');
  inner.innerHTML = '<div class="text-center text-gray-400 text-xs py-10">加载中...</div>';

  // 优先从 localStorage 恢复消息
  const localHist = loadHistFromStorage(chatId);
  if (localHist.length > 0) {
    inner.innerHTML = '';
    hist = localHist;
    for (const msg of localHist) {
      if (msg.role === 'user') addUserBubble(msg.content);
      else if (msg.role === 'assistant') addAIBubble(msg.content, {skipDocDetect: true});
    }
    // 恢复推理链路（优先 localStorage，fallback 服务端）
    const localTrace = loadTraceFromStorage(chatId);
    if (localTrace.length > 0) {
      renderHistoricalTrace(localTrace);
    } else {
      try {
        const r = await (await fetch(API + '/api/conversations/' + chatId + '/messages')).json();
        const messages = r.messages || [];
        if (messages.length > 0) {
          const lastMsg = messages[messages.length - 1];
          if (lastMsg && lastMsg.spans && lastMsg.spans.length) {
            renderHistoricalTrace(lastMsg.spans);
          }
        }
      } catch(e) {
        console.debug('[Trace] loadChat 加载链路失败:', e);
      }
    }
    return;
  }

  // fallback: 从服务端加载（SSE 模式的历史数据）
  try {
    // 使用新 API 一次性获取消息 + spans
    const r = await (await fetch(API + '/api/conversations/' + chatId + '/messages')).json();
    const messages = r.messages || [];
    if (!messages.length) { inner.innerHTML = '<div class="text-center text-gray-400 text-xs py-10">暂无消息</div>'; return; }
    inner.innerHTML = '';
    for (const msg of messages) {
      if (msg.user_input) { addUserBubble(msg.user_input); hist.push({ role: 'user', content: msg.user_input }); }
      // 恢复内联推理步骤
      if (msg.spans && msg.spans.length > 0) {
        renderInlineSteps(msg.spans);
      }
      if (msg.agent_output) { addAIBubble(msg.agent_output); hist.push({ role: 'assistant', content: msg.agent_output }); }
    }
    // 加载最后一条消息的完整推理链路到右侧面板
    const lastMsg = messages[messages.length - 1];
    if (lastMsg && lastMsg.spans && lastMsg.spans.length) {
      renderHistoricalTrace(lastMsg.spans);
    }
  } catch(e) { inner.innerHTML = '<div class="text-center text-gray-400 text-xs py-10">加载失败</div>'; }
}

// 恢复历史对话时，在对话气泡之间渲染内联推理步骤
// 只显示核心步骤（不含中间件），中间件细节在右侧面板查看
function renderInlineSteps(spans) {
  const inner = document.getElementById('chatInner');
  if (!spans || !spans.length) return;

  // 只保留核心步骤类型
  const CORE_TYPES = new Set([
    'title_generation', 'query_rewrite', 'content_review', 'content_review_input',
    'context_build', 'memory_retrieval',
    'llm_call', 'tool_call', 'skill_execution', 'hierarchical_search',
    'response_complete', 'response', 'memory_extract',
  ]);

  const coreSpans = spans.filter(s => {
    const t = s.step_name_en || s.type || s.span_type || '';
    return CORE_TYPES.has(t);
  });
  if (!coreSpans.length) return;

  // 计算总耗时
  const totalDuration = coreSpans.reduce((sum, s) => sum + (s.duration_ms || 0), 0);
  const durationText = totalDuration > 0 ? ` · ${totalDuration}ms` : '';
  const collapseId = 'inline-trace-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);

  // ═══ 分阶段构建 ═══
  const PHASES = [
    { types: ['title_generation', 'query_rewrite', 'content_review', 'content_review_input'], label: '入口预处理', icon: '🚀' },
    { types: ['context_build', 'memory_retrieval'], label: '上下文准备', icon: '📦' },
    { types: ['llm_call', 'tool_call', 'skill_execution', 'hierarchical_search'], label: '模型推理 Agent Loop', icon: '⚡' },
    { types: ['response_complete', 'response'], label: '回复输出', icon: '✅' },
    { types: ['memory_extract'], label: '后处理', icon: '💾' },
  ];

  function getPhaseIdx(spanType) {
    for (let i = 0; i < PHASES.length; i++) {
      if (PHASES[i].types.includes(spanType)) return i;
    }
    return 2; // 默认归入 reasoning
  }

  function renderCoreNode(s) {
    const spanType = s.step_name_en || s.type || '';
    const dur = s.duration_ms ? `${Math.round(s.duration_ms)}ms` : '';
    const status = s.status || 'complete';
    const isNodeError = status === 'error' || status === 'failed';
    const dotClass = (status === 'complete' || status === 'success') ? 'bg-green-500' :
                     isNodeError ? 'bg-red-500' : 'bg-blue-500';
    const md = s.metadata || {};
    let label = '';
    let desc = '';

    if (spanType === 'tool_call') {
      // 格式对齐右侧面板：工具调用: skills_tool(account-insight) [inline]
      const toolName = md.display_name || md.tool_name || '';
      const ctxMode = md.skill_context_mode || '';
      if (toolName) {
        const subName = md.sub_action || md.skill_name || '';
        label = `工具调用: ${toolName}${subName ? '(' + subName + ')' : ''}`;
        if (ctxMode) label += ` [${ctxMode}]`;
      } else {
        label = '工具调用';
      }
    } else if (spanType === 'skill_execution') {
      // 格式：技能执行: account-insight [inline/fork]
      const skillName = md.skill_name || '';
      const mode = md.skill_mode || md.context_mode || 'inline';
      if (skillName) {
        label = `技能执行: ${skillName} [${mode}]`;
        if (mode === 'inline') desc = '返回 SOP prompt';
        else if (mode === 'fork') desc = '子 Agent 独立执行';
      } else {
        label = '技能执行';
      }
    } else if (spanType === 'llm_call') {
      // 格式对齐右侧面板：模型推理 + 描述
      label = '模型推理';
      const toolCalls = md.tool_calls || (s.output_data && s.output_data.tool_calls) || [];
      if (toolCalls.length > 0) {
        const first = typeof toolCalls[0] === 'string' ? toolCalls[0] : (toolCalls[0].name || toolCalls[0].tool_name || '');
        desc = `调用 ${first}`;
      } else if (md.is_final || (s.output_data && s.output_data.is_final)) {
        desc = '生成最终回复';
      }
    } else if (spanType === 'error') {
      label = '执行错误';
      desc = md.error_message || s.detail || '未知错误';
    } else {
      const cnLabel = getSpanLabel(spanType);
      label = (cnLabel && cnLabel !== spanType) ? cnLabel : spanType;
      if (spanType === 'memory_retrieval' && md.hit_count != null) {
        desc = `命中 ${md.hit_count} 条`;
      }
    }

    // 异常节点增强样式
    if (isNodeError) {
      const errorDesc = desc || md.error_message || (s.output_data && s.output_data.error) || '异常';
      return `<div class="flex items-center gap-1.5 py-[2px] text-[11px] bg-red-50 rounded px-1 -mx-1 border-l-2 border-red-400"><div class="w-1.5 h-1.5 rounded-full ${dotClass} shrink-0 animate-pulse"></div><span class="font-semibold text-red-700">${esc(label)}</span><span class="text-red-500 text-[10px] ml-1 truncate">${esc(truncStr(errorDesc, 50))}</span>${dur ? `<span class="text-[10px] text-red-300 ml-auto">${dur}</span>` : ''}</div>`;
    }

    return `<div class="flex items-center gap-1.5 py-[2px] text-[11px] text-gray-600"><div class="w-1.5 h-1.5 rounded-full ${dotClass} shrink-0"></div><span class="font-medium">${esc(label)}</span>${desc ? `<span class="text-gray-400 text-[10px] ml-1">${esc(desc)}</span>` : ''}${dur ? `<span class="text-[10px] text-gray-300 ml-auto">${dur}</span>` : ''}</div>`;
  }

  // 按阶段分组渲染
  let bodyHtml = '';
  let currentPhaseIdx = -1;
  let llmCount = 0;

  // 预扫描 llm_call 数量，判断是否需要循环标记
  const llmSpans = coreSpans.filter(s => (s.step_name_en || s.type || '') === 'llm_call');
  const isMultiLoop = llmSpans.length > 1;
  let loopNum = 0;

  for (const s of coreSpans) {
    const spanType = s.step_name_en || s.type || '';
    const phaseIdx = getPhaseIdx(spanType);

    // 阶段切换
    if (phaseIdx > currentPhaseIdx) {
      if (currentPhaseIdx >= 0) bodyHtml += '</div></div>';
      currentPhaseIdx = phaseIdx;
      const phase = PHASES[phaseIdx];
      bodyHtml += `<div class="mt-2 first:mt-0"><div class="text-[10px] font-bold text-gray-500 mb-0.5">${phase.icon} ${phase.label}</div><div class="pl-2 border-l border-gray-200">`;
      loopNum = 0;
    }

    // Agent Loop 中的循环标记
    if (spanType === 'llm_call' && isMultiLoop && currentPhaseIdx === 2) {
      loopNum++;
      const md = s.metadata || {};
      const toolCalls = md.tool_calls || (s.output_data && s.output_data.tool_calls) || [];
      let loopDesc = '';
      if (md.is_final || (s.output_data && s.output_data.is_final)) {
        loopDesc = 'LLM 整合结果生成最终回复';
      } else if (toolCalls.length > 0) {
        const first = typeof toolCalls[0] === 'string' ? toolCalls[0] : (toolCalls[0].name || toolCalls[0].tool_name || '');
        loopDesc = `LLM 决定调用 ${first}`;
      }
      if (loopNum > 1) bodyHtml += '</div>'; // 关闭上一个循环
      bodyHtml += `<div class="pl-2 border-l-2 border-violet-200 mt-1 mb-1"><div class="text-[10px] text-violet-600 font-semibold mb-0.5">├─ 循环 ${loopNum}${loopDesc ? `（${esc(loopDesc)}）` : ''}</div>`;
    }

    bodyHtml += renderCoreNode(s);
  }

  // 关闭循环和阶段容器
  if (isMultiLoop && loopNum > 0) bodyHtml += '</div>';
  if (currentPhaseIdx >= 0) bodyHtml += '</div></div>';

  // 统计异常步骤数
  const errorCount = coreSpans.filter(s => s.status === 'error' || s.status === 'failed').length;
  const errorBadge = errorCount > 0
    ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold bg-red-100 text-red-600 border border-red-200">${errorCount} 个异常</span>`
    : '';

  // ═══ 组装容器 ═══
  const container = document.createElement('div');
  container.className = 'ml-12 mb-2';
  container.innerHTML = `
    <div class="border ${errorCount > 0 ? 'border-red-200' : 'border-gray-100'} rounded-xl ${errorCount > 0 ? 'bg-red-50/30' : 'bg-gray-50/50'} overflow-hidden">
      <div class="flex items-center gap-2 px-3 py-2 cursor-pointer select-none hover:bg-gray-100/60 transition-colors"
           onclick="toggleInlineTrace('${collapseId}')">
        <svg id="${collapseId}-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             class="${errorCount > 0 ? 'text-red-400' : 'text-gray-400'} transition-transform duration-200" style="transform: rotate(${errorCount > 0 ? '90' : '0'}deg);">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="text-xs font-medium ${errorCount > 0 ? 'text-red-600' : 'text-gray-500'}">${errorCount > 0 ? '⚠️' : '⚡'} 推理链路</span>
        <span class="text-[10px] text-gray-400">${coreSpans.length} 步${durationText}</span>
        ${errorBadge}
      </div>
      <div id="${collapseId}" class="${errorCount > 0 ? '' : 'hidden'} px-3 pb-2">${bodyHtml}</div>
    </div>`;
  inner.appendChild(container);
}

// 折叠/展开内联推理链路
function toggleInlineTrace(id) {
  const content = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  if (!content) return;
  const isHidden = content.classList.contains('hidden');
  if (isHidden) {
    content.classList.remove('hidden');
    if (arrow) arrow.style.transform = 'rotate(90deg)';
  } else {
    content.classList.add('hidden');
    if (arrow) arrow.style.transform = 'rotate(0deg)';
  }
}

// 将历史 trace spans 渲染到推理链路面板
function renderHistoricalTrace(spans) {
  liveSpans = spans.map((s, idx) => {
    const md = s.metadata || {};
    const inD = s.input_data || s.input || {};
    const outD = s.output_data || s.output || {};

    // 子节点
    const children = [];
    if (Array.isArray(md.children)) {
      md.children.forEach(ch => {
        const name = ch.name || ch.type || '';
        const dur = ch.duration_ms ? ` ${Math.round(ch.duration_ms)}ms` : '';
        children.push({ label: name + dur, status: 'complete', duration_ms: ch.duration_ms || 0 });
      });
    }
    if (md.hit_count != null) children.push({ label: `命中 ${md.hit_count} 条结果`, status: 'complete' });
    if (md.task_type) children.push({ label: `任务类型: ${md.task_type}`, status: 'complete' });
    if (s.type === 'llm_call' && md.output_tokens) {
      children.push({ label: `输出 ${md.output_tokens} tokens`, status: 'complete' });
    }
    if (s.type === 'tool_call' && md.output) {
      children.push({ label: truncStr(String(md.output), 60), status: 'complete' });
    }

    // 子 Agent 循环（fork 技能）— 从 children 字段恢复
    let subAgentSpans = [];
    const rawChildren = s.children || md.children || [];
    if (Array.isArray(rawChildren) && rawChildren.length > 0) {
      // 检查是否是 skill_execution 的子 Agent spans（有 type 字段）
      const hasStructured = rawChildren.some(ch => ch.type && ch.type !== '');
      if (hasStructured && (s.type === 'skill_execution' || (s.step_name_en || '').includes('skill'))) {
        subAgentSpans = rawChildren.map(ch => ({
          label: ch.name || ch.label || ch.type || '',
          type: ch.type || '', name: ch.name || '', detail: ch.detail || '',
          duration_ms: ch.duration_ms || 0,
          input_data: ch.input_data || {},
          output_data: ch.output_data || {},
          metadata: ch.metadata || {},
        }));
      }
    }
    // fallback: 旧格式 md.sub_agent_loops
    if (subAgentSpans.length === 0 && md.sub_agent_loops && Array.isArray(md.sub_agent_loops)) {
      subAgentSpans = md.sub_agent_loops.map(loop => ({
        label: loop.label || loop.name || '',
        duration_ms: loop.duration_ms || 0,
      }));
    }

    const startTime = s.start_time ? new Date(s.start_time * 1000).toLocaleTimeString('zh-CN', {hour12:false}).slice(0,8) : '';

    let stepName = s.step_name || md.step_name || getSpanLabel(s.type);
    const stepNameEn = s.step_name_en || md.step_name_en || s.type || '';
    const detail = s.detail || md.detail || (md.query_used ? `查询: "${truncStr(md.query_used, 50)}"` : (s.duration_ms ? `完成 (${Math.round(s.duration_ms)}ms)` : ''));

    // 对 tool_call 类型，补充具体工具名称
    if (s.type === 'tool_call') {
      const toolDisplayName = md.display_name || md.tool_name || (s.name ? s.name.replace(/^tool:/, '') : '');
      if (toolDisplayName && !stepName.includes(toolDisplayName)) {
        stepName = `工具调用: ${toolDisplayName}`;
      }
    }

    // 对 skill_execution 类型，补充技能名称
    if (s.type === 'skill_execution') {
      const skillName = md.skill_name || '';
      if (skillName && !stepName.includes(skillName)) {
        stepName = `技能执行: ${skillName}`;
      }
    }

    // input_data / output_data
    let inputData = {};
    let outputData = {};
    if (typeof inD === 'object' && !Array.isArray(inD) && Object.keys(inD).length > 0) {
      inputData = inD;
    } else {
      if (s.type === 'query_rewrite') inputData = { original_query: md.original_query || '' };
      else if (s.type === 'memory_retrieval') inputData = { query: md.query_used || '', dimensions: md.dimensions || [] };
      else if (s.type === 'intent_analysis') inputData = { raw_intent: md.raw_intent || '' };
      else if (s.type === 'tool_call') inputData = { tool_name: md.tool_name || '', arguments: md.input || '' };
      else if (s.type === 'llm_input') inputData = { messages_to_llm: md.messages_to_llm || '' };
      else if (s.type === 'content_review') inputData = { direction: md.direction || 'input', review_type: 'toxicity + keyword' };
      else if (s.type === 'memory_extract') inputData = { source: 'agent_response' };
      else if (s.type === 'context_build') inputData = { message_count: md.message_count || 0 };
      else if (s.type === 'hierarchical_search') inputData = { search_type: md.search_type || '' };
      else if (s.type === 'skill_execution') inputData = { skill_name: md.skill_name || '', mode: md.skill_mode || 'inline' };
    }
    if (typeof outD === 'object' && !Array.isArray(outD) && Object.keys(outD).length > 0) {
      outputData = outD;
    } else {
      if (s.type === 'query_rewrite') outputData = { rewritten_query: md.rewritten_query || '', changed: md.changed };
      else if (s.type === 'memory_retrieval') outputData = { hit_count: md.hit_count || 0, items_preview: md.items_preview || [] };
      else if (s.type === 'intent_analysis') outputData = { task_type: md.task_type || '', matched_skills: md.matched_skills || [], confidence: md.confidence };
      else if (s.type === 'tool_call') outputData = { result: md.output || '', status: md.status || 'success' };
      else if (s.type === 'content_review') outputData = { passed: md.passed, blocked_keywords: md.blocked_keywords || [], blocked_reason: md.blocked_reason || '' };
      else if (s.type === 'memory_extract') outputData = { extracted_count: md.extracted_count || 0, dimensions: md.dimensions || [] };
      else if (s.type === 'context_build') outputData = { estimated_tokens: md.estimated_tokens || 0, message_count: md.message_count || 0 };
      else if (s.type === 'hierarchical_search') outputData = { hit_count: md.hit_count || 0 };
      else if (s.type === 'skill_execution') outputData = { result: md.skill_result_desc || md.output || '' };
    }

    return {
      status: s.status || 'complete',
      icon: getSpanIcon(s.type),
      title: s.name || getSpanLabel(s.type),
      step_name: stepName,
      step_name_en: stepNameEn,
      phase: s.phase || '',
      detail: detail,
      desc: detail,
      duration_ms: s.duration_ms || 0,
      time: startTime,
      children: children,
      sub_agent_spans: subAgentSpans,
      input_data: inputData,
      output_data: outputData,
      input: '',
      output: '',
      metadata: md,
    };
  });
  refreshTrace();
  updatePanelStatus(false);
}

// ═══ 初始化 ═══
loadChatHistory();

// 初始化参考上下文面板
refreshGeneratedFiles();
updateDocsPanel([], [
  { name: '2024 年度销售统计口径说明.pdf', size: '1.1MB' },
  { name: '华东大区客户分级列表.csv', size: '842KB' }
]);
</script>
