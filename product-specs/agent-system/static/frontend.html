<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepAgent AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// Tailwind CDN fallback：如果主 CDN 加载失败，尝试备用源
if (typeof tailwind === 'undefined') {
  document.write('<script src="https://unpkg.com/tailwindcss@3/lib/cdn.min.js"><\/script>');
}
</script>
<script>
// 最终兜底：如果 Tailwind 仍未加载，注入关键布局样式
window.addEventListener('DOMContentLoaded', function() {
  if (!document.querySelector('style[data-tailwind]') && typeof tailwind === 'undefined') {
    var s = document.createElement('style');
    s.textContent = `
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-1 { flex: 1 1 0%; }
      .h-screen { height: 100vh; }
      .w-full { width: 100%; }
      .overflow-hidden { overflow: hidden; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .hidden { display: none; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .gap-2 { gap: 0.5rem; }
      .gap-3 { gap: 0.75rem; }
      .gap-4 { gap: 1rem; }
      .p-4 { padding: 1rem; }
      .p-6 { padding: 1.5rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .px-8 { padding-left: 2rem; padding-right: 2rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .mb-2 { margin-bottom: 0.5rem; }
      .mb-8 { margin-bottom: 2rem; }
      .text-center { text-align: center; }
      .text-sm { font-size: 0.875rem; }
      .text-xs { font-size: 0.75rem; }
      .text-lg { font-size: 1.125rem; }
      .text-2xl { font-size: 1.5rem; }
      .font-bold { font-weight: 700; }
      .rounded-xl { border-radius: 0.75rem; }
      .rounded-2xl { border-radius: 1rem; }
      .border { border-width: 1px; }
      .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .bg-white { background-color: #fff; }
      .text-gray-500 { color: #6b7280; }
      .text-gray-800 { color: #1f2937; }
      .text-gray-900 { color: #111827; }
      .min-w-0 { min-width: 0; }
      .shrink-0 { flex-shrink: 0; }
      .w-72 { width: 18rem; }
      .overflow-y-auto { overflow-y: auto; }
      .border-r { border-right-width: 1px; }
      .border-b { border-bottom-width: 1px; }
      .border-t { border-top-width: 1px; }
      .h-16 { height: 4rem; }
      .space-y-1 > * + * { margin-top: 0.25rem; }
      .space-y-2 > * + * { margin-top: 0.5rem; }
      .space-y-4 > * + * { margin-top: 1rem; }
      .space-y-6 > * + * { margin-top: 1.5rem; }
      .space-y-10 > * + * { margin-top: 2.5rem; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pointer-events-none { pointer-events: none; }
      .cursor-pointer { cursor: pointer; }
      .transition-all { transition: all 0.15s ease; }
      .resize-none { resize: none; }
      .flex-wrap { flex-wrap: wrap; }
      .w-0 { width: 0; }
      .opacity-0 { opacity: 0; }
      .m-0 { margin: 0; }
      .border-0 { border-width: 0; }
    `;
    document.head.appendChild(s);
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.05); border-radius: 10px; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slide-in-right { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.5s ease-out; }
.animate-slide-right { animation: slide-in-right 0.5s ease-out; }
.animate-ping-slow { animation: pulse-dot 1.5s infinite; }
textarea:focus { outline: none; }
/* 文档预览 markdown 样式 */
#docPreviewContent h1 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; color: #1a1a2e; }
#docPreviewContent h2 { font-size: 1.1rem; font-weight: 700; margin: 1rem 0 0.4rem; color: #2d3748; }
#docPreviewContent h3 { font-size: 0.95rem; font-weight: 600; margin: 0.8rem 0 0.3rem; color: #4a5568; }
#docPreviewContent p { margin: 0.4rem 0; line-height: 1.7; }
#docPreviewContent ul, #docPreviewContent ol { padding-left: 1.2rem; margin: 0.4rem 0; }
#docPreviewContent li { margin: 0.2rem 0; line-height: 1.6; }
#docPreviewContent table { width: 100%; border-collapse: collapse; margin: 0.6rem 0; font-size: 12px; }
#docPreviewContent th, #docPreviewContent td { border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left; }
#docPreviewContent th { background: #f7fafc; font-weight: 600; }
#docPreviewContent strong { color: #2563eb; }
#docPreviewContent blockquote { border-left: 3px solid #3b82f6; padding: 0.5rem 1rem; margin: 0.5rem 0; background: #eff6ff; border-radius: 0 8px 8px 0; }
#docPreviewContent code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
#docPreviewContent pre { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 0.5rem 0; }
#docPreviewContent pre code { background: none; color: inherit; padding: 0; }
/* 对话区内文档内容截断样式 */
.prose-content h1 { font-size: 1rem; font-weight: 700; margin: 0.3rem 0; }
.prose-content h2 { font-size: 0.9rem; font-weight: 600; margin: 0.3rem 0; }
.prose-content p { margin: 0.2rem 0; font-size: 13px; line-height: 1.6; }
.prose-content table { width: 100%; border-collapse: collapse; margin: 0.4rem 0; font-size: 12px; }
.prose-content th, .prose-content td { border: 1px solid #e5e7eb; padding: 4px 8px; }
.prose-content th { background: #f9fafb; font-weight: 600; }

/* ═══ 布局基线（不依赖 Tailwind JIT 任意值）═══ */
/* 防止 Tailwind CDN 未加载/未处理任意值时布局崩溃 */
html, body { height: 100%; }
body { margin: 0; }

/* 顶层容器强制 flex 布局（双保险，即便 Tailwind 失败也生效） */
#app { display: flex; height: 100vh; width: 100%; overflow: hidden; position: relative; background: #f4f7fb; }

/* 左侧边栏固定宽度 */
#sidebar { width: 18rem; flex-shrink: 0; display: flex; flex-direction: column; }

/* 主工作区占据剩余空间，min-width:0 至关重要 —— 防止 flex 子项被内容撑破 */
#app > main { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* 主工作区内的对话/右侧面板 flex 容器 */
#app > main > div.flex-1.flex { display: flex; flex: 1 1 0%; overflow: hidden; min-width: 0; }

/* 对话核心区 min-width:0，否则长内容（代码块、trace 预览）会把它撑破 */
#app > main > div.flex-1.flex > div.flex-1 { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* 右侧面板：显式宽度，防止被内容撑开 */
#rightPanel { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
#rightPanel.w-0 { width: 0 !important; margin: 0 !important; border-width: 0 !important; opacity: 0; pointer-events: none; }

/* 消息气泡最大宽度（避免没有 Tailwind 任意值时铺满整行） */
#chatInner .flex.justify-end > div,
#chatInner .flex.justify-start > div { max-width: 85%; }

/* 顶部标题最大宽度（避免长会话标题把租户/用户信息挤下去） */
#headerTitle { max-width: 180px; }
#headerUserDisplay { max-width: 100px; }

/* 聊天区容器最大宽度 */
#chatInner { max-width: 56rem; margin-left: auto; margin-right: auto; width: 100%; }

/* 任意值：常用宽度 */
.w-\[400px\] { width: 400px; }
.max-w-\[85\%\] { max-width: 85%; }
.max-w-\[180px\] { max-width: 180px; }
.max-w-\[100px\] { max-width: 100px; }
.max-w-\[120px\] { max-width: 120px; }
.max-w-\[200px\] { max-width: 200px; }

/* 标准 Tailwind 尺寸 fallback（供 Tailwind CDN 失效时兜底） */
.max-w-4xl { max-width: 56rem; }
.max-w-5xl { max-width: 64rem; }
.max-w-xl { max-width: 36rem; }
.max-w-none { max-width: none; }
.mx-auto { margin-left: auto; margin-right: auto; }

/* 圆角 */
.rounded-\[32px\] { border-radius: 32px; }

/* 常用 px 级字号 */
.text-\[9px\] { font-size: 9px; }
.text-\[10px\] { font-size: 10px; }
.text-\[10\.5px\] { font-size: 10.5px; }
.text-\[11px\] { font-size: 11px; }
.text-\[12px\] { font-size: 12px; }
.text-\[13px\] { font-size: 13px; }
.text-\[14px\] { font-size: 14px; }

/* trace 预览卡片内最大高度 */
.max-h-\[200px\] { max-height: 200px; }
.max-h-40 { max-height: 10rem; }
.max-h-56 { max-height: 14rem; }

/* 背景装饰球 */
.top-\[-10\%\] { top: -10%; }
.left-\[-5\%\] { left: -5%; }
.bottom-\[-10\%\] { bottom: -10%; }
.right-\[-5\%\] { right: -5%; }
.w-\[40\%\] { width: 40%; }
.h-\[40\%\] { height: 40%; }
.w-\[30\%\] { width: 30%; }
.h-\[30\%\] { height: 30%; }
.blur-\[100px\] { filter: blur(100px); }

/* 让 flex-1 子项默认拥有 min-width:0，防止 flex overflow 扩张 */
.flex-1.min-w-0 { min-width: 0; }
</style>
</head>
<body>
<div id="app" class="flex h-screen w-full bg-[#f4f7fb] font-sans text-slate-800 overflow-hidden relative">
  <!-- 氛围背景装饰 -->
  <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-indigo-400/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- 左侧对话历史面板 -->
  <aside id="sidebar" class="w-72 flex flex-col z-20 shrink-0 bg-white/40 backdrop-blur-xl border-r border-gray-200/50">
    <div class="p-6">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <span class="font-bold text-lg tracking-tight text-gray-900">DeepAgent AI</span>
      </div>
      <button onclick="newChat()" class="w-full py-3 px-4 bg-white border border-gray-200/50 rounded-2xl flex items-center justify-center gap-2 text-sm font-bold text-blue-600 shadow-sm hover:shadow-md hover:bg-blue-50 transition-all group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:rotate-90 transition-transform duration-300"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建对话
      </button>
    </div>
    <div class="flex-1 overflow-y-auto custom-scrollbar px-4 space-y-6 pb-6">
      <div class="relative mx-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="搜索历史内容..." oninput="onSearchInput(this.value)" class="w-full bg-gray-100/50 border-none rounded-xl py-2 pl-9 pr-4 text-xs focus:ring-2 focus:ring-blue-500/20 placeholder:text-gray-400 transition-all"/>
      </div>
      <div id="chatListToday">
        <h3 class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">今天</h3>
        <div id="chatListTodayItems" class="space-y-1"></div>
      </div>
      <div id="chatListYesterday">
        <h3 class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">更早</h3>
        <div id="chatListYesterdayItems" class="space-y-1"></div>
      </div>
    </div>
    <div class="p-4 border-t border-gray-100/50 bg-white/20">
      <!-- 用户信息 -->
      <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-white/40 transition-all cursor-pointer group">
        <div class="w-10 h-10 rounded-full bg-blue-100 border-2 border-white shadow-sm flex items-center justify-center text-blue-600 font-bold text-xs group-hover:scale-105 transition-transform">王</div>
        <div class="flex-1 overflow-hidden">
          <p class="text-xs font-bold text-gray-900">王经理</p>
          <p class="text-[10px] text-gray-500 truncate">华东大区负责人</p>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </div>
    </div>
  </aside>

  <!-- 主工作区 -->
  <main class="flex-1 flex flex-col min-w-0 relative z-10 transition-all duration-300">
    <header class="h-14 flex items-center justify-between px-6 bg-white/40 backdrop-blur-md border-b border-gray-200/50 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span id="headerTitle" class="text-sm font-bold text-gray-900 truncate max-w-[180px]">新对话</span>
        <span class="text-[10px] text-gray-400 font-medium bg-blue-50 px-2 py-0.5 rounded-full text-blue-600 shrink-0">当前会话</span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <nav class="flex items-center">
          <a href="/knowledge" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">知识库</a>
          <a href="/metamodel" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">元模型</a>
          <a href="/skills" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">技能</a>
          <a href="/memory" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">记忆</a>
          <a href="/trace" class="px-2 py-1.5 text-[11px] font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">Trace</a>
        </nav>
        <div class="h-4 w-px bg-gray-200 mx-1"></div>
        <div class="flex items-center gap-1.5 px-2 py-1 bg-white/60 border border-gray-200/50 rounded-lg text-[10px]">
          <span class="text-gray-400">租户</span>
          <span id="headerTenantDisplay" class="text-gray-800 font-bold">—</span>
          <span class="text-gray-200">|</span>
          <span class="text-gray-400">用户</span>
          <span id="headerUserDisplay" class="text-gray-800 font-bold max-w-[100px] truncate" title="">—</span>
        </div>
        <button id="openPanelBtn" onclick="openRightPanel()" class="hidden p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all shadow-sm bg-white ml-1">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <!-- 对话核心区 -->
      <div class="flex-1 flex flex-col min-w-0 relative">
        <div id="chatArea" class="flex-1 overflow-y-auto custom-scrollbar px-6 py-10">
          <div id="chatInner" class="max-w-4xl mx-auto w-full space-y-10">
            <!-- 欢迎页 -->
            <div id="welcomeBlock" class="text-center py-20">
              <h1 class="text-2xl font-bold mb-2">你好，我是 CRM 智能助手 👋</h1>
              <p class="text-gray-500 text-sm mb-8">我可以帮你查询客户数据、分析商机 Pipeline、校验配置等</p>
              <div class="flex gap-3 flex-wrap justify-center max-w-xl mx-auto">
                <div onclick="sq('帮我查一下活跃客户，按营收排序')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">🏢 查看活跃客户</div>
                <div onclick="sq('帮我分析商机 Pipeline，按阶段统计金额')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">📈 Pipeline 分析</div>
                <div onclick="sq('系统中有多少个客户？')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">📊 客户统计</div>
                <div onclick="sq('帮我校验商机的元数据配置')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">🔍 配置校验</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 输入框 -->
        <div class="px-8 pb-8 pt-2 w-full max-w-5xl mx-auto">
          <div class="rounded-[32px] bg-white/95 backdrop-blur-md border border-white/50 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] overflow-hidden transition-all focus-within:ring-4 focus-within:ring-blue-500/5">
            <div id="filePv" class="px-6 pt-2 hidden"></div>
            <div class="px-6 pt-5">
              <textarea id="inp" rows="1" placeholder="在此输入您的 CRM 查询指令..."
                class="w-full bg-transparent border-none focus:ring-0 text-gray-800 text-lg p-0 resize-none placeholder:text-gray-300 leading-relaxed"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
                oninput="this.style.height='28px';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
            </div>
            <div class="px-4 py-3 flex items-center justify-between">
              <div class="flex items-center gap-0.5">
                <input type="file" id="fi" style="display:none" accept="image/*,.pdf,.docx,.xlsx,.txt,.csv,.md" onchange="onFile(event)" multiple>
                <button onclick="document.getElementById('fi').click()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-gray-400 hover:bg-blue-50 hover:text-blue-600 transition-all text-xs font-bold">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49"/></svg>
                </button>
                <button onclick="sq('用表格展示')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-gray-400 hover:bg-blue-50 hover:text-blue-600 transition-all text-xs font-bold">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                  <span>数据表</span>
                </button>
                <button onclick="sq('整理成报告')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-gray-400 hover:bg-blue-50 hover:text-blue-600 transition-all text-xs font-bold">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

<script>
// ═══ 状态管理 ═══
const API = '';
let tid = localStorage.getItem('deepagent_current_tid') || genId();
localStorage.setItem('deepagent_current_tid', tid);
let hist = [], pf = [];
let activeTab = 'realtime';
let isRightPanelOpen = true;
let chatHistory = [];
let liveSpans = [];
let generatedDocs = []; // 生成的文档列表
let currentPreviewDoc = null; // 当前预览的文档

// 持久化用户 ID（优先从后端获取真实用户信息，fallback 到 localStorage 随机 ID）
let userId = localStorage.getItem('deepagent_user_id') || '';
let userName = '';
let tenantId = '';

(async function initUserIdentity() {
  try {
    const r = await fetch(API + '/api/auth/me');
    if (r.ok) {
      const me = await r.json();
      if (me.userId) {
        userId = String(me.userId);
        userName = me.name || '';
        tenantId = String(me.tenantId || '');
        localStorage.setItem('deepagent_user_id', userId);
      }
    }
  } catch (e) { /* 后端未启动或接口不存在，用 fallback */ }

  if (!userId) {
    userId = 'user_' + genId();
    localStorage.setItem('deepagent_user_id', userId);
  }
  if (!tenantId) tenantId = '292193';

  console.log('[DeepAgent] user_id:', userId, 'name:', userName, 'tenant:', tenantId);

  // 更新顶部显示
  const userEl = document.getElementById('headerUserDisplay');
  if (userEl) {
    const display = userName || userId;
    userEl.textContent = display;
    userEl.title = userName ? `${userName} (${userId})` : userId;
  }
  const tenantEl = document.getElementById('headerTenantDisplay');
  if (tenantEl) tenantEl.textContent = tenantId;
})();

function genId() {
  try { if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID().replace(/-/g, '').slice(0, 12); } catch(e) {}
  return 'xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function truncStr(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : s; }

// ═══ 右侧面板控制 ═══
function closeRightPanel() {
  isRightPanelOpen = false;
  document.getElementById('rightPanel').classList.add('w-0', 'opacity-0', 'pointer-events-none', 'm-0', 'border-0');
  document.getElementById('rightPanel').classList.remove('w-[400px]', 'm-6');
  document.getElementById('openPanelBtn').classList.remove('hidden');
}

function openRightPanel() {
  isRightPanelOpen = true;
  document.getElementById('rightPanel').classList.remove('w-0', 'opacity-0', 'pointer-events-none', 'm-0', 'border-0');
  document.getElementById('rightPanel').classList.add('w-[400px]', 'm-6');
  document.getElementById('openPanelBtn').classList.add('hidden');
}

// ═══ Tab 切换 ═══
function switchTab(tab) {
  activeTab = tab;
  const tabRealtime = document.getElementById('tabRealtime');
  const tabDocs = document.getElementById('tabDocs');
  const panelRealtime = document.getElementById('panelRealtime');
  const panelDocs = document.getElementById('panelDocs');

  if (tab === 'realtime') {
    tabRealtime.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600';
    tabDocs.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all text-gray-500 hover:bg-white/40';
    panelRealtime.classList.remove('hidden');
    panelDocs.classList.add('hidden');
  } else {
    tabDocs.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all bg-white shadow-sm text-blue-600';
    tabRealtime.className = 'flex-1 flex items-center justify-center gap-2 py-2 text-[11px] font-bold rounded-xl transition-all text-gray-500 hover:bg-white/40';
    panelDocs.classList.remove('hidden');
    panelRealtime.classList.add('hidden');
  }
}

// ═══ 对话历史 ═══
function renderHistoryItem(title, active, chatId) {
  return `<div class="group flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-all ${active ? 'bg-white shadow-sm ring-1 ring-black/5 text-blue-600' : 'text-gray-600 hover:bg-white/60 hover:text-gray-900'}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="${active ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-600'}"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="text-xs font-medium truncate flex-1">${esc(title)}</span>
    <button onclick="event.stopPropagation();deleteChat('${esc(chatId)}')" class="hidden group-hover:flex w-5 h-5 items-center justify-center rounded-lg text-gray-300 hover:text-red-500 hover:bg-red-50 transition-all shrink-0" title="删除会话">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    ${active ? '<div class="w-1 h-3 bg-blue-500 rounded-full"></div>' : ''}
  </div>`;
}

function renderChatList() {
  const todayItems = document.getElementById('chatListTodayItems');
  const yesterdayItems = document.getElementById('chatListYesterdayItems');

  // 按自然日零点划分（而不是 24 小时）
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
  const yesterdayStart = todayStart - 86400;

  let todayHtml = '';
  let yesterdayHtml = '';
  let olderHtml = '';

  chatHistory.forEach(c => {
    const isActive = c.id === tid;
    const html = `<div onclick="loadChat('${esc(c.id)}')">${renderHistoryItem(c.title || '新对话', isActive, c.id)}</div>`;
    if (c.time >= todayStart) todayHtml += html;
    else if (c.time >= yesterdayStart) yesterdayHtml += html;
    else yesterdayHtml += html; // 更早的也放到"更早"分组
  });

  todayItems.innerHTML = todayHtml || '<div class="px-4 text-[10px] text-gray-400">暂无</div>';
  yesterdayItems.innerHTML = yesterdayHtml || '<div class="px-4 text-[10px] text-gray-400">暂无</div>';
}

// ═══ 删除会话 ═══
async function deleteChat(chatId) {
  if (!confirm('确认删除该会话？')) return;
  try {
    await fetch(API + '/api/conversations/' + chatId, { method: 'DELETE' });
  } catch(e) {}
  chatHistory = chatHistory.filter(c => c.id !== chatId);
  if (chatId === tid) {
    newChat();
  } else {
    renderChatList();
  }
}

// ═══ 搜索功能 ═══
let searchTimer = null;
function onSearchInput(query) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => filterChatList(query), 200);
}

function filterChatList(query) {
  const q = (query || '').trim().toLowerCase();
  const todayItems = document.getElementById('chatListTodayItems');
  const yesterdayItems = document.getElementById('chatListYesterdayItems');
  const todaySection = document.getElementById('chatListToday');
  const yesterdaySection = document.getElementById('chatListYesterday');

  if (!q) {
    // 无搜索词，恢复正常显示
    todaySection.classList.remove('hidden');
    yesterdaySection.classList.remove('hidden');
    renderChatList();
    return;
  }

  // 过滤匹配的对话
  const now2 = new Date();
  const todayStart2 = new Date(now2.getFullYear(), now2.getMonth(), now2.getDate()).getTime() / 1000;
  let todayHtml = '';
  let yesterdayHtml = '';

  chatHistory.forEach(c => {
    const title = c.title || '新对话';
    if (!title.toLowerCase().includes(q)) return;
    const isActive = c.id === tid;
    const html = `<div onclick="loadChat('${esc(c.id)}')">${renderHistoryItem(title, isActive, c.id)}</div>`;
    if (c.time >= todayStart2) todayHtml += html;
    else yesterdayHtml += html;
  });

  if (todayHtml) {
    todaySection.classList.remove('hidden');
    todayItems.innerHTML = todayHtml;
  } else {
    todaySection.classList.add('hidden');
  }

  if (yesterdayHtml) {
    yesterdaySection.classList.remove('hidden');
    yesterdayItems.innerHTML = yesterdayHtml;
  } else {
    yesterdaySection.classList.add('hidden');
  }

  // 都没有匹配
  if (!todayHtml && !yesterdayHtml) {
    todaySection.classList.remove('hidden');
    todayItems.innerHTML = '<div class="px-4 py-4 text-center text-[11px] text-gray-400">未找到匹配的对话</div>';
    yesterdaySection.classList.add('hidden');
  }
}

// ═══ 新建对话 ═══
function newChat() {
  // 清理之前未使用的空对话（标题仍为"新对话"且不是当前对话的）
  chatHistory = chatHistory.filter(c => c.id === tid || c.title !== '新对话');
  tid = genId();
  localStorage.setItem('deepagent_current_tid', tid);
  hist = [];
  generatedDocs = [];
  currentPreviewDoc = null;
  if (!chatHistory.find(c => c.id === tid)) {
    chatHistory.unshift({ id: tid, title: '新对话', time: Date.now() / 1000 });
  }
  renderChatList();
  refreshGeneratedFiles();
  closeDocPreview();
  document.getElementById('chatInner').innerHTML = `
    <div id="welcomeBlock" class="text-center py-20">
      <h1 class="text-2xl font-bold mb-2">你好，我是 CRM 智能助手 👋</h1>
      <p class="text-gray-500 text-sm mb-8">我可以帮你查询客户数据、分析商机 Pipeline、校验配置等</p>
      <div class="flex gap-3 flex-wrap justify-center max-w-xl mx-auto">
        <div onclick="sq('帮我查一下活跃客户')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">🏢 查看活跃客户</div>
        <div onclick="sq('分析商机 Pipeline')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">📈 Pipeline 分析</div>
        <div onclick="sq('系统有多少客户')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">📊 客户统计</div>
        <div onclick="sq('校验商机配置')" class="bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm text-gray-600 cursor-pointer hover:border-blue-400 hover:text-blue-600 hover:shadow-md transition-all">🔍 配置校验</div>
      </div>
    </div>`;
  document.getElementById('headerTitle').textContent = '新对话';
  resetTrace();
}

// ═══ 消息气泡 ═══
function addUserBubble(content) {
  const w = document.getElementById('welcomeBlock');
  if (w) w.remove();
  const inner = document.getElementById('chatInner');
  inner.insertAdjacentHTML('beforeend', `
    <div class="flex justify-end w-full animate-fade-in">
      <div class="max-w-[85%] flex gap-4 flex-row-reverse">
        <div class="w-8 h-8 rounded-xl shrink-0 flex items-center justify-center text-xs font-bold shadow-sm bg-blue-600 text-white shadow-lg shadow-blue-600/10">王</div>
        <div class="p-4 rounded-2xl text-[14px] shadow-sm bg-blue-600 text-white font-medium">${esc(content)}</div>
      </div>
    </div>`);
  scrollToBottom();
}

function addAIBubble(content, extra) {
  const inner = document.getElementById('chatInner');
  const rendered = typeof marked !== 'undefined' ? marked.parse(content) : esc(content);

  // 检测是否包含报告/文档内容（有标题结构的长文本）
  const docInfo = detectDocument(content);

  let docCardHtml = '';
  if (docInfo) {
    const docId = 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    // 存储文档内容
    generatedDocs.push({ id: docId, title: docInfo.title, content: content, time: new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,5) });
    // 更新右侧面板文件列表
    refreshGeneratedFiles();

    docCardHtml = `
      <div class="mt-4 flex items-center gap-4 p-3 rounded-2xl bg-blue-50/50 border border-blue-100 transition-all hover:bg-blue-50 cursor-pointer group" onclick="openDocPreview('${docId}')">
        <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:scale-105 transition-transform">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-blue-900 leading-none mb-1">${esc(docInfo.title)}.md</p>
          <p class="text-[10px] text-blue-600 font-medium">点击查看全文 • ${Math.ceil(content.length / 500)}页</p>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-400 mr-2"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </div>`;
  }

  inner.insertAdjacentHTML('beforeend', `
    <div class="flex justify-start w-full animate-fade-in">
      <div class="max-w-[85%] flex gap-4 flex-row">
        <div class="w-8 h-8 rounded-xl shrink-0 flex items-center justify-center text-xs font-bold shadow-sm bg-white border border-blue-100 text-blue-600">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div class="p-4 rounded-2xl text-[14px] shadow-sm bg-white border border-gray-100 text-gray-800">
          ${docInfo ? `<div class="max-h-[200px] overflow-hidden relative"><div class="prose-content">${rendered}</div><div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-white to-transparent"></div></div>` : rendered}
          ${docCardHtml}
          ${extra || ''}
        </div>
      </div>
    </div>`);
  scrollToBottom();
}

// 文档模式专用：直接渲染缩略+卡片，不重复检测
function addAIBubbleRaw(content, docTitle, docId) {
  const inner = document.getElementById('chatInner');

  inner.insertAdjacentHTML('beforeend', `

              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </div>

function renderTraceNode(span, idx, seqNum) {
  const isComplete = span.status === 'complete';
  const isActive = span.status === 'active';
  const isPending = span.status === 'pending';

  // 检测是否为最终回答节点（LLM 最后一轮，不再调用工具）
  const md = span.metadata || {};
  const isFinalResponse = (md.is_final === true) || (span.output_data && span.output_data.is_final === true);

  // 步骤编号：使用传入的连续编号
  const stepNum = seqNum || (idx + 1);
  let stepName = span.step_name || span.title || '';
  const stepNameEn = span.step_name_en || span.type || '';
  const durationText = span.duration_ms ? `${Math.round(span.duration_ms)}ms` : '';
  const detail = span.detail || span.desc || '';

  // 最终回答节点追加标记
  if (isFinalResponse) {
    stepName += ' → 生成回复';
  }

  // ── 根据步骤类型选择样式 ──
  const typeStyles = {
    'content_review': { icon: '🛡️', color: 'purple', gradient: 'from-purple-500 to-violet-500' },
    'query_rewrite': { icon: '✏️', color: 'amber', gradient: 'from-amber-500 to-orange-500' },
    'user_input': { icon: '💬', color: 'blue', gradient: 'from-blue-500 to-cyan-500' },
    'context_build': { icon: '🧱', color: 'slate', gradient: 'from-slate-500 to-gray-500' },
    'middleware': { icon: '⚙️', color: 'gray', gradient: 'from-gray-400 to-slate-400' },
    'memory_retrieval': { icon: '🧠', color: 'pink', gradient: 'from-pink-500 to-rose-500' },
    'intent_analysis': { icon: '🎯', color: 'indigo', gradient: 'from-indigo-500 to-blue-500' },
    'llm_input': { icon: '📥', color: 'sky', gradient: 'from-sky-500 to-blue-500' },
    'llm_call': { icon: '⚡', color: 'violet', gradient: 'from-violet-500 to-purple-500' },
    'tool_call': { icon: '🔧', color: 'emerald', gradient: 'from-emerald-500 to-teal-500' },
    'hierarchical_search': { icon: '🔍', color: 'cyan', gradient: 'from-cyan-500 to-blue-500' },
    'memory_extract': { icon: '💾', color: 'rose', gradient: 'from-rose-500 to-pink-500' },
    'title_generation': { icon: '🏷️', color: 'teal', gradient: 'from-teal-500 to-cyan-500' },
    'response_complete': { icon: '✅', color: 'green', gradient: 'from-green-500 to-emerald-500' },
    'error': { icon: '❌', color: 'red', gradient: 'from-red-500 to-rose-500' },
  };
  const style = typeStyles[stepNameEn] || typeStyles[span.step_name_en] || { icon: '📌', color: 'gray', gradient: 'from-gray-500 to-slate-500' };

  // 状态指示
  const isSkipped = span.status === 'skipped';
  const statusDot = isSkipped
    ? `<span class="w-2 h-2 bg-gray-400 rounded-full ring-2 ring-gray-200"></span>`
    : isActive
    ? `<span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse-slow ring-4 ring-blue-100"></span>`
    : isComplete
    ? `<span class="w-2 h-2 bg-green-500 rounded-full ring-2 ring-green-100"></span>`
    : `<span class="w-2 h-2 bg-gray-300 rounded-full"></span>`;

  // 输入/输出
  const hasInputData = span.input_data && Object.keys(span.input_data).length > 0;
  const hasOutputData = span.output_data && Object.keys(span.output_data).length > 0;
  const hasLegacyInput = !hasInputData && span.input != null && span.input !== '';
  const hasLegacyOutput = !hasOutputData && span.output != null && span.output !== '';
  // 从 metadata 中提取输入输出（兜底）— md 已在函数顶部声明
  const hasMetaInput = !hasInputData && !hasLegacyInput && (md.input || md.query_used || md.tool_name || md.original_query || md.messages_to_llm);
  const hasMetaOutput = !hasOutputData && !hasLegacyOutput && (md.output || md.hit_count != null || md.task_type || md.rewritten_query || md.output_tokens);

  // 子节点
  let childrenHtml = '';
  if (span.children && span.children.length) {
    childrenHtml = '<div class="mt-2 space-y-1">';
    span.children.forEach(ch => {
      const dotColor = ch.status === 'complete' ? 'bg-green-400' : ch.status === 'active' ? 'bg-blue-400 animate-pulse' : 'bg-gray-300';
      childrenHtml += `
        <div class="flex items-center gap-2 text-[10px] px-2 py-1 bg-gray-50/50 rounded-md">
          <div class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0"></div>
          <span class="text-gray-600 truncate">${esc(ch.label)}</span>
          ${ch.duration_ms ? '<span class="text-gray-400 ml-auto shrink-0">' + ch.duration_ms + 'ms</span>' : ''}
        </div>`;
    });
    childrenHtml += '</div>';
  }

  // 输入参数
  let inputHtml = '';
  let inputVal = hasInputData ? span.input_data : (hasLegacyInput ? span.input : null);
  if (!inputVal && hasMetaInput) {
    // 从 metadata 构造输入数据
    inputVal = {};
    if (md.query_used) inputVal.query = md.query_used;
    if (md.original_query) inputVal.original_query = md.original_query;
    if (md.tool_name) inputVal.tool_name = md.tool_name;
    if (md.input) inputVal.arguments = md.input;
    if (md.messages_to_llm) inputVal.messages = md.messages_to_llm;
  }
  if (inputVal) {
    inputHtml = `
      <details class="text-[10px] mt-1.5">
        <summary class="cursor-pointer text-gray-400 hover:text-blue-600 font-medium flex items-center gap-1 transition-colors">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          输入参数
        </summary>
        <pre class="mt-1 bg-slate-50 border border-slate-100 rounded-lg p-2.5 overflow-x-auto text-slate-700 font-mono whitespace-pre-wrap max-h-40 overflow-y-auto text-[10px] custom-scrollbar leading-relaxed">${esc(formatDetailValue(inputVal))}</pre>
      </details>`;
  }

  // 输出结果
  let outputHtml = '';
  let outputVal = hasOutputData ? span.output_data : (hasLegacyOutput ? span.output : null);
  if (!outputVal && hasMetaOutput) {
    // 从 metadata 构造输出数据
    outputVal = {};
    if (md.output) outputVal.result = md.output;
    if (md.hit_count != null) outputVal.hit_count = md.hit_count;
    if (md.task_type) outputVal.task_type = md.task_type;
    if (md.rewritten_query) outputVal.rewritten_query = md.rewritten_query;
    if (md.output_tokens) outputVal.output_tokens = md.output_tokens;
    if (md.tool_calls) outputVal.tool_calls = md.tool_calls;
    if (md.matched_skills) outputVal.matched_skills = md.matched_skills;
  }
  if (outputVal) {
    outputHtml = `
      <details class="text-[10px] mt-1.5">
        <summary class="cursor-pointer text-gray-400 hover:text-green-600 font-medium flex items-center gap-1 transition-colors">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          输出结果
        </summary>
        <pre class="mt-1 bg-green-50/50 border border-green-100 rounded-lg p-2.5 overflow-x-auto text-slate-700 font-mono whitespace-pre-wrap max-h-40 overflow-y-auto text-[10px] custom-scrollbar leading-relaxed">${esc(formatDetailValue(outputVal))}</pre>
      </details>`;
  }

  // 最终回答节点的特殊样式
  const finalBadge = isFinalResponse
    ? '<span class="text-[8px] bg-green-100 text-green-700 font-bold px-1.5 py-0.5 rounded-full ml-1">FINAL</span>'
    : '';
  const skippedBadge = isSkipped
    ? '<span class="text-[8px] bg-gray-100 text-gray-500 font-bold px-1.5 py-0.5 rounded-full ml-1">SKIPPED</span>'
    : '';

  return `
    <details class="mb-1.5 group trace-node" ${isActive ? 'open' : ''}>
      <summary class="cursor-pointer rounded-xl px-3 py-2.5 flex items-center gap-3 transition-all list-none
        ${isFinalResponse ? 'bg-green-50/80 border border-green-200 shadow-sm' : isActive ? 'bg-blue-50/80 border border-blue-200 shadow-sm' : 'bg-white/80 border border-gray-100 hover:border-gray-200 hover:shadow-sm'}">
        <!-- 左侧：序号徽章 -->
        <div class="w-7 h-7 bg-gradient-to-br ${style.gradient} rounded-lg flex items-center justify-center text-white text-[10px] font-bold shadow-sm shrink-0">
          ${stepNum}
        </div>
        <!-- 中间：名称 + 状态 -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-[12px] font-semibold text-gray-800">${esc(stepName)}</span>
            ${finalBadge}
            ${skippedBadge}
            ${statusDot}
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[9px] text-gray-400 font-mono">${esc(stepNameEn)}</span>
            ${durationText ? `<span class="text-[9px] text-gray-400">· ${durationText}</span>` : ''}
          </div>
        </div>
        <!-- 右侧：时间 + 展开箭头 -->
        <div class="flex items-center gap-2 shrink-0">
          ${span.time ? `<span class="text-[9px] text-gray-400 font-mono">${esc(span.time)}</span>` : ''}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-300 group-open:rotate-90 transition-transform duration-200"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </summary>
      <!-- 展开内容 -->
      <div class="ml-3.5 mt-1 border-l-2 border-${style.color}-100 pl-4 pb-2 space-y-1.5">
        ${detail ? `<div class="text-[11px] text-gray-600 leading-relaxed py-1">${esc(detail)}</div>` : ''}
        ${_renderToolCallInfo(span)}
        ${childrenHtml}
        ${inputHtml}
        ${outputHtml}
      </div>
    </details>`;
}

function formatDetailValue(val) {
  if (val == null) return '';
  if (typeof val === 'string') {
    // 尝试美化 JSON 字符串
    const trimmed = val.trim();
    if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
      try { return JSON.stringify(JSON.parse(trimmed), null, 2); } catch(e) {}
    }
    return val;
  }
  try { return JSON.stringify(val, null, 2); } catch(e) { return String(val); }
}

function _renderToolCallInfo(span) {
  if (span.step_name_en !== 'tool_call' && !(span.step_name || '').includes('工具')) return '';
  const md = span.metadata || {};
  const toolName = md.display_name || md.tool_name || '';
  if (!toolName) return '';

  const isComplete = span.status === 'complete';
  const statusBg = isComplete ? 'bg-emerald-50 border-emerald-200' : 'bg-blue-50 border-blue-200';

  let html = `<div class="mt-2 border ${statusBg} rounded-xl p-3 text-[10px]">`;
  // 工具名称头部
  html += `<div class="flex items-center gap-2 mb-2">`;
  html += `<div class="w-6 h-6 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-lg flex items-center justify-center shadow-sm"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>`;
  html += `<span class="font-bold text-gray-800 text-[11px]">${esc(toolName)}</span>`;
  if (isComplete) html += `<span class="ml-auto text-emerald-600 font-bold text-[9px] bg-emerald-100 px-1.5 py-0.5 rounded-full">✓ 完成</span>`;
  else html += `<span class="ml-auto text-blue-600 font-bold text-[9px] bg-blue-100 px-1.5 py-0.5 rounded-full animate-pulse-slow">执行中</span>`;
  if (span.duration_ms) html += `<span class="text-gray-400 text-[9px]">${Math.round(span.duration_ms)}ms</span>`;
  html += `</div>`;

  // 输入参数摘要
  const input = md.input || (span.input_data && span.input_data.arguments) || '';
  if (input) {
    let inputPreview = '';
    try {
      const parsed = JSON.parse(input);
      const entries = Object.entries(parsed).slice(0, 5);
      inputPreview = entries.map(([k, v]) => {
        const val = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `<span class="text-gray-400">${esc(k)}:</span> <span class="text-gray-700">${esc(truncStr(val, 40))}</span>`;
      }).join('<span class="text-gray-300 mx-1">|</span>');
    } catch(e) {
      inputPreview = `<span class="text-gray-700">${esc(truncStr(String(input), 100))}</span>`;
    }
    html += `<div class="bg-white/60 rounded-lg px-2.5 py-1.5 border border-gray-100 mb-1.5"><span class="text-gray-400 mr-1">📥</span>${inputPreview}</div>`;
  }

  // 输出摘要
  const output = md.output || (span.output_data && span.output_data.result) || '';
  if (output && isComplete) {
    html += `<div class="bg-white/60 rounded-lg px-2.5 py-1.5 border border-gray-100"><span class="text-gray-400 mr-1">📤</span><span class="text-gray-700">${esc(truncStr(String(output), 120))}</span></div>`;
  }

  html += `</div>`;
  return html;
}

function refreshTrace() {
  const el = document.getElementById('traceContent');

  // ── 阶段定义（用于在阶段切换时插入分隔标题） ──
  const PHASE_MAP = {
    'content_review': { id: 'entry', label: '入口预处理', labelEn: 'Preprocessing', icon: '🚀' },
    'content_review_input': { id: 'entry', label: '入口预处理', labelEn: 'Preprocessing', icon: '🚀' },
    'content_review_output': { id: 'entry', label: '入口预处理', labelEn: 'Preprocessing', icon: '🚀' },
    'query_rewrite': { id: 'entry', label: '入口预处理', labelEn: 'Preprocessing', icon: '🚀' },
    'title_generation': { id: 'entry', label: '入口预处理', labelEn: 'Preprocessing', icon: '🚀' },
    'context_build': { id: 'context', label: '上下文准备', labelEn: 'Context Build', icon: '📦' },
    'memory_retrieval': { id: 'context', label: '上下文准备', labelEn: 'Context Build', icon: '📦' },
    'user_input': { id: 'context', label: '上下文准备', labelEn: 'Context Build', icon: '📦' },
    'middleware': { id: 'context', label: '上下文准备', labelEn: 'Context Build', icon: '📦' },
    'intent_analysis': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'llm_input': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'llm_call': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'tool_call': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'clarification': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'hierarchical_search': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'error': { id: 'reasoning', label: '模型推理', labelEn: 'Agent Loop', icon: '⚡' },
    'memory_extract': { id: 'post', label: '后处理', labelEn: 'Post Process', icon: '💾' },
    'response_complete': { id: 'post', label: '后处理', labelEn: 'Post Process', icon: '💾' },
  };

  function getPhase(span) {
    const typeKey = span.step_name_en || span.type || '';
    const typeKey2 = span.type || '';
    // 中间件 span 根据 metadata.phase 判断
    if (typeKey === 'middleware' || typeKey2 === 'middleware') {
      const mwPhase = (span.metadata && span.metadata.phase) || '';
      if (mwPhase === 'after_agent') return { id: 'post', label: '后处理', labelEn: 'Post Process', icon: '💾' };
      return PHASE_MAP['middleware'];
    }
    return PHASE_MAP[typeKey] || PHASE_MAP[typeKey2] || null;
  }

  // 严格按到达顺序渲染，在阶段切换时插入分隔标题
  // Agent Loop 阶段内部按循环编号分组
  let html = '';
  let seqNum = 0;
  let currentPhaseId = null;
  let currentLoopNum = 0;  // 当前循环编号（Agent Loop 内部）

  // 内部调试 span，不作为独立节点显示（信息已合并到 llm_call 节点中）
  const HIDDEN_SPAN_TYPES = new Set(['llm_input', 'intent_analysis', 'context_build']);

  // 预扫描：统计 Agent Loop 中有多少轮 LLM 调用（判断是否多轮）
  const totalLlmCalls = liveSpans.filter(s => {
    const en = s.step_name_en || s.type || '';
    return en === 'llm_call' || (s.title && s.title.includes('思考'));
  }).length;
  const isMultiLoop = totalLlmCalls > 1;
  let llmCallCount = 0;

  for (const s of liveSpans) {
    const phase = getPhase(s);
    const phaseId = phase ? phase.id : '__unknown__';

    // 阶段切换时插入分隔标题
    if (phaseId !== currentPhaseId) {
      // 关闭上一个循环容器
      if (currentPhaseId === 'reasoning' && currentLoopNum > 0) {
        html += '</div>';
      }
      // 关闭上一个阶段的容器
      if (currentPhaseId !== null) {
        html += '</div></div>';
      }
      currentPhaseId = phaseId;
      currentLoopNum = 0;
      llmCallCount = 0;

      const phaseLabel = phase ? phase.label : '其他';
      const phaseLabelEn = phase ? phase.labelEn : '';
      const phaseIcon = phase ? phase.icon : '📌';

      html += `
        <div class="mb-3">
          <div class="flex items-center gap-2 px-2 py-1.5 mb-1">
            <span class="text-[11px]">${phaseIcon}</span>
            <span class="text-[10px] font-bold text-gray-500 tracking-wider">${phaseLabel}</span>
            <span class="text-[9px] text-gray-300 font-mono">${phaseLabelEn}</span>
            <div class="flex-1 h-px bg-gray-100 ml-2"></div>
          </div>
          <div class="space-y-1 pl-1">`;

      // 多轮对话：进入 reasoning 阶段时立即开始第 1 轮容器
      if (phaseId === 'reasoning' && isMultiLoop) {
        currentLoopNum = 1;
        html += `
          <div class="ml-1 mb-2 border-l-2 border-violet-200 pl-3">
            <div class="text-[9px] font-bold text-violet-500 mb-1">第 1 轮</div>`;
      }
    }

    // 多轮 Agent Loop：第 2+ 个 LLM 调用开始新循环
    if (currentPhaseId === 'reasoning' && isMultiLoop) {
      const stepEn = s.step_name_en || s.type || '';
      const isLlmCall = stepEn === 'llm_call' || (s.title && s.title.includes('思考'));

      if (isLlmCall) {
        llmCallCount++;
        if (llmCallCount > 1) {
          // 关闭上一轮，开始新一轮
          html += '</div>';
          currentLoopNum++;
          const isFinal = s.metadata && s.metadata.is_final;
          const loopBadge = isFinal ? ' <span class=\"text-[8px] bg-green-100 text-green-600 px-1.5 py-0.5 rounded-full font-bold\">FINAL</span>' : '';
          html += `
            <div class="ml-1 mb-2 border-l-2 border-violet-200 pl-3">
              <div class="text-[9px] font-bold text-violet-500 mb-1">第 ${currentLoopNum} 轮${loopBadge}</div>`;
        }
      }
    }

    seqNum++;
    html += renderTraceNode(s, seqNum - 1, seqNum);
  }

  // 关闭最后的循环容器
  if (currentPhaseId === 'reasoning' && currentLoopNum > 0) {
    html += '</div>';
  }
  // 关闭最后一个阶段容器
  if (currentPhaseId !== null) {
    html += '</div></div>';
  }

  el.innerHTML = html;
}

function updateDocsPanel(generated, refs) {

// ═══ 文档检测与预览 ═══

function detectDocument(content) {
  // 检测是否是报告/文档格式
  if (!content || content.length < 400) return null;

  // 排除短文本模板类（请假条、邮件、通知等 — 通常 < 1000 字且只有 1-2 个标题）
  const isTemplate = /请假条|通知书|邮件|备忘录|会议纪要/.test(content.slice(0, 100));
  if (isTemplate && content.length < 1200) return null;

  // 统计标题数量
  const mdHeadings = (content.match(/^#{1,3}\s+.+/gm) || []).length;
  const cnHeadings = (content.match(/^[一二三四五六七八九十]+[、.]\s*.+/gm) || []).length;
  const totalHeadings = mdHeadings + cnHeadings;

  // 判断条件：
  // - 长文本（>= 800字）+ 2个以上标题 → 文档
  // - 中等文本（400-800字）+ 3个以上标题 → 文档
  const isDoc = (content.length >= 800 && totalHeadings >= 2) ||
                (content.length >= 400 && totalHeadings >= 3);
  if (!isDoc) return null;

  // 提取标题
  let title = '分析报告';
  const h1Match = content.match(/^#\s+(.+)/m);
  if (h1Match) {
    title = h1Match[1].trim().replace(/^[《]|[》]$/g, '');
  } else {
    const firstLine = content.trim().split('\n')[0].replace(/^#+\s*/, '').trim();
    if (firstLine.length > 2 && firstLine.length < 50) title = firstLine.replace(/^[《]|[》]$/g, '');
  }
  return { title };
}

function openDocPreview(docId) {
  const doc = generatedDocs.find(d => d.id === docId);
  if (!doc) return;

  currentPreviewDoc = doc;

  // 切换到参考上下文 tab
  switchTab('docs');

  // 打开右侧面板（如果关闭了）
  if (!isRightPanelOpen) openRightPanel();

  // 显示文档预览模式
  document.getElementById('docListMode').classList.add('hidden');
  document.getElementById('docPreviewMode').classList.remove('hidden');
  document.getElementById('docPreviewTitle').textContent = doc.title + '.md';

  // 渲染 markdown 全文
  const rendered = typeof marked !== 'undefined' ? marked.parse(doc.content) : esc(doc.content);
  document.getElementById('docPreviewContent').innerHTML = rendered;
}

function closeDocPreview() {
  currentPreviewDoc = null;
  document.getElementById('docPreviewMode').classList.add('hidden');
  document.getElementById('docListMode').classList.remove('hidden');
}

function downloadCurrentDoc() {
  if (!currentPreviewDoc) return;
  const blob = new Blob([currentPreviewDoc.content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (currentPreviewDoc.title || '报告') + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let stepsContainer = null; // 当前消息的步骤容器

function createStepsContainer() {
  const inner = document.getElementById('chatInner');
  const div = document.createElement('div');
  div.className = 'ml-12 mb-2 animate-fade-in';
  div.innerHTML = '<div class="steps-list space-y-1"></div>';
  inner.appendChild(div);
  stepsContainer = div.querySelector('.steps-list');
  scrollToBottom();
  return stepsContainer;
}

function addStep(label, status) {
  if (!stepsContainer) createStepsContainer();
  const dotClass = status === 'done' ? 'bg-green-500' :
                   status === 'run' ? 'bg-blue-500 animate-pulse' :
                   status === 'err' ? 'bg-red-500' : 'bg-gray-300';
  const id = 'step-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
  stepsContainer.insertAdjacentHTML('beforeend', `
    <div id="${id}" class="flex items-center gap-2 py-0.5 text-xs text-gray-500">
      <div class="w-1.5 h-1.5 rounded-full ${dotClass} shrink-0"></div>
      <span>${esc(label)}</span>
      <span class="step-dur text-[10px] text-gray-300 ml-auto"></span>
    </div>`);
  scrollToBottom();
  return id;
}

function updateStep(id, status, durMs) {
  const el = document.getElementById(id);
  if (!el) return;
  const dot = el.querySelector('div');
  dot.className = 'w-1.5 h-1.5 rounded-full shrink-0 ' +
    (status === 'done' ? 'bg-green-500' : status === 'err' ? 'bg-red-500' : 'bg-blue-500 animate-pulse');
  if (durMs != null) {
    const durEl = el.querySelector('.step-dur');
    if (durEl) durEl.textContent = durMs + 'ms';
  }
}
