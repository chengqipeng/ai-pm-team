<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存档检索评测 — DeepAgent</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; background: #f8fafc; }
@keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.25s ease-out; }
.case-row:hover { background: #f0f9ff; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-white/80 backdrop-blur-md border-b border-gray-200/50 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 text-gray-900 no-underline">
        <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-cyan-600 rounded-lg flex items-center justify-center">
          <span class="text-white text-sm">📦</span>
        </div>
        <span class="font-bold text-sm">DeepAgent</span>
      </a>
      <span class="text-gray-300 mx-1">/</span>
      <span class="text-sm font-semibold text-gray-700">存档检索评测</span>
    </div>
    <nav class="flex items-center gap-1">
      <a href="/" class="px-3 py-1.5 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg no-underline">对话</a>
      <a href="/eval/tools" class="px-3 py-1.5 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg no-underline">Tool评测</a>
      <a href="/eval/memory" class="px-3 py-1.5 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg no-underline">Memory评测</a>
      <a href="/eval/archive-recall" class="px-3 py-1.5 text-xs font-medium text-blue-600 bg-blue-50 rounded-lg no-underline">存档检索</a>
    </nav>
  </div>
</header>

<div class="max-w-7xl mx-auto px-6 py-6">

  <!-- 标题 -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-cyan-600 rounded-xl flex items-center justify-center shadow-md">
        <span class="text-white text-xl">🔍</span>
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900">上下文存档检索评测</h1>
        <p id="subtitle" class="text-xs text-gray-400 mt-0.5">250 场景 · LLM Query Rewrite + VDB hybrid_search</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="syncSeed()" id="syncBtn" class="px-4 py-2 bg-gray-100 text-gray-700 text-xs font-medium rounded-lg hover:bg-gray-200 border border-gray-200">
        📥 初始化VDB
      </button>
      <button onclick="runEval()" id="runBtn" class="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 shadow-sm flex items-center gap-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        执行评测
      </button>
    </div>
  </div>

  <!-- 统计卡片 -->
  <div id="statsBar" class="hidden mb-5 animate-fade-in">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-6 flex-wrap">
      <div><span class="text-[10px] text-gray-400 block">Pass Rate</span><span id="statRate" class="text-lg font-bold text-green-600">—</span></div>
      <div><span class="text-[10px] text-gray-400 block">通过</span><span id="statPassed" class="text-lg font-bold text-green-600">—</span></div>
      <div><span class="text-[10px] text-gray-400 block">失败</span><span id="statFailed" class="text-lg font-bold text-red-500">—</span></div>
      <div><span class="text-[10px] text-gray-400 block">Rewrite准确率</span><span id="statRewrite" class="text-lg font-bold text-purple-600">—</span></div>
      <div><span class="text-[10px] text-gray-400 block">平均Recall</span><span id="statRecall" class="text-lg font-bold text-indigo-600">—</span></div>
      <div><span class="text-[10px] text-gray-400 block">平均Precision</span><span id="statPrecision" class="text-lg font-bold text-cyan-600">—</span></div>
    </div>
  </div>

  <!-- 进度条 -->
  <div id="progressBar" class="hidden mb-5 animate-fade-in">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <span id="progressLabel" class="text-xs font-semibold text-gray-700">执行中...</span>
        </div>
        <span id="progressCount" class="text-xs text-gray-400">0 / 200</span>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
        <div id="progressFill" class="h-full rounded-full transition-all duration-200" style="width:0%;background:linear-gradient(90deg,#3b82f6,#10b981)"></div>
      </div>
    </div>
  </div>

  <!-- 分类筛选 -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm mb-5 p-4">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-[10px] text-gray-400 font-medium">分类:</span>
      <button onclick="filterCat('')" class="cat-btn active px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="">全部</button>
      <button onclick="filterCat('代词消解')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="代词消解">代词消解</button>
      <button onclick="filterCat('意图关键词')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="意图关键词">意图关键词</button>
      <button onclick="filterCat('实体精确')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="实体精确">实体精确</button>
      <button onclick="filterCat('工具检索')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="工具检索">工具检索</button>
      <button onclick="filterCat('变更追踪')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="变更追踪">变更追踪</button>
      <button onclick="filterCat('模糊语义')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="模糊语义">模糊语义</button>
      <button onclick="filterCat('负例')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="负例">负例</button>
      <button onclick="filterCat('跨任务')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="跨任务">跨任务</button>
      <button onclick="filterCat('多工具区分')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="多工具区分">多工具区分</button>
      <button onclick="filterCat('时序过滤')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="时序过滤">时序过滤</button>
      <button onclick="filterCat('边界负例')" class="cat-btn px-3 py-1 text-xs rounded-lg border border-gray-200" data-cat="边界负例">边界负例</button>
    </div>
    <div class="flex items-center gap-2 mt-3">
      <span class="text-[10px] text-gray-400 font-medium">结果:</span>
      <button onclick="filterResult('all')" class="res-btn active px-3 py-1 text-xs rounded-lg border border-gray-200" data-r="all">全部</button>
      <button onclick="filterResult('passed')" class="res-btn px-3 py-1 text-xs rounded-lg border border-gray-200 text-green-600" data-r="passed">✓通过</button>
      <button onclick="filterResult('failed')" class="res-btn px-3 py-1 text-xs rounded-lg border border-gray-200 text-red-600" data-r="failed">✗失败</button>
      <span id="countLabel" class="ml-auto text-xs text-gray-400"></span>
    </div>
  </div>

  <!-- 用例列表 -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <div id="caseList" class="divide-y divide-gray-100 max-h-[600px] overflow-auto">
      <div class="p-8 text-center text-gray-400 text-sm">点击「执行评测」开始</div>
    </div>
  </div>
</div>

<script>
const API = '/api/eval/archive-recall';
let allResults = [];
let currentCat = '';
let currentRes = 'all';

async function syncSeed() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true; btn.textContent = '同步中...';
  try {
    const res = await fetch(`${API}/sync-seed`, {method:'POST'});
    const data = await res.json();
    if (res.ok) {
      btn.textContent = `✓ 已同步 ${data.synced} 条`;
      setTimeout(() => { btn.textContent = '📥 初始化VDB'; btn.disabled = false; }, 3000);
    } else {
      btn.textContent = '❌ 失败'; btn.disabled = false;
      alert(data.detail || '同步失败');
    }
  } catch(e) { btn.textContent = '❌ 网络错误'; btn.disabled = false; }
}

async function runEval() {
  const btn = document.getElementById('runBtn');
  const useRealVdb = true;
  btn.disabled = true; btn.textContent = '执行中...';
  document.getElementById('progressBar').classList.remove('hidden');
  document.getElementById('statsBar').classList.add('hidden');
  allResults = [];
  renderList();

  try {
    const res = await fetch(`${API}/run-stream`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({categories: currentCat ? [currentCat] : [], use_real_vdb: useRealVdb})
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        if (data.type === 'progress') {
          allResults.push(data.result);
          updateProgress(data.index, data.total, data.passed, data.failed);
        } else if (data.type === 'complete') {
          showStats(data);
        }
      }
    }
  } catch(e) {
    console.error(e);
  }
  btn.disabled = false; btn.textContent = '执行评测';
  document.getElementById('progressBar').classList.add('hidden');
  renderList();
}

function updateProgress(idx, total, passed, failed) {
  document.getElementById('progressCount').textContent = `${idx} / ${total}`;
  document.getElementById('progressFill').style.width = `${(idx/total*100).toFixed(1)}%`;
  document.getElementById('progressLabel').textContent = `已执行 ${idx}/${total}（✓${passed} ✗${failed}）`;
}

function showStats(data) {
  document.getElementById('statsBar').classList.remove('hidden');
  document.getElementById('statRate').textContent = `${(data.pass_rate*100).toFixed(1)}%`;
  document.getElementById('statPassed').textContent = data.passed;
  document.getElementById('statFailed').textContent = data.failed;
  document.getElementById('statRewrite').textContent = `${(data.rewrite_accuracy*100).toFixed(1)}%`;
  document.getElementById('statRecall').textContent = `${(data.avg_recall*100).toFixed(1)}%`;
  document.getElementById('statPrecision').textContent = `${(data.avg_precision*100).toFixed(1)}%`;
}

function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.querySelectorAll('.cat-btn.active').forEach(b => { b.style.background='#dbeafe'; b.style.color='#1d4ed8'; });
  document.querySelectorAll('.cat-btn:not(.active)').forEach(b => { b.style.background=''; b.style.color=''; });
  renderList();
}

function filterResult(r) {
  currentRes = r;
  document.querySelectorAll('.res-btn').forEach(b => b.classList.toggle('active', b.dataset.r === r));
  renderList();
}

function renderList() {
  let filtered = allResults;
  if (currentCat) filtered = filtered.filter(r => r.category === currentCat);
  if (currentRes === 'passed') filtered = filtered.filter(r => r.passed);
  if (currentRes === 'failed') filtered = filtered.filter(r => !r.passed);

  document.getElementById('countLabel').textContent = `${filtered.length} 条`;

  if (!filtered.length) {
    document.getElementById('caseList').innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">无结果</div>';
    return;
  }

  const html = filtered.map(r => {
    const icon = r.passed ? '✅' : '❌';
    const rwIcon = r.rewrite_passed ? '✓' : '✗';
    const rcIcon = r.recall_passed ? '✓' : '✗';
    const intentBadge = r.detected_intent ? `<span class="px-1.5 py-0.5 bg-purple-50 text-purple-600 rounded text-[10px]">${r.detected_intent}</span>` : '';
    const hitStr = r.hit_turn_ids.length ? r.hit_turn_ids.slice(0,6).join(',') : '无';
    const expStr = r.expected_turn_ids.length ? r.expected_turn_ids.join(',') : '-';

    return `
      <div class="case-row px-4 py-3 flex items-start gap-3 cursor-pointer" onclick="this.querySelector('.detail').classList.toggle('hidden')">
        <span class="text-sm mt-0.5">${icon}</span>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-xs font-mono text-gray-400">${r.case_id}</span>
            <span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px]">${r.category}</span>
            ${intentBadge}
          </div>
          <div class="text-sm text-gray-800 mt-1 truncate">${r.query}</div>
          <div class="text-[11px] text-gray-400 mt-1">
            改写<span class="${r.rewrite_passed?'text-green-600':'text-red-500'}">${rwIcon}</span>
            · 检索<span class="${r.recall_passed?'text-green-600':'text-red-500'}">${rcIcon}</span>
            · R=${(r.recall_at_k*100).toFixed(0)}%
            · 命中[${hitStr}] 期望[${expStr}]
          </div>
          <div class="detail hidden mt-2 p-2 bg-gray-50 rounded text-[11px] text-gray-600 font-mono whitespace-pre-wrap">改写后: ${r.rewritten_query}\n关键词: ${(r.extracted_keywords||[]).join(', ')}\n实体: ${(r.extracted_entities||[]).join(', ')}\n意图: ${r.detected_intent||''}\n${r.score_details&&r.score_details.length ? 'Scores: '+r.score_details.map(s=>'t'+s.turn_id+'='+s.score).join(' '):''}${r.detail?'\n'+r.detail:''}${r.error?'\nError: '+r.error:''}</div>
        </div>
        <span class="text-[10px] text-gray-300">${r.duration_ms.toFixed(0)}ms</span>
      </div>`;
  }).join('');
  document.getElementById('caseList').innerHTML = html;
}

// 页面加载时获取最新结果
(async function() {
  try {
    const res = await fetch(`${API}/reports/latest-results`);
    const data = await res.json();
    if (data.results && data.results.length) {
      allResults = data.results;
      renderList();
      // 计算统计
      const n = allResults.length;
      const passed = allResults.filter(r=>r.passed).length;
      showStats({
        pass_rate: passed/n,
        passed, failed: n-passed,
        rewrite_accuracy: allResults.filter(r=>r.rewrite_passed).length/n,
        avg_recall: allResults.reduce((s,r)=>s+r.recall_at_k,0)/n,
        avg_precision: allResults.reduce((s,r)=>s+r.precision_at_k,0)/n,
      });
    }
  } catch(e) {}
})();
</script>
</body>
</html>
