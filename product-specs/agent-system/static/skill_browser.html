<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill 技能管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .fade-in { animation: fadeIn 0.2s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .prompt-content { max-height: 500px; overflow-y: auto; }
  .prompt-content h1,.prompt-content h2,.prompt-content h3 { font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
  .prompt-content h2 { font-size: 1.1em; color: #1e40af; }
  .prompt-content h3 { font-size: 1em; color: #4338ca; }
  .prompt-content ul,.prompt-content ol { padding-left: 1.5em; margin: 0.5em 0; }
  .prompt-content li { margin: 0.25em 0; }
  .prompt-content code { background: #f1f5f9; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.9em; }
  .prompt-content pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.75em; overflow-x: auto; margin: 0.5em 0; }
  .prompt-content table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
  .prompt-content th,.prompt-content td { border: 1px solid #e2e8f0; padding: 0.4em 0.6em; text-align: left; font-size: 0.85em; }
  .prompt-content th { background: #f8fafc; font-weight: 600; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 顶部导航 -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-xl">⚡</span>
      <h1 class="text-lg font-semibold text-gray-800">Skill 技能管理</h1>
      <span id="skillCount" class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium">0</span>
    </div>
    <div class="flex items-center gap-3">
      <input id="searchInput" type="text" placeholder="搜索技能名称 / 描述..."
             class="w-64 px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200">
      <select id="statusFilter" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:outline-none">
        <option value="">全部状态</option>
        <option value="published">已发布</option>
        <option value="draft">草稿</option>
        <option value="deprecated">已废弃</option>
      </select>
      <a href="/" class="text-sm text-gray-500 hover:text-blue-600">← 返回对话</a>
    </div>
  </div>
</header>

<!-- 主体：左列表 + 右详情 -->
<div class="max-w-7xl mx-auto px-6 py-6 flex gap-6" style="height: calc(100vh - 60px);">

  <!-- 左侧列表 -->
  <div class="w-[380px] flex-shrink-0 overflow-y-auto">
    <div id="skillList" class="space-y-2"></div>
    <div id="emptyState" class="hidden text-center py-12 text-gray-400 text-sm">
      暂无技能数据
    </div>
  </div>

  <!-- 右侧详情 -->
  <div class="flex-1 overflow-y-auto">
    <div id="detailPanel" class="hidden fade-in">
      <!-- 头部 -->
      <div class="bg-white rounded-xl border border-gray-200 p-5 mb-4">
        <div class="flex items-start justify-between">
          <div>
            <h2 id="detailName" class="text-xl font-bold text-gray-800"></h2>
            <p id="detailDesc" class="text-sm text-gray-500 mt-1"></p>
          </div>
          <div class="flex gap-2">
            <span id="detailStatus" class="px-2 py-0.5 rounded text-xs font-medium"></span>
            <span id="detailContext" class="px-2 py-0.5 rounded text-xs font-medium bg-purple-50 text-purple-700"></span>
          </div>
        </div>
        <!-- 元信息 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 pt-4 border-t border-gray-100">
          <div><span class="text-[10px] text-gray-400 uppercase">版本</span><p id="detailVersion" class="text-sm font-medium text-gray-700"></p></div>
          <div><span class="text-[10px] text-gray-400 uppercase">Owner</span><p id="detailOwner" class="text-sm font-medium text-gray-700"></p></div>
          <div><span class="text-[10px] text-gray-400 uppercase">风险等级</span><p id="detailRisk" class="text-sm font-medium text-gray-700"></p></div>
          <div><span class="text-[10px] text-gray-400 uppercase">超时</span><p id="detailTimeout" class="text-sm font-medium text-gray-700"></p></div>
        </div>
        <!-- 统计 -->
        <div class="grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-gray-100">
          <div class="text-center"><span class="text-lg font-bold text-blue-600" id="detailExecCount">0</span><p class="text-[10px] text-gray-400">执行次数</p></div>
          <div class="text-center"><span class="text-lg font-bold text-green-600" id="detailSuccessRate">-</span><p class="text-[10px] text-gray-400">成功率</p></div>
          <div class="text-center"><span class="text-lg font-bold text-amber-600" id="detailAvgDuration">-</span><p class="text-[10px] text-gray-400">平均耗时</p></div>
        </div>
      </div>

      <!-- 参数 & 工具 -->
      <div class="bg-white rounded-xl border border-gray-200 p-5 mb-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-3">参数 & 工具</h3>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <span class="text-[10px] text-gray-400 uppercase">Arguments</span>
            <div id="detailArgs" class="mt-1 flex flex-wrap gap-1"></div>
          </div>
          <div>
            <span class="text-[10px] text-gray-400 uppercase">Allowed Tools</span>
            <div id="detailTools" class="mt-1 flex flex-wrap gap-1"></div>
          </div>
        </div>
        <div class="mt-3">
          <span class="text-[10px] text-gray-400 uppercase">触发关键词 (when_to_use)</span>
          <p id="detailWhenToUse" class="text-sm text-gray-600 mt-1"></p>
        </div>
      </div>

      <!-- Prompt 全文 -->
      <div class="bg-white rounded-xl border border-gray-200 p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-gray-700">Prompt 定义</h3>
          <button onclick="copyPrompt()" class="text-xs text-blue-600 hover:text-blue-800">📋 复制</button>
        </div>
        <div id="detailPrompt" class="prompt-content text-sm text-gray-700 leading-relaxed"></div>
      </div>

      <!-- 版本历史 -->
      <div class="bg-white rounded-xl border border-gray-200 p-5">
        <h3 class="text-sm font-semibold text-gray-700 mb-3">版本历史</h3>
        <div id="detailVersions" class="space-y-2 text-sm"></div>
      </div>
    </div>

    <!-- 空状态 -->
    <div id="detailEmpty" class="flex items-center justify-center h-full text-gray-400 text-sm">
      ← 选择一个技能查看详情
    </div>
  </div>
</div>

<script>
const API = '/api/skills';
let allSkills = [];
let currentApiKey = null;
let currentPromptRaw = '';

// ── 加载列表 ──
async function loadSkills() {
  const keyword = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('statusFilter').value;
  const params = new URLSearchParams();
  if (keyword) params.set('keyword', keyword);
  if (status) params.set('status', status);
  const res = await fetch(`${API}?${params}`);
  allSkills = await res.json();
  renderList();
}

function renderList() {
  const container = document.getElementById('skillList');
  const empty = document.getElementById('emptyState');
  document.getElementById('skillCount').textContent = allSkills.length;

  if (!allSkills.length) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  container.innerHTML = allSkills.map(s => `
    <div class="bg-white rounded-lg border ${currentApiKey === s.api_key ? 'border-blue-400 ring-2 ring-blue-100' : 'border-gray-200 hover:border-gray-300'} p-3 cursor-pointer transition-all"
         onclick="selectSkill('${s.api_key}')">
      <div class="flex items-center justify-between">
        <span class="font-medium text-sm text-gray-800">${esc(s.api_key)}</span>
        <div class="flex gap-1">
          ${statusBadge(s.status)}
          ${contextBadge(s.context)}
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-1 line-clamp-2">${esc(s.description)}</p>
      <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
        <span>v${s.version}</span>
        <span>${s.exec_count} 次执行</span>
        ${s.owner ? `<span>by ${esc(s.owner)}</span>` : ''}
      </div>
    </div>
  `).join('');
}

// ── 选中详情 ──
async function selectSkill(apiKey) {
  currentApiKey = apiKey;
  renderList();

  const [detail, versions] = await Promise.all([
    fetch(`${API}/${apiKey}`).then(r => r.json()),
    fetch(`${API}/${apiKey}/versions`).then(r => r.json()),
  ]);

  document.getElementById('detailEmpty').classList.add('hidden');
  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');

  document.getElementById('detailName').textContent = detail.api_key;
  document.getElementById('detailDesc').textContent = detail.description;
  document.getElementById('detailVersion').textContent = 'v' + detail.version;
  document.getElementById('detailOwner').textContent = detail.owner || '-';
  document.getElementById('detailRisk').textContent = riskLabel(detail.risk_level);
  document.getElementById('detailTimeout').textContent = (detail.timeout_ms / 1000) + 's';
  document.getElementById('detailExecCount').textContent = detail.exec_count;
  document.getElementById('detailSuccessRate').textContent = detail.exec_count > 0
    ? Math.round(detail.success_count / detail.exec_count * 100) + '%' : '-';
  document.getElementById('detailAvgDuration').textContent = detail.avg_duration_ms > 0
    ? (detail.avg_duration_ms / 1000).toFixed(1) + 's' : '-';

  // Status badge
  const statusEl = document.getElementById('detailStatus');
  statusEl.textContent = detail.status;
  statusEl.className = `px-2 py-0.5 rounded text-xs font-medium ${statusClass(detail.status)}`;

  // Context badge
  document.getElementById('detailContext').textContent = detail.context;

  // Args & Tools
  document.getElementById('detailArgs').innerHTML = (detail.arguments || [])
    .map(a => `<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs">{${esc(a)}}</span>`).join('') || '<span class="text-gray-400 text-xs">无</span>';
  document.getElementById('detailTools').innerHTML = (detail.allowed_tools || [])
    .map(t => `<span class="px-2 py-0.5 bg-amber-50 text-amber-700 rounded text-xs">${esc(t)}</span>`).join('') || '<span class="text-gray-400 text-xs">无</span>';

  // When to use
  document.getElementById('detailWhenToUse').textContent = detail.when_to_use || '-';

  // Prompt (rendered as Markdown)
  currentPromptRaw = detail.prompt || '';
  document.getElementById('detailPrompt').innerHTML = marked.parse(currentPromptRaw);

  // Versions
  const versionsEl = document.getElementById('detailVersions');
  if (versions.length) {
    versionsEl.innerHTML = versions.map(v => `
      <div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
        <div>
          <span class="font-medium text-gray-700">v${esc(v.version)}</span>
          <span class="text-gray-400 ml-2">${esc(v.changelog || '')}</span>
        </div>
        <span class="text-[10px] text-gray-400">${formatTime(v.created_at)}</span>
      </div>
    `).join('');
  } else {
    versionsEl.innerHTML = '<span class="text-gray-400 text-xs">暂无版本记录</span>';
  }
}

// ── 工具函数 ──
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function statusBadge(s) {
  return `<span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${statusClass(s)}">${s}</span>`;
}
function statusClass(s) {
  if (s === 'published') return 'bg-green-50 text-green-700';
  if (s === 'draft') return 'bg-gray-100 text-gray-600';
  return 'bg-red-50 text-red-600';
}
function contextBadge(c) {
  const cls = c === 'fork' ? 'bg-purple-50 text-purple-700' : 'bg-indigo-50 text-indigo-700';
  return `<span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${cls}">${c}</span>`;
}
function riskLabel(r) {
  if (r === 'read_only') return '🟢 只读';
  if (r === 'mutating') return '🟡 可变';
  return '🔴 破坏性';
}
function formatTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function copyPrompt() {
  navigator.clipboard.writeText(currentPromptRaw).then(() => {
    alert('已复制 Prompt 到剪贴板');
  });
}

// ── 事件绑定 ──
let searchTimer;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadSkills, 300);
});
document.getElementById('statusFilter').addEventListener('change', loadSkills);

// ── 初始化 ──
loadSkills();
</script>
</body>
</html>
