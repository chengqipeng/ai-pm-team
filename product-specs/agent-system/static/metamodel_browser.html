<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元模型 & 元数据 - DeepAgent AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.25s ease-out; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; }
.chip-blue { background: #eff6ff; color: #1d4ed8; }
.chip-green { background: #ecfdf5; color: #047857; }
.chip-orange { background: #fff7ed; color: #c2410c; }
.chip-purple { background: #faf5ff; color: #7e22ce; }
.chip-gray { background: #f1f5f9; color: #475569; }
.chip-red { background: #fef2f2; color: #b91c1c; }

/* 二级 Tab —— 详情内的分组 */
.tab-secondary {
  padding: 6px 12px; font-size: 12px; font-weight: 700; color: #64748b;
  border-radius: 8px; cursor: pointer; transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-secondary:hover { background: #f1f5f9; color: #1e293b; }
.tab-secondary.active { background: linear-gradient(to right, #4f46e5, #2563eb); color: white; box-shadow: 0 6px 12px -4px rgba(79,70,229,0.35); }
.tab-secondary .count { font-size: 10px; padding: 1px 6px; border-radius: 9999px; background: rgba(100,116,139,0.12); }
.tab-secondary.active .count { background: rgba(255,255,255,0.2); color: white; }
</style>
</head>
<body>
<div class="flex h-screen w-full bg-[#f4f7fb] font-sans text-slate-800 overflow-hidden relative">
  <!-- 氛围背景 -->
  <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-indigo-400/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- 左侧 —— 列表 -->
  <aside class="w-80 flex flex-col z-20 shrink-0 bg-white/40 backdrop-blur-xl border-r border-gray-200/50">
    <div class="p-6 shrink-0">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-9 h-9 bg-gradient-to-br from-indigo-600 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/20">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div>
          <div class="font-bold text-lg tracking-tight text-gray-900">元模型浏览</div>
          <div class="text-[10px] text-gray-400">paas-metarepo · 三层架构</div>
        </div>
      </div>

      <!-- 左侧 Tab —— 元模型 / 业务对象 / 业务数据 -->
      <div class="flex p-1 bg-white/60 border border-gray-200/60 rounded-xl text-[11px] font-bold">
        <button id="tabPrimaryMetamodel" onclick="switchTab('metamodel')" class="flex-1 py-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow transition-all">元模型</button>
        <button id="tabPrimaryEntity" onclick="switchTab('entity')" class="flex-1 py-1.5 rounded-lg text-gray-500 hover:text-gray-800 transition-all">业务对象</button>
        <button id="tabPrimaryData" onclick="switchTab('data')" class="flex-1 py-1.5 rounded-lg text-gray-500 hover:text-gray-800 transition-all">业务数据</button>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="px-4 pb-2">
      <input id="filterInput" oninput="renderLeftList()" placeholder="🔍 搜索 apiKey / 名称" class="w-full bg-white/70 border border-gray-200 rounded-xl py-2 px-3 text-xs focus:ring-2 focus:ring-blue-500/20 outline-none"/>
    </div>

    <!-- 左侧列表标题 -->
    <div class="px-4 pt-2 pb-1 flex items-center justify-between">
      <div id="leftTitle" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">元模型列表</div>
      <div id="leftCount" class="text-[10px] font-bold text-gray-400"></div>
    </div>

    <!-- 列表 -->
    <div class="flex-1 overflow-y-auto custom-scrollbar px-4 pb-4">
      <div id="leftList" class="space-y-1">
        <div class="text-center text-gray-400 text-xs py-8">加载中...</div>
      </div>
    </div>

    <!-- 底部统计 -->
    <div id="statsFooter" class="px-4 pb-5 pt-2 border-t border-gray-200/60 text-[11px] text-gray-500 space-y-1"></div>
  </aside>

  <!-- 主区域 -->
  <main class="flex-1 flex flex-col min-w-0 relative z-10">

    <!-- 顶部 —— 标题 + 返回对话 -->
    <div class="px-8 py-4 bg-white/40 backdrop-blur-md border-b border-gray-200/50 shrink-0 flex items-center justify-between">
      <div>
        <h1 id="mainTitle" class="text-lg font-bold text-gray-900">选择一个元模型查看详情</h1>
        <p id="mainSubtitle" class="text-xs text-gray-400 mt-1">左侧切换三层架构维度并选择具体项</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="backendBadge" class="hidden chip"></span>
        <a href="/" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all no-underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          返回对话
        </a>
      </div>
    </div>

    <!-- 内容区（详情页内部的子 Tab 由 JS 动态渲染） -->
    <div id="content" class="flex-1 overflow-y-auto custom-scrollbar px-8 py-6">
      <div class="text-center text-gray-400 text-sm py-20">
        <div class="text-4xl mb-3">🧩</div>
        <p>从左侧选择一个元模型查看详情</p>
      </div>
    </div>
  </main>
</div>

<script>
const API = '';
let mode = 'metamodel';          // 'metamodel' | 'entity' | 'data'
let leftItems = [];
let selectedKey = null;
let currentDetail = null;        // 缓存当前右侧详情数据，用于子 Tab 切换时不重新请求
let currentSubTab = '';          // 当前二级 Tab

// ═══════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════

init();

async function init() {
  await Promise.all([loadStats(), loadLeftList()]);
}

async function loadStats() {
  try {
    const r = await fetch(API + '/api/meta/stats');
    const s = await r.json();
    document.getElementById('statsFooter').innerHTML = `
      <div class="flex items-center justify-between"><span>元模型</span><span class="font-bold text-gray-800">${s.meta_models}</span></div>
      <div class="flex items-center justify-between"><span>字段定义</span><span class="font-bold text-gray-800">${s.meta_items_total}</span></div>
      <div class="flex items-center justify-between"><span>元模型关联</span><span class="font-bold text-gray-800">${s.meta_links}</span></div>
      <div class="flex items-center justify-between"><span>枚举取值</span><span class="font-bold text-gray-800">${s.meta_options}</span></div>
      <div class="flex items-center justify-between"><span>元数据实例</span><span class="font-bold text-gray-800">${s.metadata_instances_total}</span></div>
    `;
    // 数据源徽章：sim=模拟数据 / http=真实服务；始终显示租户 id
    const badge = document.getElementById('backendBadge');
    const tenant = s.tenantId != null ? ` · 租户 ${s.tenantId}` : '';
    if (s.backend === 'http') {
      badge.className = 'chip chip-green';
      badge.textContent = `● paas-platform-service${tenant}`;
    } else {
      badge.className = 'chip chip-orange';
      badge.textContent = `● 模拟数据${tenant}`;
    }
    badge.classList.remove('hidden');
  } catch (e) { console.error(e); }
}

function switchTab(which) {
  if (mode === which && selectedKey) return;
  mode = which;
  selectedKey = null;
  currentDetail = null;
  currentSubTab = '';
  document.getElementById('filterInput').value = '';

  // 左侧一级 Tab 切换（segmented 风格）
  ['metamodel', 'entity', 'data'].forEach(k => {
    const btn = document.getElementById('tabPrimary' + k[0].toUpperCase() + k.slice(1));
    btn.className = k === which
      ? 'flex-1 py-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow transition-all'
      : 'flex-1 py-1.5 rounded-lg text-gray-500 hover:text-gray-800 transition-all';
  });

  const leftTitles = { metamodel: '元模型列表', entity: '业务对象', data: '业务对象（含数据）' };
  document.getElementById('leftTitle').textContent = leftTitles[which];

  const icons = { metamodel: '🧩', entity: '🗂️', data: '📊' };
  const titles = { metamodel: '选择一个元模型', entity: '选择一个业务对象', data: '选择一个业务对象查看数据' };
  const subtitles = {
    metamodel: '第一层 — p_meta_model / p_meta_item / p_meta_link / p_meta_option',
    entity: '第二层 — 元数据实例（Common + Tenant 合并）',
    data: '第三层 — 业务数据（p_tenant_data_*）',
  };
  document.getElementById('mainTitle').textContent = titles[which];
  document.getElementById('mainSubtitle').textContent = subtitles[which];
  document.getElementById('content').innerHTML = `
    <div class="text-center text-gray-400 text-sm py-20 animate-fade-in">
      <div class="text-4xl mb-3">${icons[which]}</div>
      <p>从左侧选择查看详情</p>
    </div>`;
  loadLeftList();
}

// ═══════════════════════════════════════════════════════════
// 左侧列表
// ═══════════════════════════════════════════════════════════

async function loadLeftList() {
  try {
    const urlMap = {
      metamodel: '/api/meta/metamodels',
      entity: '/api/meta/metadata/entities',
      data: '/api/meta/data/entities',
    };
    const r = await fetch(API + urlMap[mode]);
    leftItems = await r.json();
    document.getElementById('leftCount').textContent = `${leftItems.length} 项`;
    renderLeftList();
  } catch (e) {
    document.getElementById('leftList').innerHTML = `<div class="text-center text-rose-500 text-xs py-6">加载失败: ${e.message}</div>`;
  }
}

function renderLeftList() {
  const q = (document.getElementById('filterInput').value || '').toLowerCase().trim();
  const filtered = !q ? leftItems : leftItems.filter(it => {
    const k = (it.apiKey || '').toLowerCase();
    const l = (it.label || '').toLowerCase();
    return k.includes(q) || l.includes(q);
  });
  const el = document.getElementById('leftList');
  if (!filtered.length) { el.innerHTML = `<div class="text-center text-gray-400 text-xs py-6">无匹配项</div>`; return; }

  el.innerHTML = filtered.map(it => {
    const active = it.apiKey === selectedKey;
    const subBits = [];
    let badgeHtml = '';
    if (mode === 'metamodel') {
      if (it.dbTable) subBits.push(it.dbTable);
      if (it.metamodelLayer) subBits.push(it.metamodelLayer);
      if (it.enableCommon === 1) badgeHtml = `<span class="chip ${active ? 'bg-white/20 text-white' : 'chip-green'}">Common</span>`;
    } else if (mode === 'entity') {
      if (it.namespace) subBits.push(it.namespace);
      if (it.customFlg === 1) subBits.push('custom');
    } else {
      if (it.namespace) subBits.push(it.namespace);
      badgeHtml = `<span class="chip ${active ? 'bg-white/20 text-white' : 'chip-blue'}">${it.total ?? 0} 条</span>`;
    }
    return `
      <div onclick="selectItem('${escapeAttr(it.apiKey)}')"
           class="group p-3 rounded-xl cursor-pointer transition-all ${active ? 'bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-lg shadow-indigo-500/20' : 'bg-white/60 border border-gray-200/50 hover:border-indigo-300 hover:bg-white'}">
        <div class="flex items-center justify-between">
          <div class="font-bold text-sm ${active ? 'text-white' : 'text-gray-900'}">${escapeHtml(it.label || it.apiKey)}</div>
          ${badgeHtml}
        </div>
        <div class="text-[10px] mt-1 font-mono ${active ? 'text-white/80' : 'text-gray-500'}">${escapeHtml(it.apiKey)}</div>
        ${subBits.length ? `<div class="text-[10px] mt-1 ${active ? 'text-white/60' : 'text-gray-400'}">${subBits.join(' · ')}</div>` : ''}
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// 右侧详情
// ═══════════════════════════════════════════════════════════

async function selectItem(apiKey) {
  selectedKey = apiKey;
  currentDetail = null;
  currentSubTab = '';
  renderLeftList();
  const content = document.getElementById('content');
  content.innerHTML = `<div class="text-center text-gray-400 text-sm py-10 animate-fade-in">加载中...</div>`;

  try {
    const urlMap = {
      metamodel: `/api/meta/overview/${encodeURIComponent(apiKey)}`,
      entity: `/api/meta/entity/${encodeURIComponent(apiKey)}/overview`,
      data: `/api/meta/data/${encodeURIComponent(apiKey)}/_overview`,
    };
    const r = await fetch(API + urlMap[mode]);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    currentDetail = await r.json();
    if (mode === 'metamodel') renderMetamodelDetail();
    else if (mode === 'entity') renderEntityDetail();
    else renderDataDetail();
  } catch (e) {
    content.innerHTML = `<div class="text-center text-rose-500 text-sm py-10">加载失败: ${e.message}</div>`;
  }
}

// ─── 通用：渲染二级 Tab 条 + 切换 ───────────────────────────

function renderSecondaryTabs(tabs, container) {
  // tabs: [{key, label, count, icon?}]
  if (!currentSubTab || !tabs.some(t => t.key === currentSubTab)) {
    currentSubTab = tabs[0].key;
  }
  container.innerHTML = `
    <div class="flex items-center flex-wrap gap-1 p-1 bg-white/60 border border-gray-200/50 rounded-xl mb-4">
      ${tabs.map(t => `
        <div class="tab-secondary ${t.key === currentSubTab ? 'active' : ''}" onclick="switchSubTab('${t.key}')">
          ${t.icon || ''} <span>${t.label}</span>
          ${t.count != null ? `<span class="count">${t.count}</span>` : ''}
        </div>`).join('')}
    </div>
    <div id="subTabBody" class="animate-fade-in"></div>`;
}

function switchSubTab(key) {
  if (key === currentSubTab) return;
  currentSubTab = key;
  if (mode === 'metamodel') renderMetamodelDetail();
  else if (mode === 'entity') renderEntityDetail();
  else renderDataDetail();
}

// ─── 元模型详情（一级 Tab：元模型）─────────────────────────

function renderMetamodelDetail() {
  const d = currentDetail;
  const m = d.model;
  document.getElementById('mainTitle').textContent = `${m.label} (${m.apiKey})`;
  document.getElementById('mainSubtitle').textContent = `元模型档案 · 物理表 ${m.dbTable} · 字段 ${d.items.length} · 元数据实例 ${d.metadataCount}`;

  const opts = d.options || [];
  const links = d.links || [];

  const tabs = [
    { key: 'info',    label: '基本信息', icon: '📘' },
    { key: 'items',   label: '字段定义', icon: '🧱', count: d.items.length },
    { key: 'columns', label: 'dbc 列映射', icon: '🗜️', count: Object.keys(d.columnMapping || {}).length },
    { key: 'options', label: '枚举取值', icon: '🏷️', count: opts.length },
    { key: 'links',   label: '元模型关联', icon: '🔗', count: links.length },
  ];

  const content = document.getElementById('content');
  renderSecondaryTabs(tabs, content);
  const body = document.getElementById('subTabBody');

  const kv = (k, v, chip) => `<div class="flex items-start gap-3"><div class="text-xs text-gray-400 font-medium w-28 shrink-0">${k}</div><div class="text-xs font-semibold text-gray-800">${chip ? `<span class="chip ${chip}">${v}</span>` : escapeHtml(String(v ?? '-'))}</div></div>`;

  if (currentSubTab === 'info') {
    body.innerHTML = `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5">
        <div class="grid grid-cols-2 gap-y-3 gap-x-8">
          ${kv('apiKey', m.apiKey)}
          ${kv('label', m.label)}
          ${kv('db_table', m.dbTable)}
          ${kv('metamodel_layer', m.metamodelLayer, 'chip-purple')}
          ${kv('enable_common', m.enableCommon === 1 ? '是' : '否', m.enableCommon === 1 ? 'chip-green' : 'chip-gray')}
          ${kv('enable_ui_config', m.enableUiConfig === 1 ? '是' : '否', m.enableUiConfig === 1 ? 'chip-green' : 'chip-gray')}
          ${kv('enable_data_source', m.enableDataSource === 1 ? '是' : '否', m.enableDataSource === 1 ? 'chip-blue' : 'chip-gray')}
          ${kv('sort_num', m.sortNum)}
          ${kv('元数据实例数', d.metadataCount)}
        </div>
      </div>`;
    return;
  }

  if (currentSubTab === 'items') {
    const rows = d.items.map(it => `
      <tr class="border-t border-gray-100">
        <td class="py-2 px-3 font-mono text-xs text-gray-900">${escapeHtml(it.apiKey)}</td>
        <td class="py-2 px-3 text-xs text-gray-700">${escapeHtml(it.label || '')}</td>
        <td class="py-2 px-3"><span class="chip ${typeChipClass(it.itemType)}">${escapeHtml(it.itemType)}</span></td>
        <td class="py-2 px-3 font-mono text-[10px] text-gray-500">${escapeHtml(it.dbColumn || '')}</td>
        <td class="py-2 px-3">${it.requireFlg === 1 ? '<span class="chip chip-red">必填</span>' : ''}</td>
        <td class="py-2 px-3">${it.uniqueFlg === 1 ? '<span class="chip chip-orange">唯一</span>' : ''}</td>
        <td class="py-2 px-3 text-xs text-gray-500">${it.maxLength ?? ''}${it.decimalPlaces != null ? ` / ${it.decimalPlaces}位小数` : ''}</td>
      </tr>`).join('');
    body.innerHTML = tableCard(['apiKey','label','itemType','dbColumn','必填','唯一','长度/精度'], rows || emptyRow(7));
    return;
  }

  if (currentSubTab === 'columns') {
    const rows = Object.entries(d.columnMapping || {})
      .sort((a, b) => a[0].localeCompare(b[0], 'en', { numeric: true }))
      .map(([col, key]) => `<tr class="border-t border-gray-100">
        <td class="py-1.5 px-3 font-mono text-[11px] text-gray-900">${escapeHtml(col)}</td>
        <td class="py-1.5 px-3 text-[10px] text-gray-400">→</td>
        <td class="py-1.5 px-3 font-mono text-[11px] text-gray-600">${escapeHtml(key)}</td>
      </tr>`).join('');
    body.innerHTML = rows
      ? tableCard(['dbColumn', '', 'apiKey'], rows)
      : emptyCard('该元模型无 dbc 列');
    return;
  }

  if (currentSubTab === 'options') {
    const optsByItem = {};
    opts.forEach(o => { (optsByItem[o.itemApiKey] = optsByItem[o.itemApiKey] || []).push(o); });
    body.innerHTML = opts.length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5 space-y-4">
        ${Object.entries(optsByItem).map(([item, list]) => `
          <div>
            <div class="text-xs font-bold text-indigo-700 mb-1 font-mono">${escapeHtml(item)}</div>
            <div class="flex flex-wrap gap-2">
              ${list.map(o => `<span class="chip chip-purple">${escapeHtml(o.optionCode)}<span class="opacity-60 font-normal ml-1">${escapeHtml(o.label || '')}</span></span>`).join('')}
            </div>
          </div>`).join('')}
      </div>` : emptyCard('该元模型无枚举取值');
    return;
  }

  if (currentSubTab === 'links') {
    body.innerHTML = links.length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5 space-y-2">
        ${links.map(l => `
          <div class="flex items-center gap-2 text-xs">
            <span class="font-mono text-gray-800">${escapeHtml(l.parentMetamodelApiKey)}</span>
            <span class="chip ${l.linkType === 'SELF_REF' ? 'chip-orange' : 'chip-blue'}">${escapeHtml(l.linkType)}</span>
            <span class="font-mono text-gray-800">${escapeHtml(l.childMetamodelApiKey)}</span>
            ${l.cascadeDelete === 1 ? '<span class="chip chip-red">级联删除</span>' : ''}
          </div>`).join('')}
      </div>` : emptyCard('该元模型没有定义关联关系');
  }
}

// ─── 业务对象详情（一级 Tab：业务对象）─────────────────────

function renderEntityDetail() {
  const d = currentDetail;
  const e = d.entity;
  document.getElementById('mainTitle').textContent = `${e.label} (${e.apiKey})`;
  document.getElementById('mainSubtitle').textContent = `业务对象档案 · 字段 ${d.items.length} · 关联 ${d.entityLinks.length} · 校验规则 ${d.checkRules.length} · 业务类型 ${d.busiTypes.length}`;

  const poByItem = d.pickOptionsByItem || {};
  const poCount = Object.values(poByItem).reduce((s, v) => s + (v || []).length, 0);
  const tabs = [
    { key: 'info',     label: '基本信息', icon: '📦' },
    { key: 'items',    label: '字段',     icon: '🧱', count: d.items.length },
    { key: 'options',  label: '选项值',   icon: '🎯', count: poCount },
    { key: 'links',    label: '关联',     icon: '🔗', count: d.entityLinks.length },
    { key: 'rules',    label: '校验规则', icon: '🛡️', count: d.checkRules.length },
    { key: 'busi',     label: '业务类型', icon: '🏷️', count: d.busiTypes.length },
  ];

  const content = document.getElementById('content');
  renderSecondaryTabs(tabs, content);
  const body = document.getElementById('subTabBody');

  const kv = (k, v, chip) => `<div class="flex items-start gap-3"><div class="text-xs text-gray-400 font-medium w-24 shrink-0">${k}</div><div class="text-xs font-semibold text-gray-800">${chip ? `<span class="chip ${chip}">${v}</span>` : escapeHtml(String(v ?? '-'))}</div></div>`;

  if (currentSubTab === 'info') {
    body.innerHTML = `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5">
        <div class="grid grid-cols-2 gap-y-3 gap-x-8">
          ${kv('apiKey', e.apiKey)}
          ${kv('label', e.label)}
          ${kv('namespace', e.namespace, namespaceChip(e.namespace))}
          ${kv('custom_flg', e.customFlg === 1 ? '是' : '否', e.customFlg === 1 ? 'chip-orange' : 'chip-gray')}
          ${kv('enable_flg', e.enableFlg === 1 ? '启用' : '停用', e.enableFlg === 1 ? 'chip-green' : 'chip-red')}
          ${kv('sort_num', e.sortNum)}
          ${kv('icon_name', e.iconName)}
        </div>
      </div>`;
    return;
  }

  if (currentSubTab === 'items') {
    const rows = d.items.map(it => `
      <tr class="border-t border-gray-100">
        <td class="py-2 px-3 font-mono text-xs text-gray-900">${escapeHtml(it.apiKey)}</td>
        <td class="py-2 px-3 text-xs text-gray-700">${escapeHtml(it.label || '')}</td>
        <td class="py-2 px-3"><span class="chip ${typeChipClass(it.itemType)}">${escapeHtml(it.itemType)}</span></td>
        <td class="py-2 px-3 font-mono text-[10px] text-gray-500">${escapeHtml(it.dbColumn || '')}</td>
        <td class="py-2 px-3">${it.requireFlg === 1 ? '<span class="chip chip-red">必填</span>' : ''}</td>
        <td class="py-2 px-3">${it.uniqueFlg === 1 ? '<span class="chip chip-orange">唯一</span>' : ''}</td>
        <td class="py-2 px-3 text-xs text-gray-500">${it.maxLength ?? ''}</td>
      </tr>`).join('');
    body.innerHTML = tableCard(['apiKey','label','itemType','dbColumn','必填','唯一','长度'], rows || emptyRow(7));
    return;
  }

  if (currentSubTab === 'options') {
    body.innerHTML = Object.keys(poByItem).length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5 space-y-4">
        ${Object.entries(poByItem).map(([item, list]) => `
          <div>
            <div class="text-xs font-bold text-indigo-700 mb-1 font-mono">${escapeHtml(item)}</div>
            <div class="flex flex-wrap gap-2">
              ${(list || []).map(o => `<span class="chip ${o.defaultFlg === 1 ? 'chip-green' : 'chip-purple'}">${escapeHtml(o.apiKey)}<span class="opacity-60 font-normal ml-1">${escapeHtml(o.label || '')}</span>${o.defaultFlg === 1 ? ' ★' : ''}</span>`).join('')}
            </div>
          </div>`).join('')}
      </div>` : emptyCard('当前业务对象没有 PICK_LIST 字段或选项值');
    return;
  }

  if (currentSubTab === 'links') {
    body.innerHTML = d.entityLinks.length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5 space-y-2">
        ${d.entityLinks.map(l => `
          <div class="flex items-center gap-2 text-xs">
            <span class="font-mono text-gray-800">${escapeHtml(l.parentEntityApiKey)}</span>
            <span class="chip chip-blue">${escapeHtml(l.linkType)}</span>
            <span class="font-mono text-gray-800">${escapeHtml(l.childEntityApiKey)}</span>
            ${l.cascadeDelete === 1 ? '<span class="chip chip-red">级联删除</span>' : ''}
          </div>`).join('')}
      </div>` : emptyCard('该业务对象无关联');
    return;
  }

  if (currentSubTab === 'rules') {
    body.innerHTML = d.checkRules.length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5 space-y-3">
        ${d.checkRules.map(r => `
          <div class="text-xs">
            <div class="font-bold text-gray-900">${escapeHtml(r.label)} <span class="font-mono text-gray-400 font-normal ml-2">${escapeHtml(r.apiKey)}</span></div>
            <div class="font-mono text-[10px] text-indigo-700 mt-1">${escapeHtml(r.expression || '')}</div>
            <div class="text-[10px] text-gray-500 mt-0.5">提示：${escapeHtml(r.errorMessage || '')}</div>
          </div>`).join('')}
      </div>` : emptyCard('该业务对象无校验规则');
    return;
  }

  if (currentSubTab === 'busi') {
    body.innerHTML = d.busiTypes.length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5 flex flex-wrap gap-2">
        ${d.busiTypes.map(b => `<span class="chip ${b.defaultFlg === 1 ? 'chip-green' : 'chip-blue'}">${escapeHtml(b.apiKey)}<span class="opacity-60 font-normal ml-1">${escapeHtml(b.label || '')}</span>${b.defaultFlg === 1 ? ' ★默认' : ''}</span>`).join('')}
      </div>` : emptyCard('该业务对象无业务类型');
  }
}

// ─── 数据详情（一级 Tab：数据）─────────────────────────────

let dataPage = 1;
const DATA_PAGE_SIZE = 20;

function renderDataDetail() {
  const d = currentDetail;
  document.getElementById('mainTitle').textContent = `${d.label} 数据 (${d.entityApiKey})`;
  document.getElementById('mainSubtitle').textContent = `业务数据 · 共 ${d.total} 条 · 字段 ${d.items.length} · 对应 p_tenant_data_*`;

  const metrics = d.numericMetrics || [];
  const tabs = [
    { key: 'records',  label: '数据记录', icon: '📋', count: d.total },
    { key: 'metrics',  label: '聚合指标', icon: '📈', count: metrics.length },
    { key: 'schema',   label: '字段结构', icon: '🧱', count: d.items.length },
  ];

  const content = document.getElementById('content');
  renderSecondaryTabs(tabs, content);
  const body = document.getElementById('subTabBody');

  if (currentSubTab === 'records') {
    dataPage = 1;
    body.innerHTML = `
      <div class="grid grid-cols-4 gap-3 mb-4">
        ${numberCard('记录总数', d.total)}
        ${numberCard('字段数', d.items.length)}
        ${numberCard('命名空间', d.namespace || '-', namespaceChip(d.namespace))}
        ${numberCard('数值字段', metrics.length)}
      </div>
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5">
        <div class="flex items-center justify-between mb-3">
          <div class="font-bold text-sm text-gray-900">数据记录</div>
          <div class="flex items-center gap-2">
            <button id="dataPrevBtn" onclick="changeDataPage(-1)" class="px-2.5 py-1 rounded-lg bg-white/70 border border-gray-200 text-xs font-bold text-gray-600 hover:bg-white disabled:opacity-40">上一页</button>
            <div id="dataPageInfo" class="text-[11px] text-gray-500 font-bold">第 1 页</div>
            <button id="dataNextBtn" onclick="changeDataPage(1)" class="px-2.5 py-1 rounded-lg bg-white/70 border border-gray-200 text-xs font-bold text-gray-600 hover:bg-white disabled:opacity-40">下一页</button>
          </div>
        </div>
        <div id="dataTableWrap"></div>
      </div>`;
    // 用 overview 里的 sample 首屏渲染
    renderDataTable(d.sample || [], d.total);
    return;
  }

  if (currentSubTab === 'metrics') {
    body.innerHTML = metrics.length ? `
      <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5">
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">
              <tr><th class="py-2 px-3">字段</th><th class="py-2 px-3">求和</th><th class="py-2 px-3">均值</th><th class="py-2 px-3">最大值</th></tr>
            </thead>
            <tbody>
              ${metrics.map(m => `<tr class="border-t border-gray-100">
                <td class="py-2 px-3 text-xs font-semibold text-gray-900">${escapeHtml(m.label || m.field)} <span class="font-mono text-gray-400 font-normal ml-1">${escapeHtml(m.field)}</span></td>
                <td class="py-2 px-3 text-xs font-mono text-emerald-700">${formatNumber(m.sum)}</td>
                <td class="py-2 px-3 text-xs font-mono text-indigo-700">${formatNumber(m.avg)}</td>
                <td class="py-2 px-3 text-xs font-mono text-orange-700">${formatNumber(m.max)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : emptyCard('该业务对象无数值字段');
    return;
  }

  if (currentSubTab === 'schema') {
    const rows = d.items.map(it => `
      <tr class="border-t border-gray-100">
        <td class="py-2 px-3 font-mono text-xs text-gray-900">${escapeHtml(it.apiKey)}</td>
        <td class="py-2 px-3 text-xs text-gray-700">${escapeHtml(it.label || '')}</td>
        <td class="py-2 px-3"><span class="chip ${typeChipClass(it.itemType)}">${escapeHtml(it.itemType)}</span></td>
        <td class="py-2 px-3 font-mono text-[10px] text-gray-500">${escapeHtml(it.dbColumn || '')}</td>
        <td class="py-2 px-3">${it.requireFlg === 1 ? '<span class="chip chip-red">必填</span>' : ''}</td>
      </tr>`).join('');
    body.innerHTML = tableCard(['apiKey','label','itemType','dbColumn','必填'], rows || emptyRow(5));
  }
}

async function changeDataPage(delta) {
  dataPage = Math.max(1, dataPage + delta);
  const wrap = document.getElementById('dataTableWrap');
  wrap.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">加载中...</div>`;
  try {
    const r = await fetch(`${API}/api/meta/data/${encodeURIComponent(currentDetail.entityApiKey)}?page=${dataPage}&pageSize=${DATA_PAGE_SIZE}`);
    const d = await r.json();
    renderDataTable(d.records || [], d.total ?? 0);
  } catch (e) {
    wrap.innerHTML = `<div class="text-center text-rose-500 text-xs py-8">加载失败: ${e.message}</div>`;
  }
}

function renderDataTable(records, total) {
  const wrap = document.getElementById('dataTableWrap');
  const totalPages = Math.max(1, Math.ceil((total || 0) / DATA_PAGE_SIZE));
  document.getElementById('dataPageInfo').textContent = `第 ${dataPage} / ${totalPages} 页 · 共 ${total} 条`;
  document.getElementById('dataPrevBtn').disabled = dataPage <= 1;
  document.getElementById('dataNextBtn').disabled = dataPage >= totalPages;

  if (!records.length) {
    wrap.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">暂无数据</div>`;
    return;
  }

  const displayFields = pickDisplayFields(records[0]);
  const fieldDefs = (currentDetail && currentDetail.items) || [];
  const thead = displayFields.map(f => {
    const def = fieldDefs.find(it => it.apiKey === f);
    const label = def ? def.label : f;
    return `<th class="py-2 px-3 whitespace-nowrap">${escapeHtml(label)}<span class="font-mono text-gray-300 font-normal ml-1">${escapeHtml(f)}</span></th>`;
  }).join('');

  const tbody = records.map(r => `
    <tr class="border-t border-gray-100 hover:bg-indigo-50/40 transition-colors">
      ${displayFields.map(f => `<td class="py-2 px-3 text-xs text-gray-700 font-mono">${renderCell(r[f], f)}</td>`).join('')}
    </tr>`).join('');

  wrap.innerHTML = `
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="text-[10px] uppercase tracking-wider text-gray-400 font-bold"><tr>${thead}</tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`;
}

function pickDisplayFields(sampleRecord) {
  const keys = Object.keys(sampleRecord || {});
  const priority = ['id', 'name', 'subject', 'type', 'stage', 'status', 'company', 'accountId', 'opportunityId', 'amount', 'industry', 'city', 'employeeCount', 'annualRevenue', 'phone', 'email', 'dueDate', 'closeDate'];
  const ordered = [...priority.filter(k => keys.includes(k)), ...keys.filter(k => !priority.includes(k))];
  return ordered.filter(k => !['createdAt', 'updatedAt'].includes(k)).slice(0, 8);
}

function renderCell(v, field) {
  if (v == null || v === '') return '<span class="text-gray-300">-</span>';
  if (['stage', 'status', 'type', 'source'].includes(field)) {
    return `<span class="chip chip-blue">${escapeHtml(String(v))}</span>`;
  }
  if (field === 'activeFlg' || field === 'isPrimary') {
    return v === 1 || v === '1' ? '<span class="chip chip-green">是</span>' : '<span class="chip chip-gray">否</span>';
  }
  if (typeof v === 'number') return formatNumber(v);
  const s = String(v);
  return s.length > 40 ? `<span title="${escapeAttr(s)}">${escapeHtml(s.slice(0, 40))}...</span>` : escapeHtml(s);
}

// ═══════════════════════════════════════════════════════════
// 通用工具
// ═══════════════════════════════════════════════════════════

function tableCard(headers, rowsHtml) {
  return `
    <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-5">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">
            <tr>${headers.map(h => `<th class="py-2 px-3">${escapeHtml(h)}</th>`).join('')}</tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>`;
}

function emptyRow(cols) {
  return `<tr><td colspan="${cols}" class="py-6 text-center text-gray-400 text-xs">无数据</td></tr>`;
}

function emptyCard(text) {
  return `<div class="bg-white/60 border border-gray-200/50 rounded-2xl p-10 text-center text-gray-400 text-xs">${escapeHtml(text)}</div>`;
}

function numberCard(label, value, chip) {
  return `
    <div class="bg-white/60 border border-gray-200/50 rounded-2xl p-4">
      <div class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">${escapeHtml(label)}</div>
      <div class="text-2xl font-extrabold text-gray-900 mt-1">${chip ? `<span class="chip ${chip}" style="font-size:13px;padding:4px 10px">${escapeHtml(String(value))}</span>` : escapeHtml(String(value))}</div>
    </div>`;
}

function typeChipClass(t) {
  if (!t) return 'chip-gray';
  if (t === 'VARCHAR' || t === 'TEXT') return 'chip-blue';
  if (t === 'INTEGER' || t === 'LONG' || t === 'DECIMAL') return 'chip-green';
  if (t === 'DATE' || t === 'DATETIME') return 'chip-orange';
  if (t === 'BOOLEAN_FLG') return 'chip-red';
  if (t === 'PICK_LIST' || t === 'RELATIONSHIP') return 'chip-purple';
  return 'chip-gray';
}

function namespaceChip(ns) {
  if (ns === 'system') return 'chip-red';
  if (ns === 'product') return 'chip-blue';
  if (ns === 'custom') return 'chip-orange';
  return 'chip-gray';
}

function formatNumber(n) {
  if (n == null || n === '') return '-';
  const num = Number(n);
  if (isNaN(num)) return escapeHtml(String(n));
  if (Math.abs(num) >= 10000) return num.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  return String(num);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }
</script>
