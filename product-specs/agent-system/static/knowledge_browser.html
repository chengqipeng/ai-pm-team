<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 - DeepAgent AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.3s ease-out; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.animate-pulse-slow { animation: pulse-dot 1.5s infinite; }
.upload-drop.dragover { border-color: #3b82f6 !important; background: #eff6ff !important; }
</style>
</head>
<body>
<div class="flex h-screen w-full bg-[#f4f7fb] font-sans text-slate-800 overflow-hidden relative">
  <!-- 氛围背景 -->
  <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-indigo-400/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- 左侧边栏 -->
  <aside class="w-72 flex flex-col z-20 shrink-0 bg-white/40 backdrop-blur-xl border-r border-gray-200/50">
    <div class="p-6 shrink-0">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-9 h-9 bg-gradient-to-br from-indigo-600 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/20">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </div>
        <span class="font-bold text-lg tracking-tight text-gray-900">知识库</span>
      </div>

      <!-- 新建 KB 按钮 -->
      <button onclick="openCreateKbModal()" class="w-full py-2.5 px-3 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl text-xs font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建知识库
      </button>
    </div>

    <!-- KB 列表 -->
    <div class="flex-1 overflow-y-auto custom-scrollbar px-4 pb-4">
      <h3 class="px-3 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">我的知识库</h3>
      <div id="kbList" class="space-y-1">
        <div class="text-center text-gray-400 text-xs py-8">加载中...</div>
      </div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="flex-1 flex flex-col min-w-0 relative z-10">
    <!-- 头部 -->
    <div id="mainHeader" class="px-8 py-5 bg-white/40 backdrop-blur-md border-b border-gray-200/50 shrink-0 flex items-center justify-between">
      <div>
        <h1 id="kbTitle" class="text-lg font-bold text-gray-900">选择一个知识库</h1>
        <p id="kbSubtitle" class="text-xs text-gray-400 mt-1">从左侧选择知识库查看文档</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="manageSchemaBtn" onclick="openSchemaModal()" class="hidden px-3 py-2 bg-white border border-gray-200 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-50 transition-all flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          元数据 Schema
        </button>
        <button onclick="openScheduleModal()" class="px-3 py-2 bg-white border border-gray-200 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-50 transition-all flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          调度任务
        </button>
        <button id="uploadBtn" onclick="openUploadModal()" class="hidden px-3 py-2 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl text-xs font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          上传文档
        </button>
        <div class="h-6 w-px bg-gray-200 mx-1"></div>
        <!-- 租户 / 用户 信息 -->
        <div class="flex items-center gap-2 px-3 py-1.5 bg-white/60 border border-gray-200/50 rounded-xl text-[11px]">
          <span class="text-gray-400 font-medium">租户</span>
          <input id="tenantInput" type="text" value="" onchange="loadKbs()" class="w-20 bg-transparent border-none outline-none text-gray-800 font-bold text-center focus:bg-blue-50 rounded" placeholder="..."/>
          <span class="text-gray-200">|</span>
          <span class="text-gray-400 font-medium">用户</span>
          <span id="currentUserDisplay" class="text-gray-800 font-bold max-w-[120px] truncate" title="">—</span>
        </div>
        <a href="/" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all no-underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          返回对话
        </a>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div id="statsBar" class="hidden px-8 py-4 bg-white/20 border-b border-gray-200/30 flex gap-3"></div>

    <!-- 文档列表 -->
    <div id="docList" class="flex-1 overflow-y-auto custom-scrollbar px-8 py-6">
      <div class="text-center text-gray-400 text-sm py-20">
        <div class="text-4xl mb-3">📚</div>
        <p>从左侧选择知识库</p>
      </div>
    </div>
  </main>

  <!-- 新建 KB 弹窗 -->
  <div id="createKbModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-[480px] max-w-[90vw] animate-fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-900">新建知识库</h2>
        <button onclick="closeCreateKbModal()" class="text-gray-400 hover:text-gray-600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">API Key <span class="text-red-500">*</span></label>
          <input id="newKbApiKey" type="text" placeholder="例如 product-manual" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-blue-500/20"/>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">名称 <span class="text-red-500">*</span></label>
          <input id="newKbName" type="text" placeholder="例如 产品手册库" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-blue-500/20"/>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600 block mb-1">描述</label>
          <textarea id="newKbDesc" rows="2" placeholder="可选" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-blue-500/20 resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1">默认 Top-K</label>
            <input id="newKbTopK" type="number" value="5" min="1" max="20" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-blue-500/20"/>
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 block mb-1" title="finalScore 低于此值的结果会被丢弃，留 0 关闭过滤">
              相关性阈值 <span class="text-gray-400 font-normal">(0~1)</span>
            </label>
            <input id="newKbMinScore" type="number" value="0.3" min="0" max="1" step="0.05" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-blue-500/20"/>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2 text-xs"><input id="newKbSelfQuery" type="checkbox" checked> 启用 Self-Query（LLM 识别元数据过滤）</label>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeCreateKbModal()" class="px-4 py-2 text-xs font-bold text-gray-600 hover:bg-gray-100 rounded-xl transition-all">取消</button>
        <button onclick="submitCreateKb()" class="px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-indigo-600 to-blue-600 rounded-xl shadow-md hover:shadow-lg transition-all">创建</button>
      </div>
    </div>
  </div>

  <!-- 上传文档弹窗 -->
  <div id="uploadModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-[520px] max-w-[90vw] animate-fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-900">上传文档</h2>
        <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <!-- 拖拽区 -->
      <div id="uploadDrop" class="upload-drop border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-400 transition-all cursor-pointer mb-4" onclick="document.getElementById('uploadInput').click()">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mx-auto text-gray-400 mb-3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p id="uploadHint" class="text-sm text-gray-600 font-medium">点击或拖拽文件到这里</p>
        <p class="text-xs text-gray-400 mt-1">支持 PDF / DOCX / PPTX / XLSX / MD / TXT，单次可选多个</p>
        <input id="uploadInput" type="file" class="hidden" multiple accept=".pdf,.docx,.pptx,.xlsx,.md,.txt,.html,.csv"/>
      </div>
      <!-- 文件列表 -->
      <div id="uploadFileList" class="space-y-1 max-h-48 overflow-y-auto custom-scrollbar mb-4"></div>
      <div>
        <label class="text-xs font-bold text-gray-600 block mb-1">自定义标题（可选）</label>
        <input id="uploadTitle" type="text" placeholder="为所有上传文件设置统一标题（留空则使用原文件名）" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-blue-500/20"/>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeUploadModal()" class="px-4 py-2 text-xs font-bold text-gray-600 hover:bg-gray-100 rounded-xl transition-all">取消</button>
        <button id="uploadSubmitBtn" onclick="submitUpload()" class="px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-indigo-600 to-blue-600 rounded-xl shadow-md hover:shadow-lg transition-all disabled:opacity-50" disabled>上传</button>
      </div>
    </div>
  </div>

  <!-- 文档详情抽屉（右侧滑入） -->
  <div id="docModal" class="hidden fixed inset-0 z-50 flex justify-end bg-black/20 backdrop-blur-sm">
    <div id="docDrawer" class="bg-white w-[640px] max-w-[85vw] h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-out">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 shrink-0">
        <h2 id="docModalTitle" class="text-base font-bold text-gray-900 truncate pr-4">文档详情</h2>
        <button onclick="closeDocModal()" class="text-gray-400 hover:text-gray-600 shrink-0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div id="docModalBody" class="px-6 py-5 overflow-y-auto custom-scrollbar flex-1 space-y-5">
        <div class="text-center text-gray-400 py-10">加载中...</div>
      </div>
    </div>
  </div>

  <!-- Schema 管理弹窗 -->
  <div id="schemaModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-[620px] max-w-[90vw] max-h-[80vh] flex flex-col animate-fade-in">
      <div class="flex items-center justify-between p-6 border-b border-gray-100">
        <div>
          <h2 class="text-lg font-bold text-gray-900">元数据 Schema</h2>
          <p class="text-xs text-gray-500 mt-0.5">驱动自动打标 + Self-Querying；枚举值会建议给 LLM</p>
        </div>
        <button onclick="closeSchemaModal()" class="text-gray-400 hover:text-gray-600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
        <div class="flex items-center justify-between mb-3">
          <label class="text-xs font-bold text-gray-600">字段定义</label>
          <div class="flex items-center gap-2">
            <button onclick="loadDefaultSchema()" class="text-xs font-bold text-gray-500 hover:text-blue-600">📋 加载默认</button>
            <button onclick="addSchemaField()" class="text-xs font-bold text-blue-600 hover:text-blue-700">+ 添加字段</button>
          </div>
        </div>
        <div id="schemaFields" class="space-y-2"></div>
      </div>
      <div class="flex justify-end gap-2 p-6 border-t border-gray-100">
        <button onclick="closeSchemaModal()" class="px-4 py-2 text-xs font-bold text-gray-600 hover:bg-gray-100 rounded-xl transition-all">取消</button>
        <button onclick="submitSchema()" class="px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-indigo-600 to-blue-600 rounded-xl shadow-md hover:shadow-lg transition-all">保存</button>
      </div>
    </div>
  </div>

  <!-- 调度任务弹窗 -->
  <div id="scheduleModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/20 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-[580px] max-w-[90vw] max-h-[80vh] flex flex-col animate-fade-in">
      <div class="flex items-center justify-between p-6 border-b border-gray-100">
        <div>
          <h2 class="text-lg font-bold text-gray-900">调度任务</h2>
          <p class="text-xs text-gray-500 mt-0.5">管理定时执行的维护任务（如热度衰减）</p>
        </div>
        <button onclick="closeScheduleModal()" class="text-gray-400 hover:text-gray-600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div id="scheduleList" class="p-6 overflow-y-auto custom-scrollbar flex-1">
        <div class="text-center text-gray-400 text-xs py-8">加载中...</div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-xl shadow-lg z-[100] animate-fade-in"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════════════════

const API = '';  // 同源
function esc(t){if(t==null)return'';const d=document.createElement('div');d.textContent=String(t);return d.innerHTML}
function fmtTime(ts){if(!ts)return'—';const d=new Date(typeof ts==='number'&&ts>1e12?ts:ts*1000);return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtSize(bytes){if(!bytes)return'—';const u=['B','KB','MB','GB'];let i=0;let v=bytes;while(v>=1024&&i<u.length-1){v/=1024;i++;}return `${v.toFixed(v<10?1:0)} ${u[i]}`;}
function toast(msg, type='info'){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2 rounded-xl shadow-lg z-[100] animate-fade-in ${type==='error'?'bg-red-600':type==='success'?'bg-green-600':'bg-gray-900'}`;
  el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'), 2500);
}

async function apiGet(path){
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}
async function apiPost(path, body){
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}
async function apiDelete(path){
  const r = await fetch(API + path, {method: 'DELETE'});
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}

// ═══════════════════════════════════════════════════════════
// 状态
// ═══════════════════════════════════════════════════════════

let kbs = [];
let currentKb = null;
let currentDocuments = [];
let pendingFiles = [];
let activePolls = new Map();  // task_id → intervalId

function tenantId(){ return document.getElementById('tenantInput').value || '292193'; }

// 与对话页保持一致：优先从 /api/auth/me 获取真实 tenant_id 和 user_id
let currentUserId = localStorage.getItem('deepagent_user_id') || '';

(async function initIdentity(){
  try {
    const r = await fetch(API + '/api/auth/me');
    if (r.ok) {
      const me = await r.json();
      if (me.userId) {
        currentUserId = String(me.userId);
        localStorage.setItem('deepagent_user_id', currentUserId);
      }
      if (me.tenantId) {
        document.getElementById('tenantInput').value = String(me.tenantId);
      }
    }
  } catch (e) { /* 后端未启动或接口不存在，用 fallback */ }

  if (!currentUserId) {
    currentUserId = 'user_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('deepagent_user_id', currentUserId);
  }
  if (!document.getElementById('tenantInput').value) {
    document.getElementById('tenantInput').value = '292193';
  }

  console.log('[Knowledge] tenant_id:', tenantId(), 'user_id:', currentUserId);
  renderUserDisplay();

  // 初始化完成后再加载知识库列表
  loadKbs();
})();
function renderUserDisplay(){
  const el = document.getElementById('currentUserDisplay');
  if (el) { el.textContent = currentUserId; el.title = currentUserId; }
}

// ═══════════════════════════════════════════════════════════
// KB 列表
// ═══════════════════════════════════════════════════════════

async function loadKbs(){
  try {
    const data = await apiGet(`/api/knowledge?tenant_id=${tenantId()}`);
    kbs = data.items || [];
    renderKbList();
  } catch (e) {
    document.getElementById('kbList').innerHTML = `<div class="text-center text-red-500 text-xs py-8">加载失败: ${esc(e.message)}</div>`;
  }
}

function renderKbList(){
  const list = document.getElementById('kbList');
  if (!kbs.length) {
    list.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">暂无知识库<br/><span class="text-[10px] opacity-70">点击上方「新建知识库」</span></div>`;
    return;
  }
  list.innerHTML = kbs.map(kb => `
    <div onclick="selectKb('${kb.id}')" class="kb-item cursor-pointer px-3 py-2.5 rounded-xl hover:bg-white/60 transition-all group ${currentKb && String(currentKb.id) === String(kb.id) ? 'bg-white/80 border border-blue-200 shadow-sm' : ''}" data-id="${kb.id}">
      <div class="flex items-center gap-2 mb-1">
        <div class="w-7 h-7 bg-gradient-to-br from-indigo-500 to-blue-500 rounded-lg flex items-center justify-center shrink-0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold text-gray-900 truncate">${esc(kb.name)}</div>
          <div class="text-[10px] text-gray-400 truncate">${esc(kb.api_key)}</div>
        </div>
      </div>
      <div class="flex items-center gap-2 text-[10px] text-gray-500">
        <span>📄 ${kb.document_count}</span>
        <span>🧩 ${kb.chunk_count}</span>
      </div>
    </div>
  `).join('');
}

function selectKb(id){
  // id 是字符串（BIGINT 超过 JS Number 精度）
  currentKb = kbs.find(k => String(k.id) === String(id));
  if (!currentKb) return;
  renderKbList();
  // 更新头部
  document.getElementById('kbTitle').textContent = currentKb.name;
  document.getElementById('kbSubtitle').textContent = `${currentKb.api_key} · ${currentKb.description || '暂无描述'}`;
  document.getElementById('uploadBtn').classList.remove('hidden');
  document.getElementById('manageSchemaBtn').classList.remove('hidden');
  loadDocuments();
  renderStats();
}

function renderStats(){
  if (!currentKb) return;
  const bar = document.getElementById('statsBar');
  bar.classList.remove('hidden');
  bar.innerHTML = `
    ${statCard('📄', '文档', currentKb.document_count, 'blue')}
    ${statCard('🧩', '切片', currentKb.chunk_count, 'indigo')}
    ${statCard('🎯', '默认 Top-K', currentKb.default_top_k, 'purple')}
    <button onclick="recomputeKbStats()" title="从实际文档重算（修正脏数据）" class="ml-auto self-center text-[10px] text-gray-400 hover:text-blue-600 border border-gray-200 rounded-lg px-2 py-1">
      🔄 重算统计
    </button>
  `;
}

function statCard(emoji, label, value, color){
  const bg = {blue:'bg-blue-50 border-blue-100', indigo:'bg-indigo-50 border-indigo-100', purple:'bg-purple-50 border-purple-100'}[color];
  return `
    <div class="flex items-center gap-3 ${bg} border rounded-xl px-4 py-2.5">
      <div class="text-xl">${emoji}</div>
      <div>
        <div class="text-[10px] font-bold text-gray-500 uppercase">${label}</div>
        <div class="text-sm font-bold text-gray-900">${value ?? 0}</div>
      </div>
    </div>
  `;
}

async function loadDocuments(){
  if (!currentKb) return;
  const list = document.getElementById('docList');
  list.innerHTML = `<div class="text-center text-gray-400 text-sm py-10">加载中...</div>`;
  try {
    const data = await apiGet(`/api/knowledge/documents?tenant_id=${tenantId()}&knowledge_base_id=${currentKb.id}&limit=100`);
    currentDocuments = data.items || [];
    renderDocs();
  } catch (e) {
    list.innerHTML = `<div class="text-center text-red-500 text-sm py-10">加载失败: ${esc(e.message)}</div>`;
  }
}

function renderDocs(){
  const list = document.getElementById('docList');
  if (!currentDocuments.length) {
    list.innerHTML = `
      <div class="text-center text-gray-400 text-sm py-20">
        <div class="text-5xl mb-4">📥</div>
        <p class="font-medium mb-1">此知识库暂无文档</p>
        <p class="text-xs opacity-70">点击右上角「上传文档」开始</p>
      </div>
    `;
    return;
  }
  list.innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-[10px] font-bold text-gray-500 uppercase tracking-wider">
          <tr>
            <th class="px-4 py-3 text-left">文档</th>
            <th class="px-4 py-3 text-left">状态</th>
            <th class="px-4 py-3 text-left">切片</th>
            <th class="px-4 py-3 text-left">质量</th>
            <th class="px-4 py-3 text-left">大小</th>
            <th class="px-4 py-3 text-left">创建时间</th>
            <th class="px-4 py-3 text-right">操作</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          ${currentDocuments.map(d => renderDocRow(d)).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderDocRow(d){
  const status = renderStatusBadge(d);
  const quality = d.quality_score ? renderQualityBar(d.quality_score) : '<span class="text-gray-300 text-xs">—</span>';
  return `
    <tr class="hover:bg-blue-50/30 transition-colors">
      <td class="px-4 py-3">
        <div class="flex items-center gap-2">
          <span class="text-lg">${fileEmoji(d.file_type)}</span>
          <div class="min-w-0">
            <div class="text-xs font-bold text-gray-900 truncate max-w-[240px]">${esc(d.title || d.file_name)}</div>
            <div class="text-[10px] text-gray-400 truncate max-w-[240px]">${esc(d.file_name)}</div>
          </div>
        </div>
      </td>
      <td class="px-4 py-3">${status}</td>
      <td class="px-4 py-3 text-xs text-gray-700">${d.chunk_count || 0} / ${d.segment_count || 0}<span class="text-[10px] text-gray-400 ml-1">切/章</span></td>
      <td class="px-4 py-3">${quality}</td>
      <td class="px-4 py-3 text-xs text-gray-500">${fmtSize(d.file_size)}</td>
      <td class="px-4 py-3 text-xs text-gray-500">${fmtTime(d.created_at)}</td>
      <td class="px-4 py-3 text-right">
        <button onclick="openDocDetail('${esc(d.doc_id)}')" class="text-xs text-blue-600 hover:text-blue-700 font-bold mr-2">详情</button>
        <button onclick="deleteDoc('${esc(d.doc_id)}')" class="text-xs text-red-500 hover:text-red-600 font-bold">删除</button>
      </td>
    </tr>
  `;
}

function fileEmoji(ft){
  const m = {pdf:'📕',docx:'📘',doc:'📘',xlsx:'📗',xls:'📗',pptx:'📙',ppt:'📙',md:'📝',txt:'📄',html:'🌐',csv:'📊'};
  return m[String(ft||'').toLowerCase()] || '📄';
}

function renderStatusBadge(d){
  const chunk = d.chunk_status;
  const parse = d.parse_status;
  if (chunk === 'indexed') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-green-50 text-green-600 text-[10px] font-bold rounded-full border border-green-100">✓ 已入库</span>`;
  if (parse === 'failed' || chunk === 'failed') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-red-50 text-red-600 text-[10px] font-bold rounded-full border border-red-100">✗ 失败</span>`;
  if (parse === 'parsed') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded-full border border-blue-100"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse-slow"></span> 切分中</span>`;
  if (parse === 'parsing') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-purple-50 text-purple-600 text-[10px] font-bold rounded-full border border-purple-100"><span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-pulse-slow"></span> 解析中</span>`;
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-gray-50 text-gray-600 text-[10px] font-bold rounded-full border border-gray-100"><span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-pulse-slow"></span> 处理中</span>`;
}

function renderQualityBar(score){
  const pct = Math.round(score * 100);
  const color = score >= 0.75 ? 'bg-green-500' : score >= 0.5 ? 'bg-yellow-500' : 'bg-red-500';
  return `
    <div class="flex items-center gap-2">
      <div class="w-16 bg-gray-100 rounded-full h-1.5 overflow-hidden">
        <div class="${color} h-full" style="width:${pct}%"></div>
      </div>
      <span class="text-[10px] font-bold text-gray-700">${pct}</span>
    </div>
  `;
}

function openCreateKbModal(){ document.getElementById('createKbModal').classList.remove('hidden'); }

function openUploadModal(){
  if (!currentKb) return;
  pendingFiles = [];
  renderPendingFiles();
  document.getElementById('uploadTitle').value = '';
  document.getElementById('uploadModal').classList.remove('hidden');
}
function closeUploadModal(){ document.getElementById('uploadModal').classList.add('hidden'); }

document.addEventListener('DOMContentLoaded', () => {
  const drop = document.getElementById('uploadDrop');
  const input = document.getElementById('uploadInput');
  ['dragenter','dragover'].forEach(e=>drop.addEventListener(e, ev=>{ev.preventDefault();drop.classList.add('dragover');}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e, ev=>{ev.preventDefault();drop.classList.remove('dragover');}));
  drop.addEventListener('drop', ev => {
    ev.preventDefault();
    Array.from(ev.dataTransfer.files).forEach(f => pendingFiles.push(f));
    renderPendingFiles();
  });
  input.addEventListener('change', () => {
    Array.from(input.files).forEach(f => pendingFiles.push(f));
    input.value = '';
    renderPendingFiles();
  });
});

function renderPendingFiles(){
  const list = document.getElementById('uploadFileList');
  const btn = document.getElementById('uploadSubmitBtn');
  if (!pendingFiles.length){
    list.innerHTML = '';
    btn.disabled = true;
    return;
  }
  btn.disabled = false;
  list.innerHTML = pendingFiles.map((f, i) => `
    <div class="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2 text-xs">
      <span class="text-sm">${fileEmoji(f.name.split('.').pop())}</span>
      <span class="flex-1 truncate">${esc(f.name)}</span>
      <span class="text-gray-400">${fmtSize(f.size)}</span>
      <button onclick="removePendingFile(${i})" class="text-red-500 hover:text-red-600 font-bold">✕</button>
    </div>
  `).join('');
}

function removePendingFile(i){ pendingFiles.splice(i, 1); renderPendingFiles(); }

async function submitUpload(){
  if (!currentKb || !pendingFiles.length) return;
  const title = document.getElementById('uploadTitle').value.trim();
  const btn = document.getElementById('uploadSubmitBtn');
  btn.disabled = true;
  btn.textContent = '上传中...';
  let success = 0, failed = 0;
  for (const f of pendingFiles) {
    try {
      const fd = new FormData();
      fd.append('file', f);
      const params = new URLSearchParams({
        tenant_id: tenantId(),
        knowledge_base_id: currentKb.id,
        title: title || '',
      });
      const r = await fetch(`${API}/api/knowledge/documents/upload?${params}`, {
        method: 'POST', body: fd,
      });
      if (!r.ok) throw new Error(await r.text());
      const data = await r.json();
      success++;
      // 轮询任务进度
      if (data.task_id) startPolling(data.task_id);
    } catch (e) {
      failed++;
      console.error('Upload failed:', f.name, e);
    }
  }
  btn.disabled = false;
  btn.textContent = '上传';
  pendingFiles = [];
  closeUploadModal();
  if (failed > 0) toast(`${success} 成功, ${failed} 失败`, 'error');
  else toast(`${success} 个文档已入队`, 'success');
  // 稍等刷新
  setTimeout(loadDocuments, 500);
}

// ═══════════════════════════════════════════════════════════
// 任务轮询（自动刷新文档列表状态）
// ═══════════════════════════════════════════════════════════

function startPolling(taskId){
  if (activePolls.has(taskId)) return;
  const id = setInterval(async () => {
    try {
      const s = await apiGet(`/api/knowledge/tasks/${taskId}`);
      if (['success', 'failed', 'dead'].includes(s.queue_status || s.status)) {
        clearInterval(id);
        activePolls.delete(taskId);
        loadDocuments();  // 刷新
        loadKbs();        // 更新统计
      } else {
        // 中途也刷一下
        loadDocuments();
      }
    } catch (e) {
      clearInterval(id);
      activePolls.delete(taskId);
    }
  }, 3000);
  activePolls.set(taskId, id);
  // 30 秒兜底停止
  setTimeout(() => {
    if (activePolls.has(taskId)) {
      clearInterval(activePolls.get(taskId));
      activePolls.delete(taskId);
    }
  }, 120000);
}

async function openDocDetail(docId){
  const modal = document.getElementById('docModal');
  const drawer = document.getElementById('docDrawer');
  modal.classList.remove('hidden');
  // 触发滑入动画（下一帧移除 translate-x-full）
  requestAnimationFrame(() => {
    drawer.classList.remove('translate-x-full');
    drawer.classList.add('translate-x-0');
  });
  const body = document.getElementById('docModalBody');
  body.innerHTML = `<div class="text-center text-gray-400 py-10">加载中...</div>`;
  try {
    const [doc, chunks] = await Promise.all([
      apiGet(`/api/knowledge/documents/${docId}`),
      apiGet(`/api/knowledge/documents/${docId}/chunks?limit=20`),
    ]);
    document.getElementById('docModalTitle').textContent = doc.title || doc.file_name;
    body.innerHTML = renderDocDetail(doc, chunks.items || []);
  } catch (e) {
    body.innerHTML = `<div class="text-red-500 text-sm text-center py-10">${esc(e.message)}</div>`;
  }
}

function closeDocModal(){
  const modal = document.getElementById('docModal');
  const drawer = document.getElementById('docDrawer');
  drawer.classList.remove('translate-x-0');
  drawer.classList.add('translate-x-full');
  // 等动画结束再隐藏遮罩
  setTimeout(() => modal.classList.add('hidden'), 300);
}

// 点击遮罩关闭
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('docModal');
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeDocModal();
    });
  }
});

function renderDocDetail(doc, chunks){
  const metaEntries = Object.entries(doc.metadata || {}).filter(([k,v]) => v != null && v !== '');
  // 解析 keywords（可能是 JSON string 或 array）
  let keywords = [];
  try {
    keywords = typeof doc.keywords === 'string' ? JSON.parse(doc.keywords || '[]') : (doc.keywords || []);
  } catch(e) { keywords = []; }
  // 解析 candidate_keywords
  let candidates = [];
  try {
    candidates = typeof doc.candidate_keywords === 'string' ? JSON.parse(doc.candidate_keywords || '[]') : (doc.candidate_keywords || []);
  } catch(e) { candidates = []; }
  // 解析 quality_signals
  let qSignals = {};
  try {
    qSignals = typeof doc.quality_signals === 'string' ? JSON.parse(doc.quality_signals || '{}') : (doc.quality_signals || {});
  } catch(e) { qSignals = {}; }

  return `
    <!-- 摘要 -->
    ${doc.summary ? `
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">📝 摘要</h3>
      <div class="bg-gradient-to-r from-indigo-50 to-blue-50 border border-indigo-100 rounded-xl p-4 text-sm leading-relaxed text-gray-800">${esc(doc.summary)}</div>
    </div>` : ''}

    <!-- 关键词（LLM 精选） -->
    ${keywords.length ? `
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">🔑 关键词（LLM 精选）</h3>
      <div class="flex flex-wrap gap-1.5">
        ${keywords.map(kw => `
          <span class="inline-block bg-blue-50 text-blue-700 border border-blue-100 rounded-full px-2.5 py-0.5 text-xs font-medium">${esc(kw)}</span>
        `).join('')}
      </div>
    </div>` : ''}

    <!-- 候选关键词（TF-IDF 本地提取） -->
    ${candidates.length ? `
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">📊 候选关键词（TF-IDF Top-20）</h3>
      <div class="flex flex-wrap gap-1.5">
        ${candidates.map(kw => `
          <span class="inline-block bg-gray-50 text-gray-600 border border-gray-200 rounded-full px-2.5 py-0.5 text-[11px]">${esc(kw)}</span>
        `).join('')}
      </div>
    </div>` : ''}

    <!-- 元数据标签 -->
    ${metaEntries.length ? `
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">🏷️ 元数据标签</h3>
      <div class="flex flex-wrap gap-2">
        ${metaEntries.map(([k,v]) => `
          <span class="inline-flex items-center gap-1.5 bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-xs shadow-sm">
            <span class="text-gray-400 font-medium">${esc(k)}</span>
            <span class="font-bold text-gray-900">${esc(Array.isArray(v) ? v.join(', ') : v)}</span>
          </span>
        `).join('')}
      </div>
    </div>` : `
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">🏷️ 元数据标签</h3>
      <div class="text-xs text-gray-400 bg-gray-50 rounded-xl p-3">
        未配置元数据 Schema，无法自动打标。请在「元数据 Schema」中定义字段和枚举值。
      </div>
    </div>`}

    <!-- 质量评估 -->
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">📊 质量评估</h3>
      <div class="bg-gray-50 rounded-xl p-4">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl font-bold ${doc.quality_score >= 0.75 ? 'text-green-600' : doc.quality_score >= 0.5 ? 'text-yellow-600' : 'text-red-600'}">${Math.round((doc.quality_score || 0) * 100)}</span>
          <span class="text-xs text-gray-500">/ 100</span>
          ${renderQualityBar(doc.quality_score || 0)}
        </div>
        ${qSignals.completeness != null ? `
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="flex items-center justify-between bg-white rounded-lg px-3 py-2 border border-gray-100">
            <span class="text-gray-500">完整度</span>
            <span class="font-bold ${qSignals.completeness >= 0.8 ? 'text-green-600' : 'text-yellow-600'}">${Math.round((qSignals.completeness || 0) * 100)}%</span>
          </div>
          <div class="flex items-center justify-between bg-white rounded-lg px-3 py-2 border border-gray-100">
            <span class="text-gray-500">结构度</span>
            <span class="font-bold ${qSignals.structure >= 0.6 ? 'text-green-600' : 'text-yellow-600'}">${Math.round((qSignals.structure || 0) * 100)}%</span>
          </div>
          <div class="flex items-center justify-between bg-white rounded-lg px-3 py-2 border border-gray-100">
            <span class="text-gray-500">内容密度</span>
            <span class="font-bold ${qSignals.density >= 0.7 ? 'text-green-600' : 'text-yellow-600'}">${Math.round((qSignals.density || 0) * 100)}%</span>
          </div>
          <div class="flex items-center justify-between bg-white rounded-lg px-3 py-2 border border-gray-100">
            <span class="text-gray-500">清洗分数</span>
            <span class="font-bold ${qSignals.clean_score >= 0.9 ? 'text-green-600' : 'text-yellow-600'}">${Math.round((qSignals.clean_score || 0) * 100)}%</span>
          </div>
        </div>
        ` : '<div class="text-xs text-gray-400">暂无分项评估数据</div>'}
      </div>
    </div>

    <!-- 基础信息 -->
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">📋 基础信息</h3>
      <div class="bg-gray-50 rounded-xl p-4 grid grid-cols-2 gap-3 text-xs">
        <div><span class="text-gray-500">文件名</span><br/><span class="font-bold text-gray-900">${esc(doc.file_name)}</span></div>
        <div><span class="text-gray-500">类型</span><br/><span class="font-bold text-gray-900">${esc(doc.file_type)}</span></div>
        <div><span class="text-gray-500">切片数</span><br/><span class="font-bold text-gray-900">${doc.chunk_count || 0}</span></div>
        <div><span class="text-gray-500">段落数</span><br/><span class="font-bold text-gray-900">${doc.segment_count || 0}</span></div>
        <div><span class="text-gray-500">创建时间</span><br/><span class="font-bold text-gray-900">${fmtTime(doc.created_at)}</span></div>
        <div><span class="text-gray-500">Doc ID</span><br/><span class="font-mono text-[10px] text-gray-600">${esc(doc.doc_id)}</span></div>
      </div>
    </div>

    <!-- 切片预览 -->
    <div>
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">🧩 切片预览（前 ${chunks.length} 条）</h3>
      <div class="space-y-2">
        ${chunks.map(c => `
          <div class="bg-white border border-gray-100 rounded-xl p-3 text-xs">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold text-[10px]">#${c.chunk_index}</span>
              <span class="text-[10px] text-gray-500">${esc(c.chunk_type)}</span>
              ${c.section_title ? `<span class="text-[10px] text-gray-400">· ${esc(c.section_title)}</span>` : ''}
              <span class="ml-auto text-[10px] text-gray-400">${c.content_tokens} tokens · 命中 ${c.hit_count}</span>
              ${c.vector_synced === 1 ? '<span class="text-[10px] text-green-600">🧠 已索引</span>' : '<span class="text-[10px] text-yellow-600">⏳ 待同步</span>'}
            </div>
            <div class="text-gray-700 leading-relaxed">${esc(c.content_preview)}</div>
          </div>
        `).join('') || '<div class="text-gray-400 text-xs py-4 text-center">暂无切片</div>'}
      </div>
    </div>
  `;
}

async function deleteDoc(docId){
  if (!confirm('确定删除此文档？（包含所有切片和向量）')) return;
  try {
    await apiDelete(`/api/knowledge/documents/${docId}?tenant_id=${tenantId()}`);
    toast('文档已删除', 'success');
    // 删除后从服务端重取 KB 列表（拿到权威的最新统计）
    const prevKbId = currentKb ? String(currentKb.id) : null;
    await loadKbs();
    // 维持选中当前 KB，刷新文档列表 + 统计卡
    if (prevKbId) {
      const still = kbs.find(k => String(k.id) === prevKbId);
      if (still) {
        currentKb = still;
        renderKbList();
        renderStats();
        loadDocuments();
      }
    }
  } catch (e) {
    toast('删除失败: ' + e.message, 'error');
  }
}

// 人工触发重算 KB 统计（右键/工具菜单可用，修复历史脏数据）
async function recomputeKbStats(){
  if (!currentKb) return;
  try {
    const r = await apiPost(`/api/knowledge/${currentKb.id}/recompute-stats`, {});
    toast(`统计已重算：文档 ${r.document_count} / 切片 ${r.chunk_count}`, 'success');
    await loadKbs();
    const still = kbs.find(k => String(k.id) === String(currentKb.id));
    if (still) {
      currentKb = still;
      renderKbList();
      renderStats();
    }
  } catch (e) {
    toast('重算失败: ' + e.message, 'error');
  }
}

async function submitSchema(){

  const cleanFields = currentSchemaFields.filter(f => f.field && f.field.trim());

      tenant_id: tenantId(),

async function openScheduleModal(){
  document.getElementById('scheduleModal').classList.remove('hidden');
  await loadSchedules();
}
function closeScheduleModal(){ document.getElementById('scheduleModal').classList.add('hidden'); }

async function loadSchedules(){
  const list = document.getElementById('scheduleList');
  try {
    const data = await apiGet('/api/knowledge/maintenance/schedules');
    const tasks = data.items || [];
    if (!tasks.length){
      list.innerHTML = '<div class="text-center text-gray-400 text-xs py-8">暂无调度任务</div>';
      return;
    }
    list.innerHTML = tasks.map(t => renderScheduleCard(t)).join('');
  } catch(e) {
    list.innerHTML = `<div class="text-red-500 text-xs text-center py-8">${esc(e.message)}</div>`;
  }
}

function fmtInterval(ms){
  if (!ms) return {value: 0, unit: '分钟', factor: 60000};
  if (ms >= 86400000) return {value: (ms / 86400000).toFixed(1), unit: '天', factor: 86400000};
  if (ms >= 3600000)  return {value: (ms / 3600000).toFixed(1),  unit: '小时', factor: 3600000};
  return {value: Math.max(1, Math.round(ms / 60000)), unit: '分钟', factor: 60000};
}

function renderScheduleCard(t){
  const params = t.params || {};
  const iv = fmtInterval(t.interval_ms);
  const statusColor = t.last_run_status === 'success' ? 'text-green-600' : t.last_run_status === 'failed' ? 'text-red-600' : 'text-gray-400';
  return `
    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-3">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold text-gray-900">${esc(t.name)}</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold text-indigo-600 bg-indigo-50 border border-indigo-100">${esc(t.task_type)}</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold ${t.enabled ? 'bg-green-50 text-green-600 border border-green-100' : 'bg-gray-100 text-gray-500 border border-gray-200'}">${t.enabled ? '启用' : '停用'}</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleSchedule('${esc(t.name)}', ${t.enabled ? 0 : 1})" class="text-xs font-bold ${t.enabled ? 'text-yellow-600 hover:text-yellow-700' : 'text-green-600 hover:text-green-700'}">${t.enabled ? '停用' : '启用'}</button>
          <button onclick="runScheduleNow('${esc(t.name)}')" class="text-xs font-bold text-blue-600 hover:text-blue-700">立即执行</button>
        </div>
      </div>
      <p class="text-xs text-gray-500 mb-3">${esc(t.description)}</p>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="bg-white rounded-lg px-3 py-2 border border-gray-100">
          <span class="text-gray-400">执行间隔</span>
          <div class="font-bold text-gray-900 mt-0.5">
            <input type="number" value="${iv.value}" min="1" step="1"
              data-unit="${iv.unit}" data-factor="${iv.factor}"
              onchange="updateScheduleInterval('${esc(t.name)}', this.value, ${iv.factor})"
              class="w-16 bg-transparent border-b border-gray-300 text-center font-bold focus:border-blue-500 outline-none"/> ${iv.unit}
          </div>
        </div>
        ${renderScheduleParams(t, params)}
        <div class="bg-white rounded-lg px-3 py-2 border border-gray-100">
          <span class="text-gray-400">上次执行</span>
          <div class="font-bold ${statusColor} mt-0.5">${t.last_run_at ? fmtTime(t.last_run_at) : '从未执行'}</div>
        </div>
        <div class="bg-white rounded-lg px-3 py-2 border border-gray-100">
          <span class="text-gray-400">下次执行</span>
          <div class="font-bold text-gray-900 mt-0.5">${t.next_run_at ? fmtTime(t.next_run_at) : '—'}</div>
        </div>
        <div class="col-span-2 bg-white rounded-lg px-3 py-2 border border-gray-100">
          <span class="text-gray-400">累计执行</span>
          <span class="font-bold text-gray-900 ml-2">${t.run_count} 次</span>
          ${t.last_run_result ? `<span class="text-gray-400 ml-3">最近结果: ${esc(typeof t.last_run_result === 'string' ? t.last_run_result.substring(0, 120) : JSON.stringify(t.last_run_result).substring(0, 120))}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

async function toggleSchedule(name, enabled){
  try {
    await fetch(`${API}/api/knowledge/maintenance/schedules/${name}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled: !!enabled}),
    });
    toast(enabled ? '已启用' : '已停用', 'success');
    await loadSchedules();
  } catch(e) { toast('操作失败: ' + e.message, 'error'); }
}

async function updateScheduleInterval(name, value, factor){
  const ms = Math.round(parseFloat(value) * (factor || 86400000));
  if (!ms || ms < 60000) { toast('间隔至少 1 分钟', 'error'); return; }
  try {
    await fetch(`${API}/api/knowledge/maintenance/schedules/${name}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({interval_ms: ms}),
    });
    toast(`间隔已更新`, 'success');
    await loadSchedules();
  } catch(e) { toast('更新失败: ' + e.message, 'error'); }
}

async function updateScheduleParam(name, key, value){
  try {
    // 先获取当前 params
    const data = await apiGet('/api/knowledge/maintenance/schedules');
    const task = (data.items || []).find(t => t.name === name);
    const params = task ? (task.params || {}) : {};
    params[key] = value;
    await fetch(`${API}/api/knowledge/maintenance/schedules/${name}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({params}),
    });
    toast(`参数已更新: ${key}=${value}`, 'success');
  } catch(e) { toast('更新失败: ' + e.message, 'error'); }
}

async function runScheduleNow(name){
  if (!confirm(`确定立即执行「${name}」？`)) return;
  try {
    const r = await apiPost(`/api/knowledge/maintenance/schedules/${name}/run`, {});
    toast(`执行完成: ${JSON.stringify(r.result)}`, 'success');
    await loadSchedules();
  } catch(e) { toast('执行失败: ' + e.message, 'error'); }
}

// loadKbs() 由 initIdentity() 完成后触发
</script>
</body>
</html>
