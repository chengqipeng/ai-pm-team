<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG-UI 全链路评测 — DeepAgent</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f8fafc; }
@keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.3s ease-out; }
@keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
.progress-bar { transition: width 0.5s ease; }
.layer-card { transition: all 0.2s; cursor: pointer; }
.layer-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); }
.layer-card.active { border-color: #3b82f6; background: #eff6ff; }
</style>
</head>
<body class="min-h-screen">
<!-- 顶部导航 -->
<header class="bg-white/80 backdrop-blur-md border-b border-gray-200/50 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 text-gray-900 no-underline hover:opacity-80">
        <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <span class="font-bold text-sm">DeepAgent</span>
      </a>
      <span class="text-gray-300 mx-1">/</span>
      <span class="text-sm text-gray-500">评测</span>
      <span class="text-gray-300 mx-1">/</span>
      <span class="text-sm font-semibold text-gray-700">AG-UI 全链路</span>
    </div>
    <nav class="flex items-center gap-1">
      <a href="/" class="px-3 py-1.5 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">对话</a>
      <a href="/eval/chain" class="px-3 py-1.5 text-xs font-medium text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all no-underline">链路评测</a>
      <a href="/eval/agui" class="px-3 py-1.5 text-xs font-medium text-blue-600 bg-blue-50 rounded-lg transition-all no-underline">AG-UI全链路</a>
    </nav>
  </div>
</header>
<!-- 主内容 -->
<div class="max-w-7xl mx-auto px-6 py-8">
  <!-- 标题 -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">🌐 AG-UI 全链路评测中心</h1>
    <p class="text-sm text-gray-500 mt-2">覆盖入口层→推理层→协议层→A2UI层→传输层→端到端的完整评测</p>
  </div>

  <!-- 统计卡片 -->
  <div id="statsCards" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="text-xs text-gray-400 mb-1">评测层级</div>
      <div id="statLayers" class="text-2xl font-bold text-gray-900">-</div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="text-xs text-gray-400 mb-1">评测集</div>
      <div id="statSuites" class="text-2xl font-bold text-gray-900">-</div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="text-xs text-gray-400 mb-1">用例总数</div>
      <div id="statCases" class="text-2xl font-bold text-gray-900">-</div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="text-xs text-gray-400 mb-1">通过率</div>
      <div id="statPassRate" class="text-2xl font-bold text-green-600">-</div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="text-xs text-gray-400 mb-1">运行次数</div>
      <div id="statRuns" class="text-2xl font-bold text-gray-900">-</div>
    </div>
  </div>

  <!-- 操作栏 -->
  <div class="flex items-center gap-4 mb-6">
    <button onclick="runAllEval()" id="runAllBtn" class="px-5 py-2.5 bg-blue-600 text-white text-sm font-bold rounded-xl hover:bg-blue-700 transition-all shadow-sm flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      执行全部评测
    </button>
    <button onclick="runSelectedSuite()" id="runSuiteBtn" disabled class="opacity-40 px-4 py-2.5 bg-white text-gray-700 text-sm font-medium rounded-xl border border-gray-200 hover:border-blue-300 hover:text-blue-600 transition-all flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      执行选中集
    </button>
    <button onclick="runSelectedLayer()" id="runLayerBtn" class="px-4 py-2.5 bg-white text-gray-700 text-sm font-medium rounded-xl border border-gray-200 hover:border-blue-300 hover:text-blue-600 transition-all flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      执行选中层
    </button>
    <div id="progressArea" class="hidden flex-1">
      <div class="flex items-center gap-3">
        <div class="flex-1 bg-gray-200 rounded-full h-2">
          <div id="progressBar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width:0%"></div>
        </div>
        <span id="progressText" class="text-xs text-gray-500">0/0</span>
      </div>
    </div>
  </div>
  <!-- 层级卡片 -->
  <div class="mb-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-3">评测层级</h2>
    <div id="layerCards" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div>
  </div>

  <!-- 主体：左侧评测集列表 + 右侧结果 -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- 左侧：评测集 -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-3">评测集</h3>
        <div id="suiteList" class="space-y-2 max-h-[600px] overflow-y-auto"></div>
      </div>
    </div>

    <!-- 右侧：运行结果 -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-gray-700">运行结果</h3>
          <select id="runSelector" onchange="loadRunDetail(this.value)" class="text-xs border border-gray-200 rounded-lg px-3 py-1.5">
            <option value="">选择历史运行...</option>
          </select>
        </div>
        <!-- 雷达概览 -->
        <div id="radarArea" class="mb-4 hidden">
          <div class="grid grid-cols-6 gap-2" id="radarBars"></div>
        </div>
        <!-- 用例结果列表 -->
        <div id="resultList" class="space-y-2 max-h-[500px] overflow-y-auto">
          <div class="text-center text-gray-400 text-sm py-12">点击"执行全部评测"开始</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const API = '/api/eval/agui';
let selectedLayerId = null;

// ─── 初始化 ───
async function init() {
  await Promise.all([loadStats(), loadLayers(), loadSuites(), loadRuns()]);
}

async function loadStats() {
  try {
    const r = await fetch(`${API}/stats`);
    const d = await r.json();
    document.getElementById('statLayers').textContent = d.total_layers || 0;
    document.getElementById('statSuites').textContent = d.total_suites || 0;
    document.getElementById('statCases').textContent = d.total_cases || 0;
    document.getElementById('statPassRate').textContent = d.pass_rate ? `${(d.pass_rate*100).toFixed(1)}%` : '-';
    document.getElementById('statRuns').textContent = d.total_runs || 0;
  } catch(e) { console.error('loadStats', e); }
}

async function loadLayers() {
  try {
    const r = await fetch(`${API}/layers`);
    const d = await r.json();
    const container = document.getElementById('layerCards');
    const colors = ['blue','purple','amber','emerald','rose','cyan'];
    container.innerHTML = d.items.map((layer, i) => {
      const color = colors[i % colors.length];
      const rate = layer.pass_rate != null ? `${(layer.pass_rate*100).toFixed(0)}%` : '-';
      return `
        <div class="layer-card bg-white rounded-xl border border-gray-200 p-3 ${selectedLayerId===layer.id?'active':''}"
             onclick="selectLayer('${layer.id}')">
          <div class="text-xs font-bold text-${color}-600 mb-1">L${i+1}</div>
          <div class="text-sm font-semibold text-gray-800 truncate">${layer.name}</div>
          <div class="text-xs text-gray-400 mt-1">${layer.case_count} 用例</div>
          <div class="text-xs font-bold mt-1 ${rate!=='-'?'text-green-600':'text-gray-300'}">${rate}</div>
        </div>
      `;
    }).join('');
  } catch(e) { console.error('loadLayers', e); }
}

function selectLayer(layerId) {
  selectedLayerId = selectedLayerId === layerId ? null : layerId;
  loadLayers();
  loadSuites();
}

async function loadSuites() {
  try {
    const url = selectedLayerId ? `${API}/suites?layer_id=${selectedLayerId}` : `${API}/suites`;
    const r = await fetch(url);
    const d = await r.json();
    const container = document.getElementById('suiteList');
    if (!d.items.length) {
      container.innerHTML = '<div class="text-center text-gray-400 text-xs py-6">无评测集</div>';
      return;
    }
    container.innerHTML = d.items.map(s => {
      const isSelected = selectedSuiteId === s.id;
      return `
      <div class="p-3 rounded-lg border ${isSelected ? 'border-blue-400 bg-blue-50/50' : 'border-gray-100 hover:border-blue-200 hover:bg-blue-50/30'} transition-all cursor-pointer"
           onclick="selectSuite('${s.id}')">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded border ${isSelected ? 'bg-blue-500 border-blue-500' : 'border-gray-300'} flex items-center justify-center flex-shrink-0">
              ${isSelected ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
            </span>
            <span class="text-sm font-medium text-gray-800">${s.name}</span>
          </div>
          <span class="text-xs text-gray-400">${s.case_count}例</span>
        </div>
        <div class="text-xs text-gray-400 mt-1 truncate ml-6">${s.description||''}</div>
        <div class="flex items-center gap-2 mt-1 ml-6">
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${s.stage}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-50 text-blue-600">${s.layer_name}</span>
        </div>
      </div>
      `;
    }).join('');
    // 更新按钮状态
    updateRunSuiteBtn();
  } catch(e) { console.error('loadSuites', e); }
}

let selectedSuiteId = null;

function selectSuite(suiteId) {
  selectedSuiteId = selectedSuiteId === suiteId ? null : suiteId;
  loadSuites();
}

function updateRunSuiteBtn() {
  const btn = document.getElementById('runSuiteBtn');
  if (selectedSuiteId) {
    btn.disabled = false;
    btn.classList.remove('opacity-40');
  } else {
    btn.disabled = true;
    btn.classList.add('opacity-40');
  }
}

async function runSelectedSuite() {
  if (!selectedSuiteId) {
    alert('请先在左侧选择一个评测集');
    return;
  }
  await runStream({suite_ids: [selectedSuiteId]});
}
</script>
<script>
async function loadRuns() {
  try {
    const r = await fetch(`${API}/runs`);
    const d = await r.json();
    const sel = document.getElementById('runSelector');
    sel.innerHTML = '<option value="">选择历史运行...</option>' +
      d.items.map(run => {
        const t = new Date(run.created_at).toLocaleString('zh-CN');
        const rate = (run.pass_rate*100).toFixed(1);
        return `<option value="${run.run_id}">${t} — ${rate}% (${run.passed}/${run.total})</option>`;
      }).join('');
  } catch(e) {}
}

async function loadRunDetail(runId) {
  if (!runId) return;
  try {
    const r = await fetch(`${API}/runs/${runId}`);
    const d = await r.json();
    renderResults(d.cases || []);
    renderRadar(d.cases || []);
  } catch(e) { console.error('loadRunDetail', e); }
}

function renderResults(cases) {
  const container = document.getElementById('resultList');
  if (!cases.length) {
    container.innerHTML = '<div class="text-center text-gray-400 text-sm py-12">点击"执行全部评测"开始</div>';
    return;
  }

  // 按 layer_id 分组
  const layerNames = {
    layer_1_entry: '入口层', layer_2_reasoning: '推理层',
    layer_3_agui_protocol: 'AG-UI协议层', layer_4_a2ui: 'A2UI层',
    layer_5_transport: '传输层', layer_6_e2e: '端到端'
  };
  const layerColors = {
    layer_1_entry: 'blue', layer_2_reasoning: 'purple',
    layer_3_agui_protocol: 'amber', layer_4_a2ui: 'emerald',
    layer_5_transport: 'rose', layer_6_e2e: 'cyan'
  };

  // 按 layer 分组
  const grouped = {};
  cases.forEach(c => {
    const lid = c.layer_id || 'unknown';
    if (!grouped[lid]) grouped[lid] = [];
    grouped[lid].push(c);
  });

  let html = '';
  let globalIdx = 0;

  for (const [layerId, layerCases] of Object.entries(grouped)) {
    const name = layerNames[layerId] || layerId;
    const color = layerColors[layerId] || 'gray';
    const passed = layerCases.filter(c => c.status === 'passed').length;
    const total = layerCases.length;
    const rate = total > 0 ? Math.round(passed/total*100) : 0;

    html += `
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-${color}-500"></span>
            <span class="text-xs font-bold text-gray-700">${name}</span>
            <span class="text-[10px] text-gray-400">${passed}/${total}</span>
          </div>
          <span class="text-[10px] font-bold ${rate===100?'text-green-600':rate>=80?'text-blue-600':'text-red-500'}">${rate}%</span>
        </div>
        <div class="space-y-1.5">
    `;

    for (const c of layerCases) {
      const idx = globalIdx++;
      const statusIcon = c.status === 'passed' ? '✅' : c.status === 'error' ? '⚠️' : '❌';
      const assertions = (c.assertions||[]).map(a =>
        `<div class="flex items-start gap-1.5 text-xs py-0.5">
          <span class="${a.passed?'text-green-500':'text-red-500'} font-mono">${a.passed?'✓':'✗'}</span>
          <span class="text-gray-600 font-medium">${a.type}</span>
          <span class="text-gray-400 flex-1 truncate" title="${(a.detail||'').replace(/"/g,'&quot;')}">${a.detail||''}</span>
        </div>`
      ).join('');
      const rawOutput = c.raw_output ? JSON.stringify(c.raw_output, null, 2) : '';
      const errorMsg = c.error_message ? `<div class="text-xs text-red-500 mt-1">❗ ${c.error_message}</div>` : '';

      html += `
        <div class="rounded-lg border border-gray-100 hover:border-gray-200 animate-fade-in">
          <div class="p-2.5 cursor-pointer" onclick="toggleDetail('detail_${idx}')">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 min-w-0">
                <span class="flex-shrink-0">${statusIcon}</span>
                <span class="text-sm font-medium text-gray-800 truncate">${c.case_name||c.case_id}</span>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                <span class="text-[10px] text-gray-400">${Math.round(c.latency_ms)}ms</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-${color}-50 text-${color}-600">${c.stage||''}</span>
                <svg class="w-3 h-3 text-gray-400 transition-transform" id="arrow_${idx}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            ${c.input ? `<div class="text-xs text-gray-400 mt-1 truncate">输入: ${c.input}</div>` : ''}
            ${errorMsg}
          </div>
          <div id="detail_${idx}" class="hidden border-t border-gray-50 px-3 pb-3">
            <div class="mt-2 mb-1 text-[11px] font-semibold text-gray-500 uppercase">断言结果</div>
            <div class="space-y-0.5">${assertions || '<div class="text-xs text-gray-300">无断言</div>'}</div>
            ${rawOutput ? `
            <div class="mt-3 mb-1 text-[11px] font-semibold text-gray-500 uppercase">原始输出</div>
            <pre class="text-[11px] bg-gray-50 rounded-lg p-2 overflow-x-auto max-h-48 text-gray-600 whitespace-pre-wrap">${escapeHtml(rawOutput)}</pre>
            ` : ''}
          </div>
        </div>
      `;
    }

    html += '</div></div>';
  }

  container.innerHTML = html;
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  const idx = id.replace('detail_', '');
  const arrow = document.getElementById('arrow_' + idx);
  if (el.classList.contains('hidden')) {
    el.classList.remove('hidden');
    if (arrow) arrow.style.transform = 'rotate(180deg)';
  } else {
    el.classList.add('hidden');
    if (arrow) arrow.style.transform = '';
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderRadar(cases) {
  const area = document.getElementById('radarArea');
  const bars = document.getElementById('radarBars');
  if (!cases.length) { area.classList.add('hidden'); return; }
  area.classList.remove('hidden');

  // 按 layer_id 聚合
  const layerMap = {};
  cases.forEach(c => {
    const lid = c.layer_id || 'unknown';
    if (!layerMap[lid]) layerMap[lid] = {total:0, passed:0};
    layerMap[lid].total++;
    if (c.status === 'passed') layerMap[lid].passed++;
  });

  const layerNames = {
    layer_1_entry: '入口层', layer_2_reasoning: '推理层',
    layer_3_agui_protocol: '协议层', layer_4_a2ui: 'A2UI层',
    layer_5_transport: '传输层', layer_6_e2e: '端到端'
  };
  const colors = ['blue','purple','amber','emerald','rose','cyan'];

  bars.innerHTML = Object.entries(layerMap).map(([lid, v], i) => {
    const rate = (v.passed/v.total*100).toFixed(0);
    const color = colors[i%colors.length];
    const name = layerNames[lid] || lid;
    return `
      <div class="text-center">
        <div class="h-20 flex items-end justify-center mb-1">
          <div class="w-6 bg-${color}-100 rounded-t" style="height:${rate}%">
            <div class="w-full bg-${color}-500 rounded-t" style="height:${rate}%"></div>
          </div>
        </div>
        <div class="text-[10px] font-bold text-${color}-600">${rate}%</div>
        <div class="text-[10px] text-gray-500">${name}</div>
      </div>
    `;
  }).join('');
}
</script>
<script>
// ─── 执行评测 ───
async function runAllEval() {
  await runStream({});
}

async function runSelectedLayer() {
  if (!selectedLayerId) {
    alert('请先选择一个层级');
    return;
  }
  await runStream({layer_ids: [selectedLayerId]});
}

async function runStream(body) {
  const btn = document.getElementById('runAllBtn');
  const progress = document.getElementById('progressArea');
  const bar = document.getElementById('progressBar');
  const text = document.getElementById('progressText');
  const container = document.getElementById('resultList');

  btn.disabled = true;
  btn.classList.add('opacity-50');
  progress.classList.remove('hidden');
  container.innerHTML = '';

  try {
    const response = await fetch(`${API}/run-stream`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let results = [];

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.event === 'start') {
            text.textContent = `0/${data.total}`;
          } else if (data.event === 'case_complete') {
            const pct = (data.index / data.total * 100).toFixed(0);
            bar.style.width = pct + '%';
            text.textContent = `${data.index}/${data.total}`;
            results.push(data);
            renderResults(results);
          } else if (data.event === 'complete') {
            bar.style.width = '100%';
            text.textContent = `完成 — ${(data.pass_rate*100).toFixed(1)}%`;
            renderRadar(results);
            await loadStats();
            await loadRuns();
            await loadLayers();
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    console.error('runStream error', e);
    container.innerHTML = `<div class="text-center text-red-500 text-sm py-8">执行出错: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove('opacity-50');
  }
}

// 启动
init();
</script>
</body>
</html>
