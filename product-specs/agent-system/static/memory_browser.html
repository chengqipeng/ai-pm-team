<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长期记忆 - DeepAgent AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.animate-fade-in { animation: fade-in 0.3s ease-out; }
</style>
</head>
<body>
<div class="flex h-screen w-full bg-[#f4f7fb] font-sans text-slate-800 overflow-hidden relative">
  <!-- 氛围背景 -->
  <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-indigo-400/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- 左侧边栏 -->
  <aside class="w-72 flex flex-col z-20 shrink-0 bg-white/40 backdrop-blur-xl border-r border-gray-200/50">
    <div class="p-6">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <span class="font-bold text-lg tracking-tight text-gray-900">长期记忆</span>
      </div>
      <!-- 导航 -->
      <div class="space-y-1 mb-6">
        <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-gray-500 hover:bg-white/60 hover:text-blue-600 transition-all no-underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          返回对话
        </a>
        <a href="/knowledge" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-gray-500 hover:bg-white/60 hover:text-blue-600 transition-all no-underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>
          知识库
        </a>
        <a href="/trace" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-gray-500 hover:bg-white/60 hover:text-blue-600 transition-all no-underline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Trace 链路
        </a>
      </div>
      <!-- 筛选 -->
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 block">租户 ID</label>
          <input id="tenant-input" type="number" value="1" onchange="loadUsers()" class="w-full bg-gray-100/50 border-none rounded-xl py-2 px-3 text-xs focus:ring-2 focus:ring-blue-500/20 placeholder:text-gray-400"/>
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 block">搜索用户</label>
          <div class="relative">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="user-search" type="text" placeholder="输入用户ID..." oninput="filterUsers()" class="w-full bg-gray-100/50 border-none rounded-xl py-2 pl-9 pr-3 text-xs focus:ring-2 focus:ring-blue-500/20 placeholder:text-gray-400"/>
          </div>
        </div>
        <button onclick="clearAllMemories()" class="w-full py-2 px-3 bg-red-50 border border-red-100 rounded-xl text-xs font-bold text-red-500 hover:bg-red-100 transition-all">🗑 清空所有记忆</button>
      </div>
    </div>
    <!-- 用户列表 -->
    <div id="user-list" class="flex-1 overflow-y-auto custom-scrollbar px-4 pb-4 space-y-1">
      <div class="text-center text-gray-400 text-xs py-10">加载中...</div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="flex-1 flex flex-col min-w-0 relative z-10">
    <!-- 头部 -->
    <div id="header" class="px-8 py-5 bg-white/40 backdrop-blur-md border-b border-gray-200/50 shrink-0">
      <h1 class="text-lg font-bold text-gray-900">选择一个用户</h1>
      <p class="text-xs text-gray-400 mt-1">从左侧选择用户查看长期记忆</p>
    </div>
    <!-- 分类标签 -->
    <div id="cat-tabs" class="hidden px-8 py-3 bg-white/30 border-b border-gray-200/30 flex gap-2 flex-wrap"></div>
    <!-- 记忆列表 -->
    <div id="memory-list" class="flex-1 overflow-y-auto custom-scrollbar px-8 py-6">
      <div class="text-center text-gray-400 text-sm py-20">
        <div class="text-4xl mb-3">👈</div>
        <p>从左侧选择用户查看长期记忆</p>
      </div>
    </div>
  </main>
</div>

<script>
const API = '';
let allUsers = [], currentUser = null, currentCategory = 'all', allMemories = [];

function esc(t){if(!t)return'';const d=document.createElement('div');d.textContent=String(t);return d.innerHTML}
function fmtTime(ts){if(!ts)return'—';const d=new Date(typeof ts==='number'&&ts>1e12?ts:ts*1000);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}

const CAT_LABELS={profile:'身份',preferences:'偏好',entities:'洞察',agent_rules:'准则',events:'事件',cases:'案例',patterns:'模式',tools:'工具',skills:'技能',soul:'画像'};
const CAT_ICONS={profile:'👤',preferences:'⚙️',entities:'🏢',agent_rules:'📋',events:'📅',cases:'💡',patterns:'🔄',tools:'🔧',skills:'⚡',soul:'🌟'};
const CAT_COLORS={profile:'bg-blue-50 text-blue-600 border-blue-100',preferences:'bg-green-50 text-green-600 border-green-100',entities:'bg-orange-50 text-orange-600 border-orange-100',agent_rules:'bg-purple-50 text-purple-600 border-purple-100',events:'bg-pink-50 text-pink-600 border-pink-100',cases:'bg-indigo-50 text-indigo-600 border-indigo-100',patterns:'bg-teal-50 text-teal-600 border-teal-100',tools:'bg-gray-50 text-gray-600 border-gray-200',skills:'bg-lime-50 text-lime-600 border-lime-100',soul:'bg-red-50 text-red-600 border-red-100'};

async function loadUsers(){
  const tenantId=document.getElementById('tenant-input').value||'1';
  try{
    const res=await fetch(`${API}/api/memory/users?tenant_id=${tenantId}`);
    const data=await res.json();
    allUsers=data.users||[];
    renderUsers(allUsers);
  }catch(e){document.getElementById('user-list').innerHTML='<div class="text-center text-red-400 text-xs py-10">加载失败</div>'}
}

function filterUsers(){
  const q=document.getElementById('user-search').value.toLowerCase();
  renderUsers(q?allUsers.filter(u=>u.user_id.toLowerCase().includes(q)):allUsers);
}

function renderUsers(users){
  const el=document.getElementById('user-list');
  if(!users.length){el.innerHTML='<div class="text-center text-gray-400 text-xs py-10">暂无用户</div>';return}
  el.innerHTML=users.map(u=>`
    <div onclick="selectUser('${esc(u.user_id)}')" class="group flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-all ${currentUser===u.user_id?'bg-white shadow-sm ring-1 ring-black/5 text-blue-600':'text-gray-600 hover:bg-white/60 hover:text-gray-900'}">
      <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">${esc(u.user_id.slice(0,2))}</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate">${esc(u.user_id)}</p>
        <p class="text-[10px] text-gray-400">${u.total_count} 条 · ${Object.keys(u.by_category||{}).length} 类</p>
      </div>
      <button onclick="event.stopPropagation();deleteUser('${esc(u.user_id)}')" class="hidden group-hover:flex w-5 h-5 items-center justify-center rounded text-red-400 hover:bg-red-50 text-[10px]">✕</button>
    </div>`).join('');
}

async function clearAllMemories(){
  if(!confirm('⚠️ 确认清空当前租户下所有用户的全部记忆？'))return;
  if(!confirm('再次确认：这将删除所有记忆数据，确定继续？'))return;
  const tenantId=document.getElementById('tenant-input').value||'1';
  try{
    const res=await fetch(`${API}/api/memory/all?tenant_id=${tenantId}`,{method:'DELETE'});
    const data=await res.json();
    if(data.success){alert(`清空完成！已删除 ${data.pg_deleted} 条记忆。`);allUsers=[];renderUsers([]);currentUser=null;
      document.getElementById('header').innerHTML='<h1 class="text-lg font-bold text-gray-900">选择一个用户</h1>';
      document.getElementById('cat-tabs').classList.add('hidden');
      document.getElementById('memory-list').innerHTML='<div class="text-center text-gray-400 text-sm py-20"><div class="text-4xl mb-3">✅</div><p>所有记忆已清空</p></div>';
    }else{alert('清空失败: '+(data.error||'未知错误'))}
  }catch(e){alert('清空失败: '+e.message)}
}

async function deleteUser(userId){
  if(!confirm('确认删除用户 '+userId+' 的所有记忆？'))return;
  const tenantId=document.getElementById('tenant-input').value||'1';
  try{
    await fetch(API+'/api/memory/user/'+encodeURIComponent(userId)+'?tenant_id='+tenantId,{method:'DELETE'});
    allUsers=allUsers.filter(u=>u.user_id!==userId);renderUsers(allUsers);
    if(currentUser===userId){currentUser=null;
      document.getElementById('header').innerHTML='<h1 class="text-lg font-bold text-gray-900">选择一个用户</h1>';
      document.getElementById('cat-tabs').classList.add('hidden');
      document.getElementById('memory-list').innerHTML='<div class="text-center text-gray-400 text-sm py-20"><div class="text-4xl mb-3">👈</div><p>从左侧选择用户</p></div>';
    }
  }catch(e){alert('删除失败: '+e.message)}
}

async function selectUser(userId){
  currentUser=userId;currentCategory='all';renderUsers(allUsers.filter(u=>true));
  const tenantId=document.getElementById('tenant-input').value||'1';
  document.getElementById('memory-list').innerHTML='<div class="text-center text-gray-400 text-xs py-20">加载中...</div>';
  try{
    const res=await fetch(`${API}/api/memory/list?tenant_id=${tenantId}&user_id=${userId}`);
    const data=await res.json();
    allMemories=data.memories||[];
    const byCat={};allMemories.forEach(m=>{byCat[m.category]=(byCat[m.category]||0)+1});

    document.getElementById('header').innerHTML=`
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-gray-900">👤 ${esc(userId)}</h1>
          <p class="text-xs text-gray-400 mt-1">租户 ${tenantId} · ${allMemories.length} 条记忆</p>
        </div>
      </div>
      <div class="flex gap-3 mt-4 flex-wrap">
        ${Object.entries(byCat).map(([c,n])=>`<div class="text-center bg-white/60 rounded-xl px-4 py-2 border border-white/60 shadow-sm"><div class="text-base font-bold text-blue-600">${n}</div><div class="text-[10px] text-gray-400 mt-0.5">${CAT_ICONS[c]||'📋'} ${CAT_LABELS[c]||c}</div></div>`).join('')}
      </div>`;

    const tabsEl=document.getElementById('cat-tabs');
    tabsEl.classList.remove('hidden');
    tabsEl.innerHTML=`<button onclick="filterCategory('all')" class="px-3 py-1.5 rounded-full text-[11px] font-bold transition-all ${currentCategory==='all'?'bg-blue-600 text-white shadow-sm':'bg-white/60 text-gray-500 hover:bg-white border border-gray-200/50'}">全部 ${allMemories.length}</button>`+
      Object.entries(byCat).map(([c,n])=>`<button onclick="filterCategory('${c}')" class="px-3 py-1.5 rounded-full text-[11px] font-bold transition-all ${currentCategory===c?'bg-blue-600 text-white shadow-sm':'bg-white/60 text-gray-500 hover:bg-white border border-gray-200/50'}">${CAT_ICONS[c]||''} ${CAT_LABELS[c]||c} ${n}</button>`).join('');

    renderMemories(allMemories);
  }catch(e){document.getElementById('memory-list').innerHTML=`<div class="text-center text-red-400 text-sm py-20">加载失败: ${e.message}</div>`}
}

function filterCategory(cat){
  currentCategory=cat;
  selectUser(currentUser);
}

function renderMemories(memories){
  const el=document.getElementById('memory-list');
  if(!memories.length){el.innerHTML='<div class="text-center text-gray-400 text-sm py-20"><div class="text-4xl mb-3">📭</div><p>该分类下暂无记忆</p></div>';return}
  const filtered=currentCategory==='all'?memories:memories.filter(m=>m.category===currentCategory);
  if(!filtered.length){el.innerHTML='<div class="text-center text-gray-400 text-sm py-20"><div class="text-4xl mb-3">📭</div><p>该分类下暂无记忆</p></div>';return}

  // 构建虚拟目录树：category → parent_entity → [memories]
  const tree = {};
  filtered.forEach((m,i)=>{
    const cat = m.category || 'other';
    const parent = m.parent_entity || m.merge_key || '(未分组)';
    if(!tree[cat]) tree[cat] = {};
    if(!tree[cat][parent]) tree[cat][parent] = [];
    tree[cat][parent].push({...m, _idx: i});
  });

  let html = '';
  for(const [cat, groups] of Object.entries(tree)){
    const catLabel = (CAT_ICONS[cat]||'📋') + ' ' + (CAT_LABELS[cat]||cat);
    const catCount = Object.values(groups).reduce((s,arr)=>s+arr.length, 0);
    html += `<div class="mb-4">
      <div class="flex items-center gap-2 px-2 py-2 cursor-pointer select-none" onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('.dir-arrow').classList.toggle('rotate-90')">
        <svg class="dir-arrow w-3 h-3 text-gray-400 transition-transform rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="text-xs font-bold text-gray-600">${catLabel}</span>
        <span class="text-[10px] text-gray-400">(${catCount})</span>
      </div>
      <div class="pl-4 border-l-2 border-gray-100 ml-1.5">`;

    const groupEntries = Object.entries(groups);
    // 如果只有一个分组且是"(未分组)"，直接展示记忆不加子目录
    if(groupEntries.length === 1 && groupEntries[0][0] === '(未分组)'){
      groupEntries[0][1].forEach(m=>{
        html += renderMemoryCard(m);
      });
    } else {
      for(const [parent, mems] of groupEntries){
        html += `<div class="mb-2">
          <div class="flex items-center gap-2 px-1 py-1.5 cursor-pointer select-none" onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('.dir-arrow').classList.toggle('rotate-90')">
            <svg class="dir-arrow w-2.5 h-2.5 text-gray-300 transition-transform rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>
            <span class="text-[11px] text-gray-500">📁 ${esc(parent)}</span>
            <span class="text-[10px] text-gray-300">(${mems.length})</span>
          </div>
          <div class="pl-4 border-l border-gray-50 ml-1">`;
        mems.forEach(m=>{
          html += renderMemoryCard(m);
        });
        html += `</div></div>`;
      }
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function renderMemoryCard(m){
  const i = m._idx;
  return `
    <div id="card-${i}" class="mb-2 rounded-xl bg-white/70 backdrop-blur-sm border border-white/40 shadow-sm hover:shadow-md transition-all overflow-hidden">
      <div onclick="toggleCard(${i})" class="flex items-start gap-2 p-3 cursor-pointer">
        <div class="flex-1 min-w-0">
          <p class="text-[12px] leading-relaxed text-gray-800">${esc(m.abstract)}</p>
          <div class="flex items-center gap-2 mt-1.5 flex-wrap">
            ${m.merge_key?`<span class="text-[10px] text-gray-400">🔑 ${esc(m.merge_key)}</span>`:''}
            <span class="text-[10px] px-1.5 py-0.5 rounded ${m.source_type==='system_data'?'bg-orange-50 text-orange-500':'bg-green-50 text-green-500'}">${m.source_type==='system_data'?'系统':'洞察'}</span>
            <span class="text-[10px] text-gray-300">📅 ${fmtTime(m.updated_at)}</span>
          </div>
        </div>
        <button onclick="event.stopPropagation();deleteMemory('${m.memory_id||m.id}',${i})" class="w-5 h-5 flex items-center justify-center rounded text-red-300 hover:bg-red-50 hover:text-red-500 text-[10px] transition-all">✕</button>
        <svg class="card-arrow w-3.5 h-3.5 text-gray-300 shrink-0 mt-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="card-detail hidden border-t border-gray-100/50 p-3 bg-gray-50/30 space-y-2 text-xs">
        ${m.content?`<div><span class="text-[10px] font-bold text-gray-400">内容:</span><p class="text-gray-700 mt-0.5 whitespace-pre-wrap">${esc(m.content)}</p></div>`:''}
        ${m.overview?`<div><span class="text-[10px] font-bold text-gray-400">概览:</span><pre class="bg-white rounded-lg p-2 border border-gray-100 text-[11px] text-gray-600 whitespace-pre-wrap mt-0.5">${esc(m.overview)}</pre></div>`:''}
        <div class="flex gap-2 pt-1">
          <button onclick="event.stopPropagation();archiveMemory('${m.memory_id||m.id}',${i})" class="px-2 py-1 rounded-lg text-[10px] bg-white border border-gray-200 text-gray-500 hover:border-blue-300 hover:text-blue-600">📦 归档</button>
          <button onclick="event.stopPropagation();deleteMemory('${m.memory_id||m.id}',${i})" class="px-2 py-1 rounded-lg text-[10px] bg-white border border-gray-200 text-red-400 hover:border-red-300 hover:bg-red-50">🗑 删除</button>
        </div>
      </div>
    </div>`;
}

function toggleCard(i){
  const card=document.getElementById('card-'+i);
  const detail=card.querySelector('.card-detail');
  const arrow=card.querySelector('.card-arrow');
  detail.classList.toggle('hidden');
  arrow.classList.toggle('rotate-90');
}

async function archiveMemory(id,idx){
  if(!confirm('确认归档该记忆？'))return;
  try{
    const tenantId=document.getElementById('tenant-input').value||'1';
    await fetch(`${API}/api/memory/${id}/archive`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:parseInt(tenantId)})});
    allMemories[idx].status='archived';renderMemories(allMemories);
  }catch(e){alert('归档失败: '+e.message)}
}

async function deleteMemory(id,idx){
  if(!confirm('确认删除该记忆？'))return;
  try{
    const tenantId=document.getElementById('tenant-input').value||'1';
    await fetch(`${API}/api/memory/${id}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:parseInt(tenantId)})});
    allMemories.splice(idx,1);renderMemories(allMemories);
  }catch(e){alert('删除失败: '+e.message)}
}

loadUsers();
</script>
</body>
</html>
