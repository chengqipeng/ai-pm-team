[tool.poetry]
name = "deepagent"
version = "0.1.0"
description = "面向 2B CRM SaaS 的 Agent 系统 — 图状态机编排引擎"
authors = ["AI Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
openai = ">=2.26"          # DeepSeek API（OpenAI-Compatible）
pyyaml = "^6.0.3"
langchain = "^1.2.15"
langgraph = "^1.1.9"
langchain-openai = "^1.1.16"
aiosqlite = "^0.22.1"
chromadb = "^1.5.8"
fastapi = "^0.136.0"
uvicorn = "^0.46.0"
python-multipart = "^0.0.26"
psycopg2-binary = "^2.9"
tencentcloud-sdk-python = ">=3.1.86"  # 腾讯云 LKEAP 文档解析
httpx = ">=0.27"                       # Metarepo / EntityData HTTP backend
tcvectordb = ">=1.6"                  # 腾讯云向量数据库（knowledge + memory）
tcvdb-text = ">=0.1"                  # BM25 稀疏向量编码（混合检索）
jieba = ">=0.42"                      # 中文分词 + TF-IDF 关键词提取
e2b = "^2.23.1"
deepeval = "^4.0.5"
arize-phoenix = {version = "^17.2.0", python = ">=3.11,<3.15"}
openinference-instrumentation-langchain = {version = "^0.1.66", python = ">=3.11,<3.15"}
headroom-ai = {version = "^0.25", extras = ["ml", "code"], optional = true, python = ">=3.11,<3.14"}  # Headroom 压缩引擎

[tool.poetry.extras]
headroom = ["headroom-ai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.poetry.scripts]
deepagent-demo = "demo:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
