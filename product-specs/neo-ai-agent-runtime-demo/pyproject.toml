[project]
name = "neo-ai-agent-runtime-demo"
version = "0.1.0"
description = "Agent 运行时 Demo — 演示通过 FeignClient 加载远程 Tool/Middleware 并执行 Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Neo AI Team" }]

dependencies = [
    "neo-ai-registry-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
