[project]
name = "neo-ai-provider-demo"
version = "0.1.0"
description = "业务域服务 Demo — 演示如何使用 Registry 内置 Tool/Middleware 并暴露 Provider API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Neo AI Team" }]

dependencies = [
    "neo-ai-registry-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
