  documents:
    - doc_title: CRM 审批流配置指南
      knowledge_base: kb_001
      chunks:
        - content: 审批流配置步骤：1.进入设置→流程管理→审批流；2.点击新建审批流；3.选择触发对象；4.设置审批条件和审批人。
          score: 0.95
        - content: 审批流支持的条件类型：字段值判断、角色判断、部门判断、金额范围判断。
          score: 0.88
    - doc_title: 工作流自动化操作手册
      knowledge_base: kb_001
      chunks:
        - content: 工作流触发条件包括：记录创建时、记录更新时、定时触发、手动触发。
          score: 0.92
    - doc_title: 商机阶段推进最佳实践
      knowledge_base: kb_002
      chunks:
        - content: 商机从需求确认推进到方案报价阶段，关键动作：确认决策链、完成POC、获取预算确认。
          score: 0.90

