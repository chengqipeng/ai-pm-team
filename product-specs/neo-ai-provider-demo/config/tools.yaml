# Provider Tool 注册配置
# 定义本服务对外暴露的 Tool 列表，启动时加载并匹配 handler

tools:
  # ═══ Agent 直接调用的业务 Tool ═══
  - api_key: query_customer
    name: 查询客户
    description: 根据客户名称、行业等条件查询 CRM 客户信息，返回客户档案。
    type: remote
    category: crm
    tags: [客户, 查询]
    timeout_ms: 5000
    input_schema:
      type: object
      properties:
        customer_name:
          type: string
          description: 客户名称（模糊匹配）
        industry:
          type: string
          description: 行业
      required: [customer_name]

  - api_key: update_opportunity
    name: 更新商机
    description: 更新商机阶段、金额、预计成交日期等信息。
    type: remote
    category: crm
    tags: [商机, 更新]
    read_only_flg: false
    timeout_ms: 5000
    input_schema:
      type: object
      properties:
        opportunity_id:
          type: string
          description: 商机 ID
        stage:
          type: string
          description: 商机阶段
        amount:
          type: number
          description: 金额
      required: [opportunity_id]

  - api_key: analyze_pipeline
    name: 分析销售管道
    description: 对销售管道数据进行多维度聚合分析。
    type: remote
    category: analytics
    tags: [分析, 管道]
    timeout_ms: 10000
    input_schema:
      type: object
      properties:
        group_by:
          type: string
          description: 分组维度（stage/owner/month）
        date_range:
          type: string
          description: 时间范围

  # ═══ MCP 回调的 Tool（MCP Demo 通过 FeignClient 调用） ═══
  - api_key: query_records
    name: 查询CRM数据记录
    type: remote
    category: mcp-crm

  - api_key: get_record_details
    name: 获取记录详情
    type: remote
    category: mcp-crm

  - api_key: create_record
    name: 创建CRM记录
    type: remote
    category: mcp-crm
    read_only_flg: false

  - api_key: search_knowledge
    name: 语义检索知识库
    type: remote
    category: mcp-knowledge

  - api_key: list_knowledge_bases
    name: 列出知识库
    type: remote
    category: mcp-knowledge

  - api_key: list_entities
    name: 列出业务实体
    type: remote
    category: mcp-metadata

  - api_key: get_entity_fields
    name: 获取实体字段
    type: remote
    category: mcp-metadata

# Middleware 注册配置
middlewares:
  - api_key: crm_query_state
    name: CRM 查询状态管理
    description: 维护 CRM 查询 Agent 的查询状态，跟踪实体识别和 XOQL 生成过程。
    hooks: [before_agent, after_model]
    module_path: app.middleware_handlers
    class_name: CrmQueryStateMiddleware
    sort_num: 50

  - api_key: sales_context_inject
    name: 销售上下文注入
    description: 在模型调用前注入当前用户的销售上下文。
    hooks: [before_model]
    module_path: app.middleware_handlers
    class_name: SalesContextInjectMiddleware
    sort_num: 30
    required_features: [memory_enabled]
