[project]
name = "neo-ai-registry-sdk"
version = "0.1.0"
description = "Agent 切面注册器 SDK — Tool / Middleware 定义与加载的统一 Python 包"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Neo AI Team" }]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "neo-ai-infr-eureka",
    "neo-ai-infr-basic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo_ai_registry"]
